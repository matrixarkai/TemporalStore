[package]
name = "temporalstore-snapshot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "S3-compatible Raft snapshot storage for TemporalStore: object store, manifests, retention, and metrics."
repository = "https://github.com/matrixarkai/TemporalStore"
homepage = "https://github.com/matrixarkai/TemporalStore"
keywords = ["temporalstore", "raft", "snapshot", "s3", "storage"]
categories = ["database-implementations", "data-structures"]

[dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
prometheus-client = "=0.22.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
uuid = { version = "=1.8.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "=3.10.1"
