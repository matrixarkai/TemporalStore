[package]
name = "temporalstore-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust-native TemporalStore engine, storage, client/proxy, and production Raft readiness surfaces."
readme = "README.md"
repository = "https://github.com/bjmeetsfo/TemporalStore"

[dependencies]
bytes = "1"
hex = "0.4"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustraft = { git = "https://github.com/bjmeetsfo/RustRaft.git", rev = "5ef82eca8cb06e5e69e6414afc2dfe57db9ff5c1" }
rustmtcache = { git = "https://github.com/bjmeetsfo/rustmtcache.git", rev = "6254945b4647161f3197447cb0fb7082d82341f0" }
temporalstore-snapshot = { path = "../temporalstore-snapshot" }
thiserror = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "transport"] }
uuid = { version = "=1.8.0", features = ["v4", "serde"] }
zstd = "0.13"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[features]
default = ["temporal-raft-engine"]
temporal-raft-engine = []

[[bin]]
name = "matrixark_rust_proxy"
path = "src/bin/matrixark_rust_proxy.rs"

[[bin]]
name = "matrixark_rust_direct_sdk"
path = "src/bin/matrixark_rust_direct_sdk.rs"

[[bin]]
name = "matrixark_record_log"
path = "src/bin/matrixark_record_log.rs"

[dev-dependencies]
async-trait = "0.1"
tempfile = "=3.10.1"
