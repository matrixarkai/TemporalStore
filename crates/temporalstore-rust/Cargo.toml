[package]
name = "temporalstore-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust-native TemporalStore engine, storage, client/proxy, and production Raft readiness surfaces."
readme = "README.md"
repository = "https://github.com/matrixarkai/TemporalStore"
homepage = "https://github.com/matrixarkai/TemporalStore"
keywords = ["temporalstore", "database", "storage", "raft", "memory"]
categories = ["database-implementations", "data-structures"]

[dependencies]
tempfile = "=3.10.1"
ahash = "0.8"
async-trait = "0.1"
bytes = "1"
crc32c = "0.6.9"
rmp-serde = "1.3"
hex = "0.4"
parking_lot = "0.12.5"
prost = "0.13"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
bloomfilter = { version = "3.0.2", default-features = false }
sha2 = "0.10"
matrixraft = { package = "matrixraft", git = "https://github.com/matrixarkai/MatrixRaft.git", rev = "58fb9573db087635877323dfbc2bb2ddf2e65702" }
matrixcache = { git = "https://github.com/matrixarkai/matrixcache.git", rev = "8b5f929fa686c02f02a681d15cb283ddf30ed258", features = ["rocksdb-ssd"] }
matrixobjectstore-rs = { git = "https://github.com/matrixarkai/MatrixObject.git", rev = "1cadb6888114ae63c5490140988d558b86b8c4a8" }
temporalstore-snapshot = { path = "../temporalstore-snapshot" }
thiserror = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "=1.8.0", features = ["v4", "serde"] }
zstd = "0.13"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[features]
default = ["temporal-raft-engine"]
temporal-raft-engine = []
open-source-surface = []
# Installs a counting global allocator in TEST builds so a request path's allocations can be
# measured directly; process RSS cannot resolve a per-request change. Off by default and never
# part of a normal `cargo test`: a global allocator wrapper adds two atomics to every allocation
# in the process, and with it installed a full single-threaded run turned 17 socket-bound proxy
# and raft tests red that pass individually, as a group, and in a run without it. A measurement
# tool has no business perturbing the suite that is meant to be checking the change.
#   cargo test --features alloc-probe --lib what_a_retrieve_allocates -- --ignored --nocapture
alloc-probe = []
# MatrixObject is reached only through a cluster, directly or through a gateway, and the
# crate that does it is an ordinary dependency (Apache-2.0, pinned by revision above like the
# cache and consensus dependencies). There is no feature to switch it on: a build that
# compiled without it could not serve the cluster path every node is configured for.

[[bin]]
# Needs the counting allocator to say anything; it refuses to run without it rather than printing
# a table of zeros.
name = "alloc_class_scale_harness"
path = "src/bin/alloc_class_scale_harness.rs"

[[bin]]
name = "matrixark_rust_proxy"
path = "src/bin/matrixark_rust_proxy.rs"

[[bin]]
name = "matrixark_rust_direct_sdk"
path = "src/bin/matrixark_rust_direct_sdk.rs"

[[bin]]
name = "matrixark_rust_metaserver"
path = "src/bin/matrixark_rust_metaserver.rs"

[[bin]]
name = "raft_barrier_profile"
path = "src/bin/raft_barrier_profile.rs"

[[bin]]
name = "matrixark_rust_datanode"
path = "src/bin/matrixark_rust_datanode.rs"

[[bin]]
name = "matrixark_rust_service_proxy"
path = "src/bin/matrixark_rust_service_proxy.rs"

[[bin]]
name = "native_persistence_workflow"
path = "src/bin/native_persistence_workflow.rs"

[dev-dependencies]
matrixobject-client = { git = "https://github.com/matrixarkai/MatrixObject.git", rev = "1cadb6888114ae63c5490140988d558b86b8c4a8" }
async-trait = "0.1"
fastcdc = { version = "5.0", default-features = false }
syn = { version = "2", features = ["full", "visit"] }

[[bin]]
name = "client"
path = "src/bin/temporalstore_command_client.rs"

[[bin]]
name = "server"
path = "src/bin/temporalstore_data_server.rs"

[[example]]
name = "matrixobject_single_append_growth"
