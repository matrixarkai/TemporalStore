LOG_LEVEL: INFO  # FATAL, ERROR, WARN, INFO, DEBUG
IDC: lf
ONEBOX_DIR: onebox_env
DEPLOYER_TYPE: local  # local, remote
SETUP_ONLY: false
CASE_ROUNDS: 1
WITHOUT_TEARDOWN: true
AUTH_TOKEN: 58a70817003101f7a02f529049a04e49
INJECT_FAULT: true
PROC_TIMEOUT: 24h
LARK_APP_ID: cli_a268df36bffa900d
LARK_APP_TOKEN: Oh0xPFaHVdAcrQiUlHFHqcF3zSNRqAMI
LARK_CHAT_ID: oc_b27038f34a270e36627b8730bb2c4ae1  # Bcache2-Dev
LARK_TEMPLATE_ID: ctp_AAuL2af7gGrQ # chaos message template
METRICS_QUERY_HOST: http://openapi-metrics-cn.byted.org
METRICS_BOSUN_HOST: http://bosun-api-cn.byted.org
METRICS_REGION: China-North
METRICS_APP_NAME: bcache_metrics
METRICS_APP_SECRET: 2feddb29b1da4fb4931bd64ac514accb

# local test accelerates fault and background task(like balance) by reduce corresponding intervals
# so intervals relative to ha should also be reduced
# we just reduce them by 20x
SERVER:
  LOCAL_BIN: output/bcache2-server
  SCM_REPO:
  SCM_VERSION:
  NUM: 16
  BEGIN_PORT: 5000
  BYTEBOX_ID:
  BYTEBOX_NAME:
  MASTER_CONSUL:
  LOCATIONS:
    - vregion: vregion
      vdc: vdc1
      vau: vau1
    - vregion: vregion
      vdc: vdc2
      vau: vau2
  FLAGS:
      server_log_level: 2
      server_meta_tinker_interval_ms: 3000
      storage_zone_size: 10485760
      stream_max_blob_size: 10485760
      storage_gc_space_utility_threshold: 0.8
      evicter_max_memory_usage: 5
      storage_async: false
      storage_gc_zone_destroy_delay_ms: 60000
      stream_blob_deletion_min_age: 30
      stream_blob_deletion_min_gap: 0
      # to trigger oos more easily
      replicator_out_of_sync_s: 10
      storage_oplog_delay_dump_length: 0
      replicator_max_indexlog_per_loop: 1000

PROXY:
  LOCAL_BIN: output/bcache2-proxy
  NUM: 3
  LOCATIONS:
    - vregion: vregion
      vdc: vdc1
      vau: vau1
    - vregion: vregion
      vdc: vdc2
      vau: vau2
  FLAGS:
      proxy_log_level: 2

BENCHMARK:
  FROM_SCM: false
  SCM_REPO: bytedance/storage/bcache2_gcc830
  SCM_VERSION: 1.0.0.95
  LOCAL_BIN: output/bcache2-bench
  ROUND: 10
  FLAGS:
    bench_log_level: 2
    bench_job_num: 4
    bench_depth: 32
    bench_checker_enable: true
    bench_checker_worker_num: 1
    bench_checker_max_operation_per_round: 200000
    bench_checker_max_ambiguous_time_ms: 1000
    bench_checker_max_expire_ambiguous_time_ms: 1000
    bench_checker_reuse_key_count: 1000
    bench_checker_eventual_consistency_history_time_ms: 10000
    bench_checker_timeout_ms: 60000
    bench_client_type: bcache2
    # fast retry to detect new loaded leader
    bench_bcache2_client_topo_error_retry_interval_ms: 2000
    bench_workload_key_dis: R
    bench_workload_key_size: 16
    bench_workload_key_count: 20000
    bench_workload_value_count: 1000
    bench_workload_value_min_size: 512
    bench_workload_value_max_size: 4096
    bench_common_workload_freq_del: 1
    bench_common_workload_freq_expire: 1
    bench_common_workload_freq_ttl: 2
    bench_common_workload_expire_min_ttl_ms: 1000
    bench_common_workload_expire_max_ttl_ms: 30000
    bench_string_workload_freq_set: 1
    bench_string_workload_freq_setex: 1
    bench_string_workload_freq_get: 2
    bench_string_workload_setex_min_ttl_ms: 1000
    bench_string_workload_setex_max_ttl_ms: 30000
    bench_hash_workload_freq_hset: 4
    bench_hash_workload_freq_hget: 2
    bench_hash_workload_freq_hdel: 1
    bench_hash_workload_freq_hgetall: 1
    bench_hash_workload_field_count: 10
    bench_bcache2_client_meta_sync_interval_ms: 10000
FAULT_INJECTER:
  FAULT_INTERVAL: 30
  FAULT_MAX_DURATION: 30
  FAULT_TYPES:
      - SERVER_DOWN
        # TODO(yunxiao.du) enable below items
        # - META_SERVER_DOWN
        # - FREEZE_PARTITION
        # - FREEZE_SERVER

CODE_FIU_CONFIG:
  DEFAULT:
    INJECTION_POINTS: ".+" # regex to match injection points
    TYPES: ".+" # ditto
    MIN_PROBABILITY: 20
    MAX_PROBABILITY: 80
    MIN_SERVERS: 1
    MAX_SERVERS: 2
    MIN_DURATION_S: 10
    MAX_DURATION_S: 30
  GROUPS:
    - GROUP: page_gc
    - GROUP: index_gc
    - GROUP: oplog_gc
    - GROUP: dump
    - GROUP: bytestore
    - GROUP: bytestore_data_distort

SLA:
  TOTAL:
    QPS: 1000
    AVAILABILITY: 0.95
    AVG_LATENCY_MS: 1000
    P99_LATENCY_MS: 2000
  COMMAND:
    -
      NAME: string_request|get_request
      QPS: 0
      AVAILABILITY: 0.95
      AVG_LATENCY_MS: 1000
      P99_LATENCY_MS: 2000
    -
      NAME: string_request|set_request
      QPS: 0
      AVAILABILITY: 0.95
      AVG_LATENCY_MS: 1000
      P99_LATENCY_MS: 2000

METASERVER:
  LOCAL_BIN: output/bcache2-metaserver
  NUM: 3
  FLAGS:
    metaserver_cluster_name: onebox
    metaserver_placement_host_deduplicate: false
    metaserver_convict_safe_mode_warning_ratio: 50
    metaserver_convict_safe_mode_critical_ratio: 60
    metaserver_announce_consul_name: dev.bcache2.ms.onebox
    metaserver_announce_consul_name_leader: dev.bcache2.ms.onebox_leader
    metaserver_forbid_auto_register_for_convict_server: false
    metaserver_meta_check_routine_interval_sec: 1
    metaserver_balance_routine_interval_ms: 15000
    metaserver_balance_partition_count_safe_gap: 1

NAMESPACE:
  name: ns1
  tables:
    - namespace_name: ns1
      name: table1
      partition_set_num: 32
      partition_units:
        - partition_num: 2
          placement_set:
            - vregion: vregion
              vdc: vdc1
              vau: vau1
            - vregion: vregion
              vdc: vdc2
              vau: vau2
          storage_pool_uri: ""
          primary_prefer:
            vregion: vregion
            vdc: vdc1
            vau: vau1
      replication_union_policy: ANTI_ENTROPY
      quota:
        ops_read: 1000
  proxy_groups:
    - instance_num: 2
      placement:
        vregion: vregion
        vdc: vdc1
      consul_name: dev.bcache2.onebox_ns1_vdc1
    - instance_num: 2
      placement:
        vregion: vregion
        vdc: vdc2
      consul_name: dev.bcache2.onebox_ns1_vdc2
