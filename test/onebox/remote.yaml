  FROM_SCM: true
  SCM_REPO: bytedance/storage/bcache2_gcc830
  SCM_VERSION: 1.0.0.506
  LOCAL_BIN: output/bcache2-bench
  ROUND: 10
  REMOTE_PRODUCT_NAME: toutiao.redis.bcache2_chaos_test
