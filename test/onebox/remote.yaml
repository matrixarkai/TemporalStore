    bench_checker_max_expire_ambiguous_time_ms: 2000
    bench_checker_reuse_key_count: 100000
    bench_checker_eventual_consistency_history_time_ms: 10000
    bench_checker_timeout_ms: 300000
    bench_client_type: bcache2
    bench_bcache2_client_topo_error_retry_interval_ms: 2000 # fast retry to detect new loaded leader
    bench_workload_key_dis: R
    bench_workload_key_size: 16
    bench_workload_key_count: 2000000
    bench_workload_value_count: 100000
    bench_workload_value_min_size: 512
    bench_workload_value_max_size: 4096
    bench_common_workload_freq_del: 1
    bench_common_workload_freq_expire: 4
    bench_common_workload_freq_ttl: 2
    bench_common_workload_expire_min_ttl_ms: 1000
    bench_common_workload_expire_max_ttl_ms: 30000
    bench_string_workload_freq_set: 1
    bench_string_workload_freq_setex: 1
    bench_string_workload_freq_get: 2
    bench_string_workload_setex_min_ttl_ms: 1000
    bench_string_workload_setex_max_ttl_ms: 30000
    bench_hash_workload_freq_hset: 4
    bench_hash_workload_freq_hget: 2
    bench_hash_workload_freq_hdel: 1
    bench_hash_workload_freq_hgetall: 1
