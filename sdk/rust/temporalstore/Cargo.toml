[package]
name = "temporalstore"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust client SDK for TemporalStore, with an in-process native transport and a TCP proxy transport."
repository = "https://github.com/matrixarkai/TemporalStore"
homepage = "https://github.com/matrixarkai/TemporalStore"
keywords = ["temporalstore", "client", "sdk", "storage", "database"]
categories = ["api-bindings", "database"]
# `src/bin/matrixark_rust_proxy.rs` include!s `matrixark_rust_proxy_impl.rs`.
# Auto-discovery would also compile that implementation file as a bin target of
# its own, with no `required-features`, so it would be built in every feature
# combination -- including ones where the items it uses are configured out.
autobins = false

[lib]
name = "temporalstore"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = ["proxy"]
direct = []
proxy = []

[[bin]]
name = "matrixark_rust_proxy"
path = "src/bin/matrixark_rust_proxy.rs"
required-features = ["direct"]

[[example]]
name = "proxy_sequence_features"
path = "examples/proxy_sequence_features.rs"
required-features = ["proxy"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
