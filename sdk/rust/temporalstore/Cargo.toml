[package]
name = "temporalstore"
version = "0.1.0"
edition = "2021"

[lib]
name = "temporalstore"
path = "src/lib.rs"

[features]
default = ["direct"]
direct = []
proxy = []

[[bin]]
name = "matrixark_rust_proxy"
path = "src/bin/matrixark_rust_proxy.rs"
required-features = ["direct"]

[[bin]]
name = "matrixark_record_log"
path = "src/bin/matrixark_record_log.rs"
required-features = ["direct"]

[[example]]
name = "sequence_features"
path = "examples/sequence_features.rs"
required-features = ["direct"]

[[example]]
name = "proxy_sequence_features"
path = "examples/proxy_sequence_features.rs"
required-features = ["proxy"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
