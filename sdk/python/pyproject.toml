[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporalstore"
version = "0.1.0"
description = "TemporalStore Python SDK for LLM context ingestion and retrieval"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["."]
include = ["temporalstore*"]
