openapi: 3.0.3
info:
  title: TemporalStore Proxy API
  version: 0.1.0
paths:
  /ProxyService/Set:
    post:
      summary: Put a string value.
      requestBody:
        $ref: '#/components/requestBodies/StringPut'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/SetEx:
    post:
      summary: Put a string value with TTL.
      requestBody:
        $ref: '#/components/requestBodies/StringPutWithTtl'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/Get:
    post:
      summary: Get a string value.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/Delete:
    post:
      summary: Delete an object.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/CommonDelete:
    post:
      summary: Delete an object using the common command alias.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/Expire:
    post:
      summary: Set object TTL.
      requestBody:
        $ref: '#/components/requestBodies/Expire'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/Ttl:
    post:
      summary: Read object TTL.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/HSet:
    post:
      summary: Set a hash field.
      requestBody:
        $ref: '#/components/requestBodies/HashSet'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/HGet:
    post:
      summary: Get a hash field.
      requestBody:
        $ref: '#/components/requestBodies/HashGet'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/HDel:
    post:
      summary: Delete a hash field.
      requestBody:
        $ref: '#/components/requestBodies/HashGet'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/HMGet:
    post:
      summary: Get multiple hash fields.
      requestBody:
        $ref: '#/components/requestBodies/HashMultiGet'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/HMSet:
    post:
      summary: Set multiple hash fields.
      requestBody:
        $ref: '#/components/requestBodies/HashMultiSet'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/HIncrBy:
    post:
      summary: Increment a hash field.
      requestBody:
        $ref: '#/components/requestBodies/HashIncrBy'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/HashIncrBy:
    post:
      summary: Increment a hash field using the hash command alias.
      requestBody:
        $ref: '#/components/requestBodies/HashIncrBy'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/HGetAll:
    post:
      summary: Get all hash fields.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/HLen:
    post:
      summary: Count hash fields.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/SAdd:
    post:
      summary: Add a set member.
      requestBody:
        $ref: '#/components/requestBodies/SetAdd'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/SMembers:
    post:
      summary: List set members.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/SRem:
    post:
      summary: Remove a set member.
      requestBody:
        $ref: '#/components/requestBodies/SetAdd'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/Exists:
    post:
      summary: Check whether an object exists.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/StringSetConditional:
    post:
      summary: Conditionally put a string value.
      requestBody:
        $ref: '#/components/requestBodies/StringSetConditional'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/FeatureAdd:
    post:
      summary: Add raw timestamped feature points.
      requestBody:
        $ref: '#/components/requestBodies/FeatureAdd'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/FeatureQuery:
    post:
      summary: Query raw timestamped feature points.
      requestBody:
        $ref: '#/components/requestBodies/FeatureQuery'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/FeatureReplace:
    post:
      summary: Replace raw timestamped feature points in a time range.
      requestBody:
        $ref: '#/components/requestBodies/FeatureReplace'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/FeatureDelete:
    post:
      summary: Delete raw feature points for a key.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/FeatureAggQuery:
    post:
      summary: Aggregate raw timestamped feature points.
      requestBody:
        $ref: '#/components/requestBodies/FeatureAggregate'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/SequenceAdd:
    post:
      summary: Add typed long-sequence feature rows.
      requestBody:
        $ref: '#/components/requestBodies/SequenceAdd'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/SequenceQuery:
    post:
      summary: Query typed long-sequence feature rows.
      requestBody:
        $ref: '#/components/requestBodies/FeatureQuery'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/IpsAdd:
    post:
      summary: Add an IPS instance.
      requestBody:
        $ref: '#/components/requestBodies/IpsAdd'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/IpsQueryLast:
    post:
      summary: Query recent IPS instances.
      requestBody:
        $ref: '#/components/requestBodies/IpsQueryLast'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/RiskIncrement:
    post:
      summary: Increment a risk counter.
      requestBody:
        $ref: '#/components/requestBodies/RiskIncrement'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/RiskCount:
    post:
      summary: Query a risk counter window.
      requestBody:
        $ref: '#/components/requestBodies/RiskCount'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/RiskHset:
    post:
      summary: Set a timestamped risk value.
      requestBody:
        $ref: '#/components/requestBodies/RiskHset'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/RiskHquery:
    post:
      summary: Query H-family risk values through the C++ proxy-compatible alias.
      requestBody:
        $ref: '#/components/requestBodies/RiskHquery'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/RiskCPCSet:
    post:
      summary: Set CPC risk values through the C++ proxy-compatible alias.
      requestBody:
        $ref: '#/components/requestBodies/RiskCPCSet'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/RiskCPCQuery:
    post:
      summary: Query CPC risk counts through the C++ proxy-compatible alias.
      requestBody:
        $ref: '#/components/requestBodies/RiskCPCQuery'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/RiskFolSet:
    post:
      summary: Set first-or-last risk value.
      requestBody:
        $ref: '#/components/requestBodies/RiskFolSet'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/RiskFolQuery:
    post:
      summary: Query first-or-last risk value.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/RiskManager:
    post:
      summary: Query risk manager entries.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /matrixark/append_records:
    post:
      summary: Append MatrixArk record bundles natively through the proxy.
      requestBody:
        $ref: '#/components/requestBodies/MatrixArkAppendRecords'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /matrixark/scan_candidates:
    post:
      summary: Scan MatrixArk candidates with scope and secondary-index prefiltering in the proxy.
      requestBody:
        $ref: '#/components/requestBodies/MatrixArkScanCandidates'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /matrixark/retrieve_context_pack:
    post:
      summary: Return a fully assembled MatrixArk ContextPack from the proxy.
      requestBody:
        $ref: '#/components/requestBodies/MatrixArkRetrieveContextPack'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
components:
  responses:
    Envelope:
      description: Proxy response envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
  requestBodies:
    Key:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KeyRequest'
    StringPut:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StringPutRequest'
    StringPutWithTtl:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StringPutWithTtlRequest'
    StringSetConditional:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StringSetConditionalRequest'
    Expire:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpireRequest'
    HashSet:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HashSetRequest'
    HashGet:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HashFieldRequest'
    HashMultiGet:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HashMultiGetRequest'
    HashMultiSet:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HashMultiSetRequest'
    HashIncrBy:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HashIncrByRequest'
    SetAdd:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetAddRequest'
    FeatureAdd:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FeatureAddRequest'
    SequenceAdd:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SequenceAddRequest'
    FeatureQuery:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FeatureQueryRequest'
    FeatureReplace:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FeatureReplaceRequest'
    FeatureAggregate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FeatureAggregateRequest'
    IpsAdd:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IpsAddRequest'
    IpsQueryLast:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IpsQueryLastRequest'
    RiskIncrement:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RiskIncrementRequest'
    RiskCount:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RiskCountRequest'
    RiskHset:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RiskHsetRequest'
    RiskHquery:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RiskHqueryRequest'
    RiskCPCSet:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RiskCPCSetRequest'
    RiskCPCQuery:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RiskCPCQueryRequest'
    RiskFolSet:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RiskFolSetRequest'
    MatrixArkAppendRecords:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MatrixArkAppendRecordsRequest'
    MatrixArkScanCandidates:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MatrixArkScanCandidatesRequest'
    MatrixArkRetrieveContextPack:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MatrixArkRetrieveContextPackRequest'
  schemas:
    Envelope:
      type: object
      required: [ok, code, message]
      properties:
        ok:
          type: boolean
        code:
          type: integer
        message:
          type: string
        data:
          type: object
    KeyRequest:
      type: object
      required: [namespace, table_name, key]
      properties:
        namespace:
          type: string
        table_name:
          type: string
        key:
          type: string
    ByteArray:
      type: array
      items:
        type: integer
        minimum: 0
        maximum: 255
    StringPutRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [value]
          properties:
            value:
              $ref: '#/components/schemas/ByteArray'
    StringPutWithTtlRequest:
      allOf:
        - $ref: '#/components/schemas/StringPutRequest'
        - type: object
          required: [ttl_ms]
          properties:
            ttl_ms:
              type: integer
              format: int64
    StringSetConditionalRequest:
      allOf:
        - $ref: '#/components/schemas/StringPutRequest'
        - type: object
          required: [condition]
          properties:
            ttl_ms:
              type: integer
              format: int64
            condition:
              type: string
              enum: [always, if_exists, if_not_exists]
            return_old:
              type: boolean
              default: false
    ExpireRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [ttl_ms]
          properties:
            ttl_ms:
              type: integer
              format: int64
    HashSetRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [field, value]
          properties:
            field:
              type: string
            value:
              $ref: '#/components/schemas/ByteArray'
    HashFieldRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [field]
          properties:
            field:
              type: string
    HashMultiGetRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [fields]
          properties:
            fields:
              type: array
              items:
                type: string
    HashEntry:
      type: array
      minItems: 2
      maxItems: 2
      items:
        oneOf:
          - type: string
          - $ref: '#/components/schemas/ByteArray'
    HashMultiSetRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [entries]
          properties:
            entries:
              type: array
              items:
                $ref: '#/components/schemas/HashEntry'
    HashIncrByRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [field, increment]
          properties:
            field:
              type: string
            increment:
              type: integer
              format: int64
    SetAddRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [member]
          properties:
            member:
              $ref: '#/components/schemas/ByteArray'
    FeaturePoint:
      type: object
      required: [timestamp_ms, value]
      properties:
        timestamp_ms:
          type: integer
          format: int64
        value:
          $ref: '#/components/schemas/ByteArray'
    FeatureFilter:
      type: object
      required: [field, op, value]
      properties:
        field:
          type: string
        op:
          type: string
          enum: [equal, not_equal, greater_than, greater_or_equal, less_than, less_or_equal]
        value:
          type: integer
          format: int64
    FeatureAddRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [points]
          properties:
            points:
              type: array
              items:
                $ref: '#/components/schemas/FeaturePoint'
    SequenceFeatureRow:
      type: object
      required: [timestamp_ms, gid, action_type, duration, author_id]
      properties:
        timestamp_ms:
          type: integer
          format: int64
        gid:
          type: integer
          format: int64
        action_type:
          type: integer
        duration:
          type: integer
        author_id:
          type: integer
          format: int64
    SequenceAddRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: '#/components/schemas/SequenceFeatureRow'
    FeatureQueryRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [start_ms, end_ms, count]
          properties:
            start_ms:
              type: integer
              format: int64
            end_ms:
              type: integer
              format: int64
            count:
              type: integer
              format: int64
            filters:
              type: array
              items:
                $ref: '#/components/schemas/FeatureFilter'
    FeatureReplaceRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [start_ms, end_ms, points]
          properties:
            start_ms:
              type: integer
              format: int64
            end_ms:
              type: integer
              format: int64
            points:
              type: array
              items:
                $ref: '#/components/schemas/FeaturePoint'
    FeatureAggregateRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [start_ms, end_ms, aggregator]
          properties:
            start_ms:
              type: integer
              format: int64
            end_ms:
              type: integer
              format: int64
            aggregator:
              type: string
            count:
              type: integer
              format: int64
    IpsFeatureStat:
      type: object
      required: [id, slot, has_slot, type, v1, v2]
      properties:
        id:
          type: integer
          format: int64
        slot:
          type: integer
        has_slot:
          type: boolean
        type:
          type: integer
        v1:
          type: integer
        v2:
          type: integer
    IpsAddRequest:
      type: object
      required: [namespace, table_name, key, timestamp_ms, instance]
      properties:
        namespace:
          type: string
        table_name:
          type: string
        key:
          type: string
        timestamp_ms:
          type: integer
          format: int64
        instance:
          $ref: '#/components/schemas/ByteArray'
        action_type:
          type: integer
        table_id:
          type: integer
          format: int64
        request_id:
          type: string
    IpsQueryLastRequest:
      type: object
      required: [namespace, table_name, key, count]
      properties:
        namespace:
          type: string
        table_name:
          type: string
        key:
          type: string
        count:
          type: integer
    RiskIncrementRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [timestamp_ms, amount]
          properties:
            timestamp_ms:
              type: integer
              format: int64
            amount:
              type: integer
              format: int64
            precision_ms:
              type: integer
              format: int64
            ttl_ms:
              type: integer
              format: int64
    RiskCountRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [start_ms, end_ms]
          properties:
            start_ms:
              type: integer
              format: int64
            end_ms:
              type: integer
              format: int64
    RiskHsetRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          properties:
            timestamp_ms:
              type: integer
              format: int64
            amount:
              type: integer
              format: int64
            value:
              oneOf:
                - type: string
                - type: integer
                  format: int64
            ttl:
              type: integer
              format: int64
            ttl_ms:
              type: integer
              format: int64
            htype:
              type: string
              enum: [count, min, max, change]
            occur_time:
              type: integer
              format: int64
            precision_ms:
              type: integer
              format: int64
    RiskWindow:
      type: object
      required: [start_offset, end_offset, unit]
      properties:
        start_offset:
          type: integer
          format: int64
        end_offset:
          type: integer
          format: int64
        unit:
          type: string
          enum: [second, minute, hour, day]
    RiskHqueryRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          properties:
            start_ms:
              type: integer
              format: int64
            end_ms:
              type: integer
              format: int64
            windows:
              type: array
              items:
                $ref: '#/components/schemas/RiskWindow'
            htype:
              type: string
              enum: [count, min, max, change]
            aggregator:
              type: string
            precision_ms:
              type: integer
              format: int64
    RiskCPCSetRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [values]
          properties:
            values:
              type: array
              items:
                type: string
            timestamp_ms:
              type: integer
              format: int64
            occur_time:
              type: integer
              format: int64
            ttl_ms:
              type: integer
              format: int64
            ttl:
              type: integer
              format: int64
            precision_ms:
              type: integer
              format: int64
            dont_upgrade_cpc:
              type: boolean
    RiskCPCQueryRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          properties:
            start_ms:
              type: integer
              format: int64
            end_ms:
              type: integer
              format: int64
            aggregator:
              type: string
              default: sum
            windows:
              type: array
              items:
                $ref: '#/components/schemas/RiskWindow'
            with_detail:
              type: boolean
            precision_ms:
              type: integer
              format: int64
    RiskFolSetRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [value, fol_type]
          properties:
            value:
              oneOf:
                - type: string
                - $ref: '#/components/schemas/ByteArray'
