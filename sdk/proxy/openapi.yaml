openapi: 3.0.3
info:
  title: TemporalStore Proxy API
  version: 0.1.0
paths:
  /ProxyService/Set:
    post:
      summary: Put a string value with optional TTL.
      requestBody:
        $ref: '#/components/requestBodies/StringPut'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/Get:
    post:
      summary: Get a string value.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/Delete:
    post:
      summary: Delete an object.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/Expire:
    post:
      summary: Set object TTL.
      requestBody:
        $ref: '#/components/requestBodies/Expire'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/Ttl:
    post:
      summary: Read object TTL.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/HSet:
    post:
      summary: Set a hash field.
      requestBody:
        $ref: '#/components/requestBodies/HashSet'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/HGet:
    post:
      summary: Get a hash field.
      requestBody:
        $ref: '#/components/requestBodies/HashGet'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/HDel:
    post:
      summary: Delete a hash field.
      requestBody:
        $ref: '#/components/requestBodies/HashGet'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/SAdd:
    post:
      summary: Add a set member.
      requestBody:
        $ref: '#/components/requestBodies/SetAdd'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/SMembers:
    post:
      summary: List set members.
      requestBody:
        $ref: '#/components/requestBodies/Key'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/FeatureAdd:
    post:
      summary: Add raw timestamped feature points.
      requestBody:
        $ref: '#/components/requestBodies/FeatureAdd'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/FeatureQuery:
    post:
      summary: Query raw timestamped feature points.
      requestBody:
        $ref: '#/components/requestBodies/FeatureQuery'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/SequenceAdd:
    post:
      summary: Add typed long-sequence feature rows.
      requestBody:
        $ref: '#/components/requestBodies/SequenceAdd'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/SequenceQuery:
    post:
      summary: Query typed long-sequence feature rows.
      requestBody:
        $ref: '#/components/requestBodies/FeatureQuery'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/ControlStateIncrement:
    post:
      summary: Increment a control-state counter.
      requestBody:
        $ref: '#/components/requestBodies/ControlStateIncrement'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /ProxyService/ControlStateCount:
    post:
      summary: Query a control-state counter window.
      requestBody:
        $ref: '#/components/requestBodies/ControlStateCount'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
components:
  responses:
    Envelope:
      description: Proxy response envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
  requestBodies:
    Key:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KeyRequest'
    StringPut:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StringPutRequest'
    Expire:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpireRequest'
    HashSet:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HashSetRequest'
    HashGet:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HashFieldRequest'
    SetAdd:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetAddRequest'
    FeatureAdd:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FeatureAddRequest'
    SequenceAdd:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SequenceAddRequest'
    FeatureQuery:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FeatureQueryRequest'
    ControlStateIncrement:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlStateIncrementRequest'
    ControlStateCount:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlStateCountRequest'
  schemas:
    Envelope:
      type: object
      required: [ok, code, message]
      properties:
        ok:
          type: boolean
        code:
          type: integer
        message:
          type: string
        data:
          type: object
    KeyRequest:
      type: object
      required: [namespace, table_name, key]
      properties:
        namespace:
          type: string
        table_name:
          type: string
        key:
          type: string
    StringPutRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [value]
          properties:
            value:
              type: string
            ttl_ms:
              type: integer
              format: int64
    ExpireRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [ttl_ms]
          properties:
            ttl_ms:
              type: integer
              format: int64
    HashSetRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [field, value]
          properties:
            field:
              type: string
            value:
              type: string
    HashFieldRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [field]
          properties:
            field:
              type: string
    SetAddRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [member]
          properties:
            member:
              type: string
    FeaturePoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp:
          type: integer
          format: int64
        value:
          type: string
    FeatureFilter:
      type: object
      required: [field, op, value]
      properties:
        field:
          type: string
        op:
          type: integer
        value:
          type: integer
          format: int64
    FeatureAddRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [points]
          properties:
            points:
              type: array
              items:
                $ref: '#/components/schemas/FeaturePoint'
    SequenceFeatureRow:
      type: object
      required: [timestamp, gid, action_type, duration, author_id]
      properties:
        timestamp:
          type: integer
          format: int64
        gid:
          type: integer
          format: int64
        action_type:
          type: integer
        duration:
          type: integer
        author_id:
          type: integer
          format: int64
    SequenceAddRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: '#/components/schemas/SequenceFeatureRow'
    FeatureQueryRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [start_ts, end_ts, count]
          properties:
            start_ms:
              type: integer
              format: int64
            end_ms:
              type: integer
              format: int64
            count:
              type: integer
              format: int64
            filters:
              type: array
              items:
                $ref: '#/components/schemas/FeatureFilter'
    ControlStateIncrementRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [timestamp_ms, amount]
          properties:
            timestamp_ms:
              type: integer
              format: int64
            amount:
              type: integer
              format: int64
            precision_ms:
              type: integer
              format: int64
            ttl_ms:
              type: integer
              format: int64
    ControlStateCountRequest:
      allOf:
        - $ref: '#/components/schemas/KeyRequest'
        - type: object
          required: [start_ms, end_ms]
          properties:
            start_ms:
              type: integer
              format: int64
            end_ms:
              type: integer
              format: int64