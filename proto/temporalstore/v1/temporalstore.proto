}

message ContextPackAudit {
  string query_id = 1;
  uint64 session_hash = 2;
  uint64 request_time_ms = 3;
  uint64 query_hash = 4;
  uint32 max_prompt_tokens = 5;
  uint32 selected_tokens = 6;
  repeated ContextAuditRef selected_refs = 7;
  repeated ContextAuditRef blocked_refs = 8;
}

message ContextWritePackAudit {
  string key = 1;
