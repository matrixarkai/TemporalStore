syntax = "proto3";

package temporalstore.v1;

// TemporalStoreService is the Rust-native production SDK contract. Existing
// HTTP/JSON client and proxy routes must continue to expose the same logical
// request and response fields until generated tonic/prost bindings are wired.
service TemporalStoreService {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc BatchExecute(BatchExecuteRequest) returns (BatchExecuteResponse);
  rpc OpenTable(OpenTableRequest) returns (OpenTableResponse);
  rpc SyncTopology(SyncTopologyRequest) returns (SyncTopologyResponse);
  rpc GetClientPreflight(ClientPreflightRequest) returns (ClientPreflightResponse);
}

// ProxyService is the Rust-native proxy RPC contract. It intentionally does
// not claim legacy wire compatibility; existing legacy callers must migrate
// through the Rust-native HTTP/RESP/tonic surfaces.
service ProxyService {
  rpc ProxyExecuteStream(stream ProxyStreamRequest) returns (stream ProxyStreamEvent);
  rpc RouteCallbacks(stream ProxyRouteCallback) returns (stream ProxyRouteAck);
  rpc WatchProxyPreflight(ProxyPreflightWatchRequest) returns (stream ProxyPreflightEvent);
}

// DataNodeService is the Rust-native data-node RPC contract. HTTP routes keep
// serving local tests, while production adapters use this streaming shape for
// shard-affine execution, async lifecycle callbacks, and job status updates.
service DataNodeService {
  rpc ExecuteStream(stream DataNodeStreamRequest) returns (stream DataNodeStreamEvent);
  rpc LifecycleCallbacks(stream DataNodeLifecycleCallback) returns (stream DataNodeLifecycleAck);
  rpc WatchJobStatus(DataNodeJobStatusRequest) returns (stream DataNodeJobStatusEvent);
}

message Status {
  bool ok = 1;
  string code = 2;
  string message = 3;
}

message ExecuteRequest {
  uint64 shard_id = 1;
  uint64 trace_id = 2;
  Command command = 3;
}

message ExecuteResponse {
  Status status = 1;
  CommandResponse response = 2;
  uint64 topology_version = 3;
}

message BatchExecuteRequest {
  uint64 shard_id = 1;
  uint64 trace_id = 2;
  repeated Command commands = 3;
}

message BatchExecuteResponse {
  Status status = 1;
  repeated CommandResponse responses = 2;
  uint64 topology_version = 3;
}

message OpenTableRequest {
  string namespace_name = 1;
  string table_name = 2;
  string local_location = 3;
}

message OpenTableResponse {
  Status status = 1;
  TableTopology topology = 2;
}

message SyncTopologyRequest {
  repeated string table_keys = 1;
  uint64 min_topology_version = 2;
  uint64 deadline_ms = 3;
}

message SyncTopologyResponse {
  Status status = 1;
  repeated TableTopology topologies = 2;
  uint64 topology_version = 3;
}

message ClientPreflightRequest {
  bool include_routes = 1;
  bool include_backend_failures = 2;
}

message ClientPreflightResponse {
  Status status = 1;
  uint64 route_cache_entries = 2;
  uint64 table_cache_entries = 3;
  uint64 backend_failure_entries = 4;
  uint64 topology_version = 5;
  bool degraded = 6;
  repeated string warnings = 7;
}

message ProxyStreamRequest {
  oneof kind {
    ExecuteRequest execute = 1;
    BatchExecuteRequest batch_execute = 2;
    SyncTopologyRequest sync_topology = 3;
  }
}

message ProxyStreamEvent {
  Status status = 1;
  uint64 topology_version = 2;
  ExecuteResponse execute = 3;
  BatchExecuteResponse batch_execute = 4;
  repeated string route_refreshes = 5;
}

message ProxyRouteCallback {
  string table_key = 1;
  uint64 shard_id = 2;
  uint64 topology_version = 3;
  string reason = 4;
  Status status = 5;
}

message ProxyRouteAck {
  Status status = 1;
  string table_key = 2;
  uint64 shard_id = 3;
  uint64 topology_version = 4;
}

message ProxyPreflightWatchRequest {
  bool include_routes = 1;
  bool include_policy = 2;
  uint64 min_topology_version = 3;
}

message ProxyPreflightEvent {
  Status status = 1;
  uint64 topology_version = 2;
  bool degraded = 3;
  repeated string warnings = 4;
}

message DataNodeStreamRequest {
  oneof kind {
    ExecuteRequest execute = 1;
    BatchExecuteRequest batch_execute = 2;
    DataNodeJobControl job_control = 3;
  }
}

message DataNodeStreamEvent {
  Status status = 1;
  uint64 job_id = 2;
  ExecuteResponse execute = 3;
  BatchExecuteResponse batch_execute = 4;
  string lifecycle_state = 5;
}

message DataNodeJobControl {
  uint64 job_id = 1;
  string action = 2;
}

message DataNodeLifecycleCallback {
  uint64 shard_id = 1;
  string operation = 2;
  string state = 3;
  uint64 load_version = 4;
  uint64 scheduler_task_id = 5;
  uint64 scheduler_generation = 6;
  Status status = 7;
}

message DataNodeLifecycleAck {
  Status status = 1;
  uint64 shard_id = 2;
  string operation = 3;
  uint64 scheduler_task_id = 4;
  uint64 scheduler_generation = 5;
}

message DataNodeJobStatusRequest {
  uint64 job_id = 1;
  bool include_finished = 2;
}

message DataNodeJobStatusEvent {
  Status status = 1;
  uint64 job_id = 2;
  string kind = 3;
  bool finished = 4;
}

message TableTopology {
  string namespace_name = 1;
  string table_name = 2;
  string state = 3;
  bool readonly = 4;
  bool write_disabled = 5;
  uint32 drop_percent = 6;
  uint64 topology_version = 7;
  repeated ShardTopology shards = 8;
}

message ShardTopology {
  uint64 shard_id = 1;
  ServerEndpoint primary = 2;
  repeated ServerEndpoint replicas = 3;
  uint64 load_generation = 4;
  string lifecycle_state = 5;
}

message ServerEndpoint {
  string server_id = 1;
  string host = 2;
  uint32 port = 3;
  string location = 4;
}

message Command {
  oneof kind {
    StringSet string_set = 1;
    StringGet string_get = 2;
    StringDelete string_delete = 3;
    HashSet hash_set = 4;
    HashGet hash_get = 5;
    HashMultiSet hash_multi_set = 6;
    HashMultiGet hash_multi_get = 7;
    SetAdd set_add = 8;
    SetMembers set_members = 9;
    FeatureAppend feature_append = 10;
    FeatureQuery feature_query = 11;
    SequenceAppend sequence_append = 12;
    SequenceQuery sequence_query = 13;
    ControlStateIncrement control_state_increment = 16;
    ControlStateQuery control_state_query = 17;
    ContextNodeUpsert context_node_upsert = 18;
    ContextNodeGet context_node_get = 19;
    CommonExpire common_expire = 20;
    CommonExists common_exists = 21;
    HashDelete hash_delete = 22;
    HashIncrBy hash_incr_by = 23;
    ListPush list_push = 24;
    ListPop list_pop = 25;
    SetRemove set_remove = 26;
    ZSetAdd zset_add = 27;
    ZSetRemove zset_remove = 28;
    ZSetIncrBy zset_incr_by = 29;
    ZSetPop zset_pop = 30;
    ControlStateIncrementWithOptions control_state_increment_with_options = 31;
    ControlStateChangeAdd control_state_change_add = 32;
    ControlStateSet control_state_set = 33;
    ControlStateSetAndGet control_state_set_and_get = 34;
    ControlStateSetAndGetWithOptions control_state_set_and_get_with_options = 35;
    ControlStateSelectionSet control_state_selection_set = 36;
    BucketTake bucket_take = 37;
    CommonDelete common_delete = 38;
    CommonPersist common_persist = 39;
    FeatureDelete feature_delete = 40;
    FeatureReplace feature_replace = 41;
    FeatureAppendWithPolicy feature_append_with_policy = 42;
    SeenCheck seen_check = 43;
    StringSetConditional string_set_conditional = 44;
    ContextResourceBlobBegin context_resource_blob_begin = 45;
    ContextResourceBlobAppend context_resource_blob_append = 46;
    ContextResourceBlobCommit context_resource_blob_commit = 47;
    ContextResourceBlobPut context_resource_blob_put = 48;
    ContextResourceBlobSweep context_resource_blob_sweep = 49;
    ContextMarkEmbeddingDirty context_mark_embedding_dirty = 50;
    ContextMarkSummaryDirty context_mark_summary_dirty = 51;
    ContextCompressEvents context_compress_events = 52;
    ContextUpsertChildRef context_upsert_child_ref = 53;
    ContextWriteIndexRef context_write_index_ref = 54;
    ContextUpsertNode context_upsert_node = 55;
    ContextSetNodeEmbedding context_set_node_embedding = 56;
    ContextWriteEvent context_write_event = 57;
    ContextWriteExtractedEvent context_write_extracted_event = 58;
    ContextUpsertEntity context_upsert_entity = 59;
    ContextUpsertSummary context_upsert_summary = 60;
    ContextWriteCompressionEvent context_write_compression_event = 61;
    ContextWritePackAudit context_write_pack_audit = 62;
    HashMultiSetIfTimestampOlder hash_multi_set_if_timestamp_older = 63;
  }
}

message CommandResponse {
  Status status = 1;
  bytes value = 2;
  repeated bytes values = 3;
  repeated FeaturePoint feature_points = 4;
  repeated SequenceFeatureRow sequence_rows = 5;
  repeated ContextNode context_nodes = 6;
  uint64 count = 7;
  bool exists = 8;
}

message StringSet {
  string key = 1;
  bytes value = 2;
  uint64 ttl_ms = 3;
}

message StringGet {
  string key = 1;
}

message StringDelete {
  string key = 1;
}

message HashSet {
  string key = 1;
  string field = 2;
  bytes value = 3;
}

message HashGet {
  string key = 1;
  string field = 2;
}

message HashEntry {
  string field = 1;
  bytes value = 2;
}

message HashMultiSet {
  string key = 1;
  repeated HashEntry entries = 2;
}

message HashMultiSetIfTimestampOlder {
  string key = 1;
  string timestamp_field = 2;
  int64 timestamp_seconds = 3;
  int32 timestamp_nanos = 4;
  repeated HashEntry entries = 5;
}

message HashMultiGet {
  string key = 1;
  repeated string fields = 2;
}

message SetAdd {
  string key = 1;
  bytes member = 2;
}

message SetMembers {
  string key = 1;
}

message FeaturePoint {
  uint64 timestamp_ms = 1;
  bytes value = 2;
}

message FeatureAppend {
  string key = 1;
  repeated FeaturePoint points = 2;
}

message FeatureQuery {
  string key = 1;
  uint64 start_ms = 2;
  uint64 end_ms = 3;
  uint32 limit = 4;
}

message SequenceFeatureRow {
  uint64 timestamp_ms = 1;
  uint64 gid = 2;
  uint32 action_type = 3;
  uint32 duration = 4;
  uint64 author_id = 5;
}

message SequenceAppend {
  string key = 1;
  repeated SequenceFeatureRow rows = 2;
}

message SequenceQuery {
  string key = 1;
  uint64 start_ms = 2;
  uint64 end_ms = 3;
  uint32 limit = 4;
}

message ControlStateIncrement {
  string key = 1;
  string family = 2;
  int64 delta = 3;
  uint64 timestamp_ms = 4;
}

message ControlStateQuery {
  string key = 1;
  string family = 2;
  uint64 start_ms = 3;
  uint64 end_ms = 4;
}

// A PROJECTION FOR A CLIENT, NOT THE DURABLE NODE. DO NOT RE-UNIFY THE TWO.
//
// Four fields against the fifteen the stored node carries. That is correct here -- a caller asked
// for these and the rest were never part of the question -- and it is why this message must never
// be used to WRITE a node: the conversion fills the absent fields with zeros and an empty vector,
// and on disk a fabricated 0 is indistinguishable from a real one. `node_id` is also a STRING that
// the Rust side hashes one-way, so the durable identity cannot be recovered from it.
//
// The durable record has its own message. Two jobs, two messages: widening this one would change
// the request/response contract, which is a different surface from the log.
message ContextNode {
  string node_id = 1;
  string model = 2;
  bytes payload = 3;
  uint64 updated_at_ms = 4;
}

message ContextNodeUpsert {
  string key = 1;
  ContextNode node = 2;
}

message ContextNodeGet {
  string key = 1;
  string node_id = 2;
}

message CommonExpire {
  string key = 1;
  uint64 ttl_ms = 2;
}

message CommonExists {
  string key = 1;
}

// ---------------------------------------------------------------------------
// Write-ahead log records.
//
// Fidelity before compactness: this is the durability path, so anything the schema does not
// model explicitly is carried verbatim in its existing encoding. A record can therefore never
// lose a field because the schema had not caught up with it.
// ---------------------------------------------------------------------------

message WalHardState {
  uint64 current_term = 1;
  optional uint64 voted_for = 2;
  uint64 commit_index = 3;
}

message WalMembership {
  uint64 shard_id = 1;
  repeated uint64 voters = 2;
  uint64 leader_id = 3;
}

message WalApplySnapshotFence {
  uint64 applied_index = 1;
  uint64 commit_index = 2;
  uint64 installed_snapshot_index = 3;
  uint64 first_retained_log_index = 4;
}

message WalStorageApplyFence {
  uint64 shard_id = 1;
  uint64 raft_term = 2;
  uint64 committed_index = 3;
  uint64 applied_index = 4;
  optional string snapshot_id = 5;
  uint64 storage_epoch = 6;
  // Raw digest bytes: stored as text, the same digest costs twice the space to say the same
  // thing. A checksum that is not a hex digest is kept as its own bytes with `checksum_is_text`
  // set, so nothing has to assume what a checksum looks like to round-trip it.
  bytes checksum = 7;
  bool checksum_is_text = 8;
}

// One command as it appears in the log.
//
// The modelled arms exist because they carry the bulk of the bytes: their payloads are byte
// strings, which a text encoding inflates roughly threefold. Every other command uses
// `verbatim`, which holds exactly the bytes the previous encoding produced.
message WalCommand {
  oneof kind {
    StringSet string_set = 1;
    HashSet hash_set = 2;
    bytes verbatim = 99;
  }
}

message WalLogEntry {
  uint64 term = 1;
  uint64 index = 2;
  uint64 shard_id = 3;
  WalCommand command = 4;
  // Wall-clock instant, in milliseconds, at which the leader admitted this command. Read back by
  // the apply so every replica resolves a relative deadline to the leader's absolute instant
  // rather than to its own clock. Zero means unstamped, which is what a record written before
  // this field carried it decodes to, and the apply then uses the live clock as it did before.
  uint64 leader_time_ms = 5;
}

// Present on an incremental record, whose entries hold only what was appended since
// `from_index`. Absent on a self-sufficient base record.
message WalEntryDelta {
  uint64 from_index = 1;
  uint64 log_first_index = 2;
  uint64 log_last_index = 3;
}

message WalStateImageSlab {
  uint64 block_slab_id = 1;
  bytes slab = 2;
}

// An engine state image: what a snapshot carries instead of the entry history, so installing it
// is O(state) and the log behind it can actually be dropped.
message WalStateImage {
  bytes index = 1;
  uint64 next_block_id = 2;
  repeated WalStateImageSlab slabs = 3;
  // THE ROUTING RANGE THE CARRIED INDEX WAS BUILT ON. An index names buckets and a bucket is
  // start + hash(key) % (end - start + 1), so an index shipped without its range leaves the
  // receiver with bucket numbers it cannot account for.
  //
  // `optional` so an image encoded before these existed still DECODES, and the install refuses it
  // by name instead of failing to parse. One shape, current or refused -- there is no reader for
  // the old one.
  optional uint32 start_routing_bucket = 4;
  optional uint32 end_routing_bucket = 5;
}

// An installed snapshot, split so the image's bytes stay bytes: everything else about the
// snapshot travels in its existing encoding in `snapshot_sans_image`.
message WalInstalledSnapshot {
  bytes snapshot_sans_image = 1;
  WalStateImage state_image = 2;
}

message WalRecord {
  WalHardState hard_state = 1;
  WalMembership membership = 2;
  WalApplySnapshotFence apply_snapshot_fence = 3;
  WalStorageApplyFence storage_apply_fence = 4;
  repeated WalLogEntry entries = 5;
  WalInstalledSnapshot installed_snapshot = 7;
  // The record's remaining fields -- replica role, joint membership, snapshot refs and
  // runtime telemetry -- which sit at their default on almost every record and are omitted
  // entirely when they do. Carried in their existing encoding so none of them can be lost.
  bytes rest = 6;
}

message WalEnvelope {
  uint64 sequence = 1;
  bytes checksum = 2;
  WalRecord record = 3;
  WalEntryDelta delta = 4;
  bool checksum_is_text = 5;
}

// One engine write-ahead log record.
//
// The command carries the value, which is where the bytes are, so it uses the same encoding as
// the node log: modelled arms for the commands that carry byte strings, and everything else
// verbatim in its previous encoding.
message EngineWalRecord {
  uint64 shard_id = 1;
  uint64 sequence = 2;
  WalCommand command = 3;
  // Absent on a record written outside a batch.
  EngineWalMetadata metadata = 4;
  // What this write DID. Once every accepted write fills this, `command` is what comes out.
  repeated EngineWalItem items = 5;
  // Blocks this write produced, carried in the record that records the write.
  repeated WalStagedBlock staged_blocks = 6;
}

// What a record did to storage, flat enough that the whole thing costs a handful of bytes.
enum WalItemKind {
  WAL_ITEM_KIND_UNSPECIFIED = 0;
  WAL_ITEM_KIND_KV = 1;
  WAL_ITEM_KIND_BLOCK = 2;
  WAL_ITEM_KIND_TTL = 3;
  WAL_ITEM_KIND_DELETE_OBJECT = 4;
  WAL_ITEM_KIND_QUERY = 5;
  WAL_ITEM_KIND_ADMIN = 6;
}

enum WalItemModel {
  WAL_ITEM_MODEL_UNSPECIFIED = 0;
  WAL_ITEM_MODEL_COMMON = 1;
  WAL_ITEM_MODEL_STRING = 2;
  WAL_ITEM_MODEL_HASH = 3;
  WAL_ITEM_MODEL_SET = 4;
  WAL_ITEM_MODEL_FEATURE = 5;
  WAL_ITEM_MODEL_SEQUENCE = 6;
  WAL_ITEM_MODEL_CONTROL_STATE = 7;
  WAL_ITEM_MODEL_CONTEXT = 8;
  WAL_ITEM_MODEL_ADMIN = 9;
  WAL_ITEM_MODEL_UNKNOWN = 10;
}

// Where a block landed.
//
// The checksum stays a field rather than being dropped as redundant: the block read path verifies
// it whenever it is present, so an index entry rebuilt from a record without one is never
// integrity-checked again. The record's own frame protects the record, not the block bytes.
message WalBlockAddress {
  uint64 block_slab_id = 1;
  uint64 offset = 2;
  uint64 length = 3;
  optional uint64 block_id = 4;
  optional uint64 object_id = 5;
  optional uint32 routing_bucket = 6;
  optional uint64 generation = 7;
  optional uint64 slab_id = 8;
  // Field 9 is the hex form, kept readable for records written before field 10 existed. New
  // records write the digest itself: thirty-two bytes rather than sixty-four characters.
  optional string checksum = 9;
  optional bytes checksum_raw = 10;
}

// WHAT A WRITE DID, which is what lets a log carry data instead of operations.
//
// Fields 1-10 described a write and were derived FROM the command beside them, so nothing ever
// read them back and writing them was pure amplification. Fields 11-14 are the difference: the
// block a write produced, the bytes for state no block backs, and which component of an object
// they belong to. With those, a shard can be rebuilt from items alone and the command becomes
// removable rather than merely redundant.
//
// One item type serves all three logs. The engine writes it durably, the shared log publishes it
// to a successor, and the node log wraps it in consensus metadata -- none of them needs its own.
message EngineWalItem {
  WalItemKind item_kind = 1;
  WalItemModel model = 2;
  optional string object_key = 3;
  optional uint64 bucket_id = 4;
  optional fixed64 object_id = 5;
  optional uint64 block_id = 6;
  optional uint64 ttl_ms = 7;
  bool deleted = 8;
  bool meta_log = 9;
  bool block_log = 10;

  // Which component of the object this is: a hash field, a set member, a timestamp, a score and
  // member packed together. Absent for an object with exactly one value.
  optional string component = 11;
  // Where the block for this component went. Absent for state no block backs -- a seen-set
  // member, a token bucket -- which carries its bytes in `value` instead.
  WalBlockAddress block = 12;
  // The bytes themselves, for state that has no block behind it.
  optional bytes value = 13;
  // The kind as the engine names it. Repeated on every item, so the common ones travel as
  // `kind_code` below and this is left empty; a kind the code does not cover still travels
  // whole, because the engine names more of them than any list here should try to freeze.
  optional string kind_name = 14;
  // A small code for a kind this schema knows. Zero means "read kind_name instead".
  optional uint32 kind_code = 19;
  // The bucket this object routes to. On the item rather than only inside `block`, because state
  // with no block behind it still routes somewhere.
  optional uint32 routing_bucket = 15;
  // The stored key of a timestamped entry, as a number.
  //
  // It used to travel inside `component` as a decimal string: thirteen characters for something a
  // varint says in seven, and a context event packed two of them as thirty-two hex characters
  // where two varints cost about twelve. `component` keeps its job of naming a hash field or a
  // set member, and stops doubling as a number.
  optional uint64 timestamp_ms = 16;
  // A second key for an entry the index keys by something other than its timestamp -- a context
  // event, whose block packs by time and whose index keys by event id.
  optional uint64 entry_id = 17;
  // The whole object is gone, not one component of it.
  //
  // Previously implied by `deleted` with no component. A reader had to know the convention to
  // tell the two apart, and a reader that did not silently removed the wrong amount.
  bool object_deleted = 18;
}

// A block carried inside the record that produced it, so a read can serve it back out of the log.
message WalStagedBlock {
  optional fixed64 object_id = 1;
  bytes block = 2;
  optional uint32 routing_bucket = 3;
  // WHICH ELEMENT OF THE OBJECT THIS PAGE HOLDS.
  //
  // Without it the object id is the record's ONLY discriminator between its own pages, and one
  // record routinely carries many: a batch writing twenty-five fields of one hash produces
  // twenty-five pages in one record. The reader picks one out with
  // `find(|page| page.object_id == object_id)`, so any identity shared by two pages of the record
  // serves the FIRST page's bytes for both -- wrong bytes rather than a miss, on the path that
  // exists to stop a durably acknowledged write reading as missing.
  //
  // Absent for a page that IS its whole object (a string, a control state), which is what `None`
  // has always meant for `BlockIndex::component`. Never absent for a container element.
  optional string component = 4;
}

message EngineWalMetadata {
  uint32 version = 1;
  uint64 timestamp_ms = 2;
  repeated EngineWalItem items = 3;
  // All three are set together for a batched write, and all absent for a standalone one.
  optional uint64 batch_id = 4;
  optional uint32 batch_size = 5;
  optional uint32 batch_index = 6;
}

// One replicated batch of entries, as it travels between nodes.
//
// The entries carry the values, which is where the bytes are; the rest of the message is a
// handful of integers.
message RaftAppendEntriesRequest {
  uint64 shard_id = 1;
  uint64 term = 2;
  uint64 leader_id = 3;
  uint64 target_id = 4;
  uint64 prev_log_index = 5;
  uint64 prev_log_term = 6;
  repeated WalLogEntry entries = 7;
  uint64 leader_commit = 8;
  // Set only when the caller attached tracing metadata, and carried in its existing encoding so
  // none of its fields depend on this schema keeping up.
  bytes rpc = 9;
}

// Just enough of an engine log record to decide whether it is wanted.
//
// Reading a record as this skips the command and the metadata entirely rather than decoding and
// discarding them, which is most of the work when recovery is stepping over records it has
// already applied. The field numbers match EngineWalRecord, which is what makes it readable as
// one.
message EngineWalRecordHeader {
  uint64 shard_id = 1;
  uint64 sequence = 2;
}

message HashDelete {
  string key = 1;
  string field = 2;
}

message HashIncrBy {
  string key = 1;
  string field = 2;
  int64 increment = 3;
}

message ListPush {
  string key = 1;
  bytes member = 2;
  bool left = 3;
}

message ListPop {
  string key = 1;
  bool left = 2;
}

message SetRemove {
  string key = 1;
  bytes member = 2;
}

message ZSetAdd {
  string key = 1;
  bytes member = 2;
  double score = 3;
}

message ZSetRemove {
  string key = 1;
  bytes member = 2;
}

message ZSetIncrBy {
  string key = 1;
  bytes member = 2;
  double increment = 3;
}

message ZSetPop {
  string key = 1;
  bool min = 2;
  uint64 count = 3;
}


// WHICH CONTROL-STATE FAMILY A WRITE IS FILED UNDER.
//
// The Rust side spells these Counter/Distinct/Selection. The JSON form pinned the historical
// short tags (h/cpc/fol) so a rename carried no migration, and this enum pins the WIRE NUMBERS
// for the same reason: neither spelling is load-bearing once the number is what reaches disk.
//
// UNSPECIFIED is zero and is not a family. A record carrying it is a record written by a build
// that did not know the family, and the decoder refuses it by name rather than guessing Counter.
enum ControlStateFamily {
  CONTROL_STATE_FAMILY_UNSPECIFIED = 0;
  CONTROL_STATE_FAMILY_COUNTER = 1;
  CONTROL_STATE_FAMILY_DISTINCT = 2;
  CONTROL_STATE_FAMILY_SELECTION = 3;
}

// Which end of a selection window a write keeps. Same refusal rule for UNSPECIFIED.
enum ControlStateSelectionType {
  CONTROL_STATE_SELECTION_TYPE_UNSPECIFIED = 0;
  CONTROL_STATE_SELECTION_TYPE_FIRST = 1;
  CONTROL_STATE_SELECTION_TYPE_LAST = 2;
}

// `precision_ms` and `ttl_ms` are OPTIONAL, not zero-defaulted. Absent and zero are different
// requests here -- absent means "use the store default", zero is a value a caller can send --
// so these carry proto3 explicit presence rather than collapsing the two onto 0.
message ControlStateIncrementWithOptions {
  string key = 1;
  uint64 timestamp_ms = 2;
  int64 amount = 3;
  optional uint64 precision_ms = 4;
  optional uint64 ttl_ms = 5;
}

message ControlStateChangeAdd {
  string key = 1;
  uint64 timestamp_ms = 2;
  bytes value = 3;
  optional uint64 precision_ms = 4;
  optional uint64 ttl_ms = 5;
}

message ControlStateSet {
  ControlStateFamily family = 1;
  string key = 2;
  uint64 timestamp_ms = 3;
  int64 amount = 4;
}

message ControlStateSetAndGet {
  ControlStateFamily family = 1;
  string key = 2;
  uint64 timestamp_ms = 3;
  int64 amount = 4;
  uint64 start_ms = 5;
  uint64 end_ms = 6;
  string aggregator = 7;
}

message ControlStateSetAndGetWithOptions {
  ControlStateFamily family = 1;
  string key = 2;
  uint64 timestamp_ms = 3;
  int64 amount = 4;
  uint64 start_ms = 5;
  uint64 end_ms = 6;
  string aggregator = 7;
  optional uint64 precision_ms = 8;
  optional uint64 ttl_ms = 9;
  // The idempotency key. Absent is not the empty string: an empty uuid is a caller that sent one
  // and it happened to be empty, which dedups differently from a caller that sent none.
  optional string uuid = 10;
}

message ControlStateSelectionSet {
  string key = 1;
  bytes value = 2;
  uint64 occur_time_ms = 3;
  uint64 ttl_ms = 4;
  ControlStateSelectionType selection_type = 5;
}

// ===========================================================================================
// DURABLE SHARED-STORE OBJECTS, BINARY SHAPE.
//
// These are the small scalar objects the shared object store keeps beside a shard: the
// single-writer lease, the replay cursor, and the routing range stamped next to a published
// index. They are written as JSON today; every reader accepts BOTH shapes, and the writer takes
// the binary arm only when asked. See `SHARED_OBJECT_CONTAINER_PROTOBUF` in `shared_store.rs`
// for why one leading byte is enough to tell the two apart.
//
// The two manifests and the WAL entry envelope are NOT here yet. The manifests carry nested
// report structures, and the WAL envelope carries a `Command`, which cannot be modelled while
// the command roster still names writes the proto does not describe.
// ===========================================================================================

message SharedStoreShardLease {
  uint64 load_version = 1;
  string owner = 2;
}

message SharedStoreReplayCursorObject {
  uint64 shard_id = 1;
  uint64 last_wal_index = 2;
  uint64 last_replay_time_ms = 3;
}

message SharedStoreRoutingRangeStamp {
  uint32 start_routing_bucket = 1;
  uint32 end_routing_bucket = 2;
}

// ===========================================================================================
// Eight writes that reached the durable WAL as JSON because the proto did not model them.
// ===========================================================================================

// Whether a conditional string write may create, may only replace, or does not care.
// UNSPECIFIED is refused on decode: guessing `Always` would turn a create-only write into one
// that overwrites.
enum StringSetCondition {
  STRING_SET_CONDITION_UNSPECIFIED = 0;
  STRING_SET_CONDITION_ALWAYS = 1;
  STRING_SET_CONDITION_IF_EXISTS = 2;
  STRING_SET_CONDITION_IF_NOT_EXISTS = 3;
}

// What an append does when a point already exists at the same instant. UNSPECIFIED is refused:
// `Block` and `Upsert` are opposite answers, so a default would silently pick one.
enum FeatureWritePolicy {
  FEATURE_WRITE_POLICY_UNSPECIFIED = 0;
  FEATURE_WRITE_POLICY_UPSERT = 1;
  FEATURE_WRITE_POLICY_INSERT_IF_ABSENT = 2;
  FEATURE_WRITE_POLICY_REPLACE_EXISTING = 3;
  FEATURE_WRITE_POLICY_BLOCK = 4;
}

message BucketTake {
  string key = 1;
  double tokens = 2;
  double capacity = 3;
  double refill_per_sec = 4;
}

message CommonDelete {
  string key = 1;
}

message CommonPersist {
  string key = 1;
}

message FeatureDelete {
  string key = 1;
}

message FeatureReplace {
  string key = 1;
  uint64 start_ms = 2;
  uint64 end_ms = 3;
  // Reuses the existing point message rather than restating its two fields.
  repeated FeaturePoint points = 4;
}

message FeatureAppendWithPolicy {
  string key = 1;
  repeated FeaturePoint points = 2;
  FeatureWritePolicy policy = 3;
}

message SeenCheck {
  string key = 1;
  bytes member = 2;
  uint64 window_ms = 3;
}

// THE THREE-OUTCOME FIELD, AND WHY THE TWO PRESENCE RULES DIFFER.
//
// A value-replacing write can do one of three things to the deadline it overwrites: arm a new
// one, DISCARD the old one, or LEAVE IT ALONE. Two fields spell that, and they are modelled
// deliberately differently:
//
//   * `ttl_ms` carries EXPLICIT PRESENCE. Absent means discard the deadline; present means arm
//     that value, including zero. Collapsing absent onto a zero default would lose the
//     difference between "clear it" and "arm it for 0 ms".
//
//   * `keep_ttl` DOES NOT, and must not. Absent has to mean `false`, because that is the
//     clearing behaviour every record written before the field existed was recorded with. If it
//     carried explicit presence and absent were read as "leave the deadline alone", every one of
//     those records would CHANGE MEANING on replay -- an old record arming 5000 ms would replay
//     as no deadline at all, silently dropping a deadline that was durable.
//
// `ttl_ms` present together with `keep_ttl` true is contradictory and unreachable: the parser
// refuses an expiry beside KEEPTTL. It is not modelled as valid, and the shard treats an arming
// TTL as the winner if one is ever built by hand.
message StringSetConditional {
  string key = 1;
  bytes value = 2;
  optional uint64 ttl_ms = 3;
  StringSetCondition condition = 4;
  bool return_old = 5;
  bool keep_ttl = 6;
}

// ===========================================================================================
// The resource-blob writes. All five are scalars, bytes and a repeated hash list -- the
// payload became `bytes` when it stopped being a base64 string, so nothing here carries the
// 33% inflation a string field would have preserved into the binary format.
//
// They are mapped individually rather than as a set. The commit point is the RESOURCE RECORD
// that carries the returned URI, not the Commit command, so a blob with no record is garbage
// the sweep collects -- an expected state, not a corrupt one. The upload token is an opaque
// string that round-trips identically under either codec, so a mixed-codec
// begin/append/commit sequence still matches up.
// ===========================================================================================

message ContextResourceBlobBegin {
  uint64 tenant_hash = 1;
}

message ContextResourceBlobAppend {
  uint64 tenant_hash = 1;
  string upload_token = 2;
  bytes payload = 3;
}

message ContextResourceBlobCommit {
  uint64 tenant_hash = 1;
  string upload_token = 2;
}

message ContextResourceBlobPut {
  uint64 tenant_hash = 1;
  bytes payload = 2;
}

message ContextResourceBlobSweep {
  uint64 tenant_hash = 1;
  // Packed by default. It reads as a SET, so order is not load-bearing here -- unlike the
  // snapshot manifest's checksum list, where the published digest folds it in order.
  repeated uint64 referenced_content_hashes = 2;
  uint64 min_age_ms = 3;
}

// ===========================================================================================
// The context graph writes that carry only scalars or a small record.
//
// The node, the event and the four larger records are separate changes: they bring their own
// nested messages, and the durable node needs a COMPLETE message of its own rather than the
// four-field client projection above.
// ===========================================================================================

message ContextChildRef {
  uint64 parent_hash = 1;
  uint64 child_hash = 2;
  uint64 updated_at_ms = 3;
}

message ContextIndexRef {
  uint64 primary_node_hash = 1;
  uint64 primary_event_time_ms = 2;
  uint64 event_id_hash = 3;
}

message ContextMarkEmbeddingDirty {
  uint64 tenant_hash = 1;
  uint64 node_hash = 2;
  uint64 event_time_ms = 3;
  uint32 reason = 4;
  uint32 propagate_depth = 5;
  // `clear` flips the mark off rather than on, so a dropped field is not a smaller version of
  // the same write -- it is the opposite one. A plain bool, matching the Rust default of false.
  bool clear = 6;
}

message ContextMarkSummaryDirty {
  uint64 tenant_hash = 1;
  uint64 node_hash = 2;
  uint64 event_time_ms = 3;
  uint32 reason = 4;
  uint32 propagate_depth = 5;
}

message ContextCompressEvents {
  uint64 tenant_hash = 1;
  uint64 node_hash = 2;
  uint64 source_start_ms = 3;
  uint64 source_end_ms = 4;
  uint64 compressed_time_ms = 5;
  // EXPLICIT PRESENCE, because absent and zero are different requests: absent is "no cap on how
  // many source events to fold", zero is a cap of none at all. Collapsing them onto a zero
  // default would turn an uncapped compaction into one that folds nothing, or the reverse.
  optional uint64 max_source_events = 6;
  // Plain floats: the Rust fields default to 0.0, so absent decoding to 0.0 is the same value a
  // record written without them already replays with.
  float min_confidence = 7;
  float min_importance = 8;
}

message ContextUpsertChildRef {
  uint64 tenant_hash = 1;
  ContextChildRef child_ref = 2;
}

message ContextWriteIndexRef {
  uint64 tenant_hash = 1;
  string index_name = 2;
  uint64 index_value_hash = 3;
  uint64 scope_hash = 4;
  uint64 event_time_ms = 5;
  ContextIndexRef index_ref = 6;
}

// ===========================================================================================
// THE DURABLE CONTEXT NODE. ITS OWN COMPLETE MESSAGE, NOT THE CLIENT PROJECTION.
//
// `ContextNode` above is four fields and is marked a projection for a reason: the conversion
// into it fabricates the absent ones, and on disk a fabricated 0 cannot be told from a real
// one. `node_id` there is also a string that the Rust side hashes one way, so the durable
// identity could not be recovered from a record written through it. Two jobs, two messages.
//
// ALL FIFTEEN FIELDS ARE CARRIED, INCLUDING THREE THE JSON FORM NO LONGER WRITES.
// `status`, `l1_ref` and `raw_metadata_ref` are `#[serde(default, skip_serializing)]` --
// deprecated, still READ for legacy inputs, never written. They are carried here anyway,
// because this record's contract is to reproduce the COMMAND, not to re-apply the JSON form's
// write policy. Dropping a field the command still holds would be a silent loss on replay,
// and the round-trip assertion on this message is written to catch exactly that.
//
// THREE SEPARATE MODEL-HASH GUARDS, AND NONE OF THEM IS OPTIONAL-WITH-A-DEFAULT.
// A vector read under the wrong encoder produces no length error and no complaint -- just a
// cosine taken across two vector spaces. So each vector carries the encoder that produced it:
//
//   * `embedding_model_hash` for `vector`;
//   * `summary_vector_model_hash` for `summary_vector`, which is a COPY of the owning
//     summary's vector and can have been written by a different encoder -- a re-embed replaces
//     one without touching the other, so one shared field would let the copy skip the check;
//   * and `ContextSetNodeEmbedding.model_hash` on the write that sets a vector.
//
// Dropping or defaulting any of the three does not lose a datum: it disarms the check. They are
// plain scalars whose zero means "absent" exactly as the Rust defaults do, which is what every
// record written before they existed already replays with.
//
// `vector` and `summary_vector` are `repeated float` -- packed by default, and NOT quantised.
// Int8 quantisation is a separately gated decision with its own quality bar; folding it into a
// format port would hide a measurable quality change inside a change whose claim is "same
// values, different encoding".
message ContextNodeRecord {
  uint64 node_hash = 1;
  uint64 parent_hash = 2;
  uint32 kind = 3;
  string canonical_name = 4;
  string l0 = 5;
  // Deprecated in the JSON form (read, never written); carried so the command round-trips.
  uint32 status = 6;
  uint64 last_event_time_ms = 7;
  // Deprecated in the JSON form; carried for the same reason.
  string l1_ref = 8;
  // Deprecated in the JSON form; carried for the same reason.
  string raw_metadata_ref = 9;
  repeated float vector = 10;
  uint64 embedding_model_hash = 11;
  uint64 embedding_updated_at_ms = 12;
  repeated float summary_vector = 13;
  uint64 summary_vector_valid_from_ms = 14;
  uint64 summary_vector_model_hash = 15;
}

message ContextUpsertNode {
  uint64 tenant_hash = 1;
  // The Rust field is boxed, which is a layout choice -- the variant caps the enum's width --
  // and serialises identically to the unboxed field, so it is transparent to both codecs.
  ContextNodeRecord node = 2;
}

message ContextSetNodeEmbedding {
  uint64 tenant_hash = 1;
  uint64 node_hash = 2;
  // The guard, beside the vector it describes. See ContextNodeRecord above.
  uint64 model_hash = 3;
  repeated float vector = 4;
  uint64 updated_at_ms = 5;
}

// THE DURABLE EVENT. ALL FIFTEEN FIELDS.
//
// NOT a client projection. `ContextEvent` has no client message at all, and the one that exists
// for its sibling -- `message ContextNode`, four fields against a fifteen-field durable struct,
// whose converter fabricates `parent_hash`, `kind` and `status` as zero -- is exactly what a
// durable record must not reuse. `ContextNodeRecord` above is the same decision for the node.
//
// SEVEN OF THE FIFTEEN ARE `skip_serializing` IN THE JSON FORM, so the durable JSON this replaces
// never wrote them. They are carried anyway, as `ContextNodeRecord` carries its three: the WAL's
// contract is to reproduce the COMMAND, not to re-apply the JSON form's write policy. That makes
// this record STRICTLY MORE FAITHFUL than the JSON it replaces, which is a property the round-trip
// test asserts rather than a claim made here -- `event_type_code()` falls back to `kind`, so a
// replay that lost it resolves a different event type.
//
// `vector` is `repeated float` -- packed by default, and NOT quantised. Int8 quantisation is a
// separately gated decision with its own quality bar.
//
// NO MODEL HASH, and that is `ContextEvent`'s existing design rather than an omission here: the
// event vector has never carried one. Inventing a guard during a format port would put a field on
// disk that the shipped reader does not know, for a check this record has never made. The three
// that do exist -- `ContextNodeRecord.embedding_model_hash`,
// `ContextNodeRecord.summary_vector_model_hash` and `ContextSetNodeEmbedding.model_hash` -- stay
// individual and are not shared with this one.
message ContextEventRecord {
  uint64 event_id_hash = 1;
  uint64 event_time_ms = 2;
  uint64 ingestion_time_ms = 3;
  // Deprecated hot-schema field, `skip_serializing` in the JSON form; carried so the command
  // round-trips. `event_type_code()` reads this when `event_type` is zero.
  uint32 kind = 4;
  uint32 event_type = 5;
  // Deprecated hot-schema field; carried for the same reason.
  uint64 actor_hash = 6;
  // Deprecated hot-schema field; carried for the same reason.
  uint32 status = 7;
  // Deprecated hot-schema field; carried for the same reason.
  uint64 valid_until_ms = 8;
  float confidence = 9;
  float importance = 10;
  string text = 11;
  // Deprecated hot-schema field; carried for the same reason.
  string source_ref = 12;
  // Deprecated hot-schema field; carried for the same reason.
  repeated uint64 related_node_hashes = 13;
  // Deprecated hot-schema field; carried for the same reason.
  bytes compact_attrs = 14;
  repeated float vector = 15;
}

// The five internal secondary indexes an extraction can switch off.
//
// A proto3 enum must have a zero value and `InternalContextIndex` in Rust has no sixth variant, so
// UNSPECIFIED exists to satisfy the wire format and is NOT one of the five. The decode REFUSES it,
// and refuses any number it does not know: a repeated proto enum is open and arrives as `i32`, so
// an unmapped number defaulted to the first variant would switch off whichever index happens to
// sort first rather than the one that was asked for.
enum InternalContextIndex {
  INTERNAL_CONTEXT_INDEX_UNSPECIFIED = 0;
  INTERNAL_CONTEXT_INDEX_EVENT_KIND = 1;
  INTERNAL_CONTEXT_INDEX_ENTITY = 2;
  INTERNAL_CONTEXT_INDEX_STATUS = 3;
  INTERNAL_CONTEXT_INDEX_SOURCE = 4;
  INTERNAL_CONTEXT_INDEX_EVENT_TIME_BUCKET = 5;
}

message ContextExtractedEventIndexesRecord {
  uint64 scope_hash = 1;
  repeated uint64 entity_hashes = 2;
  uint64 status_hash = 3;
  uint64 source_hash = 4;
  uint64 event_time_bucket_ms = 5;
  repeated InternalContextIndex disabled_indexes = 6;
}

message ContextWriteEvent {
  uint64 tenant_hash = 1;
  uint64 node_hash = 2;
  // The Rust field is boxed -- the variant decides how wide EVERY command is -- and `Box<T>`
  // serialises identically to `T`, so it is transparent to both codecs.
  //
  // REFUSED BY NAME when absent, never defaulted: a nested message is always optional on the wire,
  // and an all-zero event filed as if real cannot be told from a real one afterwards.
  ContextEventRecord event = 3;
  bool first_write_only = 4;
  bool cold_storage = 5;
}

message ContextWriteExtractedEvent {
  uint64 tenant_hash = 1;
  uint64 node_hash = 2;
  // Refused by name when absent, as above.
  ContextEventRecord event = 3;
  // DEFAULTED when absent, unlike `event`, and the difference is read off the Rust declaration
  // rather than decided here: `indexes` is `#[serde(default)] indexes:
  // ContextExtractedEventIndexes`, a plain field with a `Default`, so the JSON reader this replaces
  // already treats an absent block as the empty default. `event` has no default and no absence the
  // JSON form accepts. The writer always emits this field, even when empty, so an absent block on
  // disk means an older build rather than an empty one.
  ContextExtractedEventIndexesRecord indexes = 4;
  bool first_write_only = 5;
  bool cold_storage = 6;
}

// THE DURABLE ENTITY. ALL TEN FIELDS.
message ContextEntityRecord {
  uint64 entity_hash = 1;
  uint64 node_hash = 2;
  // `#[serde(rename = "type", alias = "entity_type")]` in Rust, so the JSON key is `type` and the
  // identifier is `entity_type`. A proto field name is not a JSON key and nothing reads it as one,
  // so it is named for the identifier.
  uint32 entity_type = 3;
  string name = 4;
  string value = 5;
  uint64 updated_at_ms = 6;
  uint64 valid_from_ms = 7;
  float confidence = 8;
  repeated uint64 source_event_hashes = 9;
  // Inline, `repeated float`, packed, and NOT quantised.
  //
  // NO MODEL HASH, which is `ContextEntity`'s existing design rather than a guard dropped here --
  // the entity vector has never carried one, exactly as the event vector has not. Compare
  // ContextSummaryRecord below, which DOES carry one and must keep it.
  repeated float vector = 10;
}

// THE DURABLE SUMMARY. ALL SIX FIELDS, AND ONE OF THEM IS AN ENCODER GUARD IN ITS OWN RIGHT.
//
// `embedding_model_hash` here is the FOURTH such guard in this file and must not be shared with,
// defaulted from or folded into any of the other three -- `ContextNodeRecord.embedding_model_hash`,
// `ContextNodeRecord.summary_vector_model_hash` and `ContextSetNodeEmbedding.model_hash`. The
// reason is in the Rust doc on the field: the retrieve pass scores a node's OWN vector and this
// summary's vector into ONE score map, so a summary scored under a replaced encoder marks the node
// scored and withdraws the lexical fallback the declined node was routed to. That is worse than
// being un-embedded, not equal to it.
//
// Zeroing it loses no datum: it disarms the check. Two encoders truncated to the same width give
// no length error, only a cosine across two vector spaces. Zero means unknown -- a summary written
// before the field existed, or one carrying no vector -- and unknown never conflicts.
message ContextSummaryRecord {
  uint64 node_hash = 1;
  uint32 level = 2;
  string text = 3;
  uint64 valid_from_ms = 4;
  // NOT quantised.
  repeated float vector = 5;
  // The guard, beside the vector it describes. See above.
  uint64 embedding_model_hash = 6;
}

message ContextCompressionEventRecord {
  uint64 compression_id_hash = 1;
  uint64 node_hash = 2;
  uint64 source_start_ms = 3;
  uint64 source_end_ms = 4;
  uint64 compressed_time_ms = 5;
  string summary = 6;
}

message ContextAuditRefRecord {
  uint64 node_hash = 1;
  uint64 event_time_ms = 2;
  string reason = 3;
}

message ContextPackAuditRecord {
  string query_id = 1;
  uint64 session_hash = 2;
  uint64 request_time_ms = 3;
  uint64 query_hash = 4;
  uint32 max_prompt_tokens = 5;
  uint32 selected_tokens = 6;
  // REPEATED, so there is nothing to refuse: a repeated field has no presence on the wire in
  // proto3, and `#[serde(default)]` on the Rust side already takes an absent list as empty.
  //
  // The two lists are kept SEPARATE and are asserted separately. Selected and blocked are the two
  // halves of the audit's verdict, so a converter that crossed them would reverse every decision
  // the audit records while every field still round-tripped.
  repeated ContextAuditRefRecord selected_refs = 7;
  repeated ContextAuditRefRecord blocked_refs = 8;
}

message ContextUpsertEntity {
  uint64 tenant_hash = 1;
  // Refused by name when absent, never defaulted: a nested message is always optional on the wire,
  // and an upsert with no entity would file a record of all zeros that cannot afterwards be told
  // from a real one.
  ContextEntityRecord entity = 2;
}

message ContextUpsertSummary {
  uint64 tenant_hash = 1;
  // Refused by name when absent, as above.
  ContextSummaryRecord summary = 2;
}

message ContextWriteCompressionEvent {
  uint64 tenant_hash = 1;
  // Refused by name when absent, as above.
  ContextCompressionEventRecord event = 2;
}

message ContextWritePackAudit {
  uint64 tenant_hash = 1;
  // Refused by name when absent, as above.
  ContextPackAuditRecord audit = 2;
}

// ===========================================================================================
// THE DURABLE INGESTION STATE, the one file under the engine's ingestion directory.
//
// It is rewritten WHOLE under a temp-and-rename, so there is no partial-document shape to
// model and no append framing: one message is one file. The reader lands first and accepts
// both shapes; the writer that produces this one follows in its own change.
//
// NOTHING ASSERTS THE FILENAME. `state.json` appears exactly once in the crate, as a
// `root.join("state.json")` construction with no test or doc pinning it, so the spelling is
// not a durable contract the way `slab_manifest.json` is. The name stays regardless: the
// writer retires either way, and renaming a path that is already on disk is a separate,
// riskier decision.
// ===========================================================================================

// The ingestion crate's own `Status`, which rides inside a dead letter. Distinct from the
// service-level status messages above because it is a DURABLE field here, not a response.
message IngestionStatus {
  bool ok = 1;
  string code = 2;
  string message = 3;
}

message IngestionSourceApi {
  string request_id = 1;
}

message IngestionSourceKafka {
  string topic = 1;
  int32 partition = 2;
  int64 offset = 3;
  // ABSENT IS NOT EMPTY, AND ABSENT IS NOT ZERO. Both of these are `Option` in the durable
  // shape, and a record with no key reads differently from one keyed by the empty string, so
  // they are `optional` rather than bare scalars.
  optional string key = 4;
  optional uint64 timestamp_ms = 5;
}

message IngestionSourceFlink {
  string job_id = 1;
  string operator_uid = 2;
  uint32 subtask_index = 3;
  uint64 checkpoint_id = 4;
  uint64 record_index = 5;
}

// A `oneof`, and an ABSENT one is refused on decode rather than read as an API source. The
// three arms carry different idempotence keys, so guessing one would let a replayed Kafka
// record through as a fresh API call.
message IngestionSource {
  oneof source {
    IngestionSourceApi api = 1;
    IngestionSourceKafka kafka = 2;
    IngestionSourceFlink flink = 3;
  }
}

message KafkaOffsetLedgerEntry {
  string topic = 1;
  int32 partition = 2;
  int64 committed_offset = 3;
  uint64 updated_unix_ms = 4;
}

message IngestionStreamCommitState {
  string stream_id = 1;
  uint64 committed_sequence = 2;
  uint64 updated_unix_ms = 3;
}

// UNSPECIFIED is refused on decode. Precommitted, Committed and Aborted decide whether a
// Flink checkpoint's records may be replayed, so defaulting the tag would either replay
// committed work or discard precommitted work.
enum FlinkCheckpointStatus {
  FLINK_CHECKPOINT_STATUS_UNSPECIFIED = 0;
  FLINK_CHECKPOINT_STATUS_PRECOMMITTED = 1;
  FLINK_CHECKPOINT_STATUS_COMMITTED = 2;
  FLINK_CHECKPOINT_STATUS_ABORTED = 3;
}

message FlinkCheckpointState {
  string job_id = 1;
  string operator_uid = 2;
  uint32 subtask_index = 3;
  uint64 checkpoint_id = 4;
  FlinkCheckpointStatus status = 5;
  uint64 updated_unix_ms = 6;
}

message IngestionDeadLetter {
  uint64 index = 1;
  IngestionSource source = 2;
  uint64 shard_id = 3;
  IngestionStatus status = 4;
}

message IngestionStats {
  uint64 accepted_total = 1;
  uint64 failed_total = 2;
  uint64 duplicate_total = 3;
  uint64 dead_letter_total = 4;
  uint64 stream_backpressure_total = 5;
  uint64 stream_duplicate_total = 6;
  uint64 kafka_committed_total = 7;
  uint64 flink_precommit_total = 8;
  uint64 flink_commit_total = 9;
  uint64 flink_abort_total = 10;
  int64 max_kafka_lag = 11;
}

// KEYED ENTRIES, NOT A PROTO `map`. The three collections are `BTreeMap`s in memory, so their
// iteration order IS their key order and a re-encode of one state produces the same bytes. A
// proto `map` has no defined order, which would make the same state encode differently on
// different runs -- and this file is compared and checksummed by operators.
//
// The key is carried EXPLICITLY rather than rebuilt from the value's fields. It is derived
// (`kafka_offset_key`, `flink_checkpoint_key`), and a decoder that recomputed it would quietly
// re-key a document whose key function has since changed, instead of reading what was written.
message DurableIngestionKafkaOffsetEntry {
  string key = 1;
  KafkaOffsetLedgerEntry value = 2;
}

message DurableIngestionStreamCommitEntry {
  string key = 1;
  IngestionStreamCommitState value = 2;
}

message DurableIngestionFlinkCheckpointEntry {
  string key = 1;
  FlinkCheckpointState value = 2;
}

message DurableIngestionState {
  repeated DurableIngestionKafkaOffsetEntry kafka_offsets = 1;
  repeated DurableIngestionStreamCommitEntry stream_commits = 2;
  repeated DurableIngestionFlinkCheckpointEntry flink_checkpoints = 3;
  // ORDER PRESERVED: dead letters are a `Vec` and operators read them in arrival order.
  repeated IngestionDeadLetter dead_letters = 4;
  IngestionStats stats = 5;
}
