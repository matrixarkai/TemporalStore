}

message RiskFamilySetAndGet {
  RiskFamily family = 1;
  string key = 2;
  uint64 timestamp_ms = 3;
  int64 amount = 4;
  uint64 start_ms = 5;
  uint64 end_ms = 6;
  string aggregator = 7;
}

message RiskFolSet {
  string key = 1;
  bytes value = 2;
  uint64 occur_time_ms = 3;
  uint64 ttl_ms = 4;
  RiskFolType fol_type = 5;
}

message RiskFolQuery {
  string key = 1;
}

message RiskManager {
  string key = 1;
}

message RiskDebug {
  string key = 1;
  uint64 start_ms = 2;
  uint64 end_ms = 3;
}

message ContextNode {
  string node_id = 1;
  string model = 2;
  bytes payload = 3;
  uint64 updated_at_ms = 4;
}

message ContextEvent {
  uint64 event_id_hash = 1;
  uint64 event_time_ms = 2;
  uint64 ingestion_time_ms = 3;
  uint32 event_type = 4;
  float confidence = 5;
  float importance = 6;
  string text = 7;
}

message ContextWriteEvent {
  string key = 1;
  string node_id = 2;
  ContextEvent event = 3;
  bool first_write_only = 4;
  bool cold_storage = 5;
}

message ContextQueryEvents {
  string key = 1;
  string node_id = 2;
  uint64 start_time_ms = 3;
  uint64 end_time_ms = 4;
  uint32 limit = 5;
  bool current_valid_only = 6;
  uint64 as_of_ms = 7;
  repeated uint32 kinds = 8;
  repeated uint32 statuses = 9;
  float min_confidence = 10;
  float min_importance = 11;
}

message ContextNodeUpsert {
  string key = 1;
  ContextNode node = 2;
}

message ContextNodeGet {
  string key = 1;
  string node_id = 2;
}

message ContextNodesGet {
  string key = 1;
  repeated string node_ids = 2;
}

message ContextIndexRef {
  uint64 primary_node_hash = 1;
  uint64 primary_event_time_ms = 2;
  uint64 event_id_hash = 3;
}

message ContextWriteIndexRef {
  string key = 1;
  string index_name = 2;
  uint64 index_value_hash = 3;
  uint64 scope_hash = 4;
  uint64 event_time_ms = 5;
