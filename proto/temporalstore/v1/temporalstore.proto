message ContextExtractedEventIndexes {
  uint64 scope_hash = 1;
  repeated uint64 entity_hashes = 2;
  uint64 status_hash = 3;
  uint64 source_hash = 4;
  uint64 event_time_bucket_ms = 5;
  repeated uint32 disabled_indexes = 6;
}

message ContextWriteExtractedEvent {
  string key = 1;
  string node_id = 2;
  ContextEvent event = 3;
  ContextExtractedEventIndexes indexes = 4;
  bool first_write_only = 5;
  bool cold_storage = 6;
}

message ContextIndexLookup {
  string index_name = 1;
  uint64 index_value_hash = 2;
