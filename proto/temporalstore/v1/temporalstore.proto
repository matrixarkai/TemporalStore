}

message ContextWriteCompressionEvent {
  string key = 1;
  ContextCompressionEvent event = 2;
}

message ContextQueryCompressionEvents {
  string key = 1;
  repeated uint64 node_hashes = 2;
  uint64 start_time_ms = 3;
  uint64 end_time_ms = 4;
  uint32 limit = 5;
}

message ContextCompressEvents {
  string key = 1;
  uint64 node_hash = 2;
  uint64 source_start_ms = 3;
  uint64 source_end_ms = 4;
  uint64 compressed_time_ms = 5;
  uint32 max_source_events = 6;
  float min_confidence = 7;
  float min_importance = 8;
}

message ContextQueryNodeContext {
  string key = 1;
  uint64 node_hash = 2;
  uint32 summary_level = 3;
  uint64 as_of_ms = 4;
  uint64 cold_start_time_ms = 5;
  uint64 cold_end_time_ms = 6;
  uint32 compression_limit = 7;
}

message CommonExpire {
  string key = 1;
  uint64 ttl_ms = 2;
}

message CommonExists {
  string key = 1;
}

message CommonTtl {
  string key = 1;
}
