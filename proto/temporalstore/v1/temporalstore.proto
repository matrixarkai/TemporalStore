syntax = "proto3";

package temporalstore.v1;

// TemporalStoreService is the Rust-native production SDK contract. Existing
// HTTP/JSON client and proxy routes must continue to expose the same logical
// request and response fields until generated tonic/prost bindings are wired.
service TemporalStoreService {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc BatchExecute(BatchExecuteRequest) returns (BatchExecuteResponse);
  rpc OpenTable(OpenTableRequest) returns (OpenTableResponse);
  rpc SyncTopology(SyncTopologyRequest) returns (SyncTopologyResponse);
  rpc GetClientPreflight(ClientPreflightRequest) returns (ClientPreflightResponse);
}

// ProxyService is the Rust-native proxy RPC contract. It intentionally does
// not claim legacy C++ wire compatibility; existing C++ callers must migrate
// through the Rust-native HTTP/RESP/tonic surfaces.
service ProxyService {
  rpc ProxyExecuteStream(stream ProxyStreamRequest) returns (stream ProxyStreamEvent);
  rpc RouteCallbacks(stream ProxyRouteCallback) returns (stream ProxyRouteAck);
  rpc WatchProxyPreflight(ProxyPreflightWatchRequest) returns (stream ProxyPreflightEvent);
}

// DataNodeService is the Rust-native data-node RPC contract. HTTP routes keep
// serving local tests, while production adapters use this streaming shape for
// shard-affine execution, async lifecycle callbacks, and job status updates.
service DataNodeService {
  rpc ExecuteStream(stream DataNodeStreamRequest) returns (stream DataNodeStreamEvent);
  rpc LifecycleCallbacks(stream DataNodeLifecycleCallback) returns (stream DataNodeLifecycleAck);
  rpc WatchJobStatus(DataNodeJobStatusRequest) returns (stream DataNodeJobStatusEvent);
}

message Status {
  bool ok = 1;
  string code = 2;
  string message = 3;
}

message ExecuteRequest {
  uint64 shard_id = 1;
  uint64 trace_id = 2;
  Command command = 3;
}

message ExecuteResponse {
  Status status = 1;
  CommandResponse response = 2;
  uint64 topology_version = 3;
}

message BatchExecuteRequest {
  uint64 shard_id = 1;
  uint64 trace_id = 2;
  repeated Command commands = 3;
}

message BatchExecuteResponse {
  Status status = 1;
  repeated CommandResponse responses = 2;
  uint64 topology_version = 3;
}

message OpenTableRequest {
  string namespace_name = 1;
  string table_name = 2;
  string local_location = 3;
}

message OpenTableResponse {
  Status status = 1;
  TableTopology topology = 2;
}

message SyncTopologyRequest {
  repeated string table_keys = 1;
  uint64 min_topology_version = 2;
  uint64 deadline_ms = 3;
}

message SyncTopologyResponse {
  Status status = 1;
  repeated TableTopology topologies = 2;
  uint64 topology_version = 3;
}

message ClientPreflightRequest {
  bool include_routes = 1;
  bool include_backend_failures = 2;
}

message ClientPreflightResponse {
  Status status = 1;
  uint64 route_cache_entries = 2;
  uint64 table_cache_entries = 3;
  uint64 backend_failure_entries = 4;
  uint64 topology_version = 5;
  bool degraded = 6;
  repeated string warnings = 7;
}

message ProxyStreamRequest {
  oneof kind {
    ExecuteRequest execute = 1;
    BatchExecuteRequest batch_execute = 2;
    SyncTopologyRequest sync_topology = 3;
  }
}

message ProxyStreamEvent {
  Status status = 1;
  uint64 topology_version = 2;
  ExecuteResponse execute = 3;
  BatchExecuteResponse batch_execute = 4;
  repeated string route_refreshes = 5;
}

message ProxyRouteCallback {
  string table_key = 1;
  uint64 shard_id = 2;
  uint64 topology_version = 3;
  string reason = 4;
  Status status = 5;
}

message ProxyRouteAck {
  Status status = 1;
  string table_key = 2;
  uint64 shard_id = 3;
  uint64 topology_version = 4;
}

message ProxyPreflightWatchRequest {
  bool include_routes = 1;
  bool include_policy = 2;
  uint64 min_topology_version = 3;
}

message ProxyPreflightEvent {
  Status status = 1;
  uint64 topology_version = 2;
  bool degraded = 3;
  repeated string warnings = 4;
}

message DataNodeStreamRequest {
  oneof kind {
    ExecuteRequest execute = 1;
    BatchExecuteRequest batch_execute = 2;
    DataNodeJobControl job_control = 3;
  }
}

message DataNodeStreamEvent {
  Status status = 1;
  uint64 job_id = 2;
  ExecuteResponse execute = 3;
  BatchExecuteResponse batch_execute = 4;
  string lifecycle_state = 5;
}

message DataNodeJobControl {
  uint64 job_id = 1;
  string action = 2;
}

message DataNodeLifecycleCallback {
  uint64 shard_id = 1;
  string operation = 2;
  string state = 3;
  uint64 load_version = 4;
  uint64 scheduler_task_id = 5;
  uint64 scheduler_generation = 6;
  Status status = 7;
}

message DataNodeLifecycleAck {
  Status status = 1;
  uint64 shard_id = 2;
  string operation = 3;
  uint64 scheduler_task_id = 4;
  uint64 scheduler_generation = 5;
}

message DataNodeJobStatusRequest {
  uint64 job_id = 1;
  bool include_finished = 2;
}

message DataNodeJobStatusEvent {
  Status status = 1;
  uint64 job_id = 2;
  string kind = 3;
  bool finished = 4;
}

message TableTopology {
  string namespace_name = 1;
  string table_name = 2;
  string state = 3;
  bool readonly = 4;
  bool write_disabled = 5;
  uint32 drop_percent = 6;
  uint64 topology_version = 7;
  repeated ShardTopology shards = 8;
}

message ShardTopology {
  uint64 shard_id = 1;
  ServerEndpoint primary = 2;
  repeated ServerEndpoint replicas = 3;
  uint64 load_generation = 4;
  string lifecycle_state = 5;
}

message ServerEndpoint {
  string server_id = 1;
  string host = 2;
  uint32 port = 3;
  string location = 4;
}

message Command {
  oneof kind {
    StringSet string_set = 1;
    StringGet string_get = 2;
    StringDelete string_delete = 3;
    HashSet hash_set = 4;
    HashGet hash_get = 5;
    HashMultiSet hash_multi_set = 6;
    HashMultiGet hash_multi_get = 7;
    SetAdd set_add = 8;
    SetMembers set_members = 9;
    FeatureAppend feature_append = 10;
    FeatureQuery feature_query = 11;
    SequenceAppend sequence_append = 12;
    SequenceQuery sequence_query = 13;
    IpsAdd ips_add = 14;
    IpsQuery ips_query = 15;
    RiskIncrement risk_increment = 16;
    RiskQuery risk_query = 17;
    ContextNodeUpsert context_node_upsert = 18;
    ContextNodeGet context_node_get = 19;
    CommonExpire common_expire = 20;
    CommonExists common_exists = 21;
    HashDelete hash_delete = 22;
    HashGetAll hash_get_all = 23;
    HashLen hash_len = 24;
    SetRemove set_remove = 25;
    CommonTtl common_ttl = 26;
    FeatureReplace feature_replace = 27;
    FeatureDelete feature_delete = 28;
    FeatureAggQuery feature_agg_query = 29;
    SequenceBatchQuery sequence_batch_query = 30;
    IpsAddWithOptions ips_add_with_options = 31;
    IpsQueryLast ips_query_last = 32;
    RiskIncrementWithOptions risk_increment_with_options = 33;
    RiskCount risk_count = 34;
    RiskChangeAdd risk_change_add = 35;
    RiskDetail risk_detail = 36;
    RiskFamilySet risk_family_set = 37;
    RiskFamilyQuery risk_family_query = 38;
    RiskFamilySetAndGet risk_family_set_and_get = 39;
    RiskFolSet risk_fol_set = 40;
    RiskFolQuery risk_fol_query = 41;
    RiskManager risk_manager = 42;
  }
}

message CommandResponse {
  Status status = 1;
  bytes value = 2;
  repeated bytes values = 3;
  repeated FeaturePoint feature_points = 4;
  repeated SequenceFeatureRow sequence_rows = 5;
  repeated ContextNode context_nodes = 6;
  uint64 count = 7;
  bool exists = 8;
}

message StringSet {
  string key = 1;
  bytes value = 2;
  uint64 ttl_ms = 3;
}

message StringGet {
  string key = 1;
}

message StringDelete {
  string key = 1;
}

message HashSet {
  string key = 1;
  string field = 2;
  bytes value = 3;
}

message HashGet {
  string key = 1;
  string field = 2;
}

message HashDelete {
  string key = 1;
  string field = 2;
}

message HashGetAll {
  string key = 1;
}

message HashLen {
  string key = 1;
}

message HashEntry {
  string field = 1;
  bytes value = 2;
}

message HashMultiSet {
  string key = 1;
  repeated HashEntry entries = 2;
}

message HashMultiGet {
  string key = 1;
  repeated string fields = 2;
}

message SetAdd {
  string key = 1;
  bytes member = 2;
}

message SetMembers {
  string key = 1;
}

message SetRemove {
  string key = 1;
  bytes member = 2;
}

message FeaturePoint {
  uint64 timestamp_ms = 1;
  bytes value = 2;
}

message FeatureAppend {
  string key = 1;
  repeated FeaturePoint points = 2;
}

message FeatureQuery {
  string key = 1;
  uint64 start_ms = 2;
  uint64 end_ms = 3;
  uint32 limit = 4;
}

message FeatureReplace {
  string key = 1;
  uint64 start_ms = 2;
  uint64 end_ms = 3;
  repeated FeaturePoint points = 4;
}

message FeatureDelete {
  string key = 1;
}

message FeatureAggQuery {
  string key = 1;
  uint64 start_ms = 2;
  uint64 end_ms = 3;
  string aggregator = 4;
  uint32 limit = 5;
}

message SequenceFeatureRow {
  uint64 timestamp_ms = 1;
  uint64 gid = 2;
  uint32 action_type = 3;
  uint32 duration = 4;
  uint64 author_id = 5;
}

message SequenceAppend {
  string key = 1;
  repeated SequenceFeatureRow rows = 2;
}

message SequenceQuery {
  string key = 1;
  uint64 start_ms = 2;
  uint64 end_ms = 3;
  uint32 limit = 4;
}

message SequenceQuerySpec {
  string key = 1;
  uint64 start_ms = 2;
  uint64 end_ms = 3;
  uint32 limit = 4;
}

message SequenceBatchQuery {
  repeated SequenceQuerySpec queries = 1;
}

message IpsAdd {
  string key = 1;
  uint64 timestamp_ms = 2;
  bytes payload = 3;
}

message IpsAddWithOptions {
  string key = 1;
  uint64 timestamp_ms = 2;
  bytes payload = 3;
  optional uint32 action_type = 4;
  optional uint64 table_id = 5;
  string request_id = 6;
}

message IpsQuery {
  string key = 1;
  uint64 start_ms = 2;
  uint64 end_ms = 3;
  uint32 limit = 4;
}

message IpsQueryLast {
  string key = 1;
  uint32 limit = 2;
}

enum RiskFamily {
  RISK_FAMILY_UNSPECIFIED = 0;
  RISK_FAMILY_H = 1;
  RISK_FAMILY_CPC = 2;
  RISK_FAMILY_FOL = 3;
}

enum RiskFolType {
  RISK_FOL_TYPE_UNSPECIFIED = 0;
  RISK_FOL_TYPE_FIRST = 1;
  RISK_FOL_TYPE_LAST = 2;
}

message RiskIncrement {
  string key = 1;
  string family = 2;
  int64 delta = 3;
  uint64 timestamp_ms = 4;
}

message RiskIncrementWithOptions {
  string key = 1;
  int64 delta = 2;
  uint64 timestamp_ms = 3;
  optional uint64 precision_ms = 4;
  optional uint64 ttl_ms = 5;
}

message RiskCount {
  string key = 1;
  uint64 start_ms = 2;
  uint64 end_ms = 3;
}

message RiskChangeAdd {
  string key = 1;
  uint64 timestamp_ms = 2;
  bytes value = 3;
  optional uint64 precision_ms = 4;
  optional uint64 ttl_ms = 5;
}

message RiskDetail {
  string key = 1;
  uint64 start_ms = 2;
  uint64 end_ms = 3;
  uint32 limit = 4;
}

message RiskQuery {
  string key = 1;
  string family = 2;
  uint64 start_ms = 3;
  uint64 end_ms = 4;
}

message RiskFamilySet {
  RiskFamily family = 1;
  string key = 2;
  uint64 timestamp_ms = 3;
  int64 amount = 4;
}

message RiskFamilyQuery {
  RiskFamily family = 1;
  string key = 2;
  uint64 start_ms = 3;
  uint64 end_ms = 4;
  string aggregator = 5;
}

message RiskFamilySetAndGet {
  RiskFamily family = 1;
  string key = 2;
  uint64 timestamp_ms = 3;
  int64 amount = 4;
  uint64 start_ms = 5;
  uint64 end_ms = 6;
  string aggregator = 7;
}

message RiskFolSet {
  string key = 1;
  bytes value = 2;
  uint64 occur_time_ms = 3;
  uint64 ttl_ms = 4;
  RiskFolType fol_type = 5;
}

message RiskFolQuery {
  string key = 1;
}

message RiskManager {
  string key = 1;
}

message ContextNode {
  string node_id = 1;
  string model = 2;
  bytes payload = 3;
  uint64 updated_at_ms = 4;
}

message ContextNodeUpsert {
  string key = 1;
  ContextNode node = 2;
}

message ContextNodeGet {
  string key = 1;
  string node_id = 2;
}

message CommonExpire {
  string key = 1;
  uint64 ttl_ms = 2;
}

message CommonExists {
  string key = 1;
}

message CommonTtl {
  string key = 1;
}
