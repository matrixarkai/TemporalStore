message ContextQueryIndex {
  string key = 1;
  string index_name = 2;
  uint64 index_value_hash = 3;
  uint64 scope_hash = 4;
  uint64 start_time_ms = 5;
  uint64 end_time_ms = 6;
  uint32 limit = 7;
