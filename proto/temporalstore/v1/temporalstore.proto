}

message ContextQueryEmbeddings {
  string key = 1;
  repeated uint64 ref_hashes = 2;
  uint32 limit = 3;
}

message ContextTraverseTree {
  string key = 1;
  uint64 start_node_hash = 2;
  repeated float query_vector = 3;
  uint32 max_depth = 4;
  uint32 top_k_per_depth = 5;
  uint32 max_children_scored_per_parent = 6;
  uint32 max_candidate_nodes = 7;
  bool leaf_only = 8;
}

message ContextSummary {
  uint64 node_hash = 1;
  uint32 level = 2;
  string text = 3;
  uint64 valid_from_ms = 4;
}

message ContextUpsertSummary {
  string key = 1;
  ContextSummary summary = 2;
}

message ContextQuerySummaries {
  string key = 1;
  uint64 node_hash = 2;
  uint32 level = 3;
  uint64 as_of_ms = 4;
  uint32 limit = 5;
}

message ContextCompressionEvent {
  uint64 compression_id_hash = 1;
  uint64 node_hash = 2;
  uint64 source_start_ms = 3;
  uint64 source_end_ms = 4;
  uint64 compressed_time_ms = 5;
