}

message ContextQueryPackAudit {
  string key = 1;
  uint64 session_hash = 2;
  uint64 start_time_ms = 3;
  uint64 end_time_ms = 4;
  uint32 limit = 5;
}

message ContextSummaryDirtyMarker {
  uint64 node_hash = 1;
  uint64 event_time_ms = 2;
  uint32 reason = 3;
