[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmcache-temporalstore"
version = "0.1.0"
description = "TemporalStore L2 KV cache adapter for LMCache"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["lmcache>=0.5.8,<0.6", "feast-temporalstore>=0.1,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lmcache_temporalstore*"]
