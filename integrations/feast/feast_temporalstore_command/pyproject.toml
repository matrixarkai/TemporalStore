[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "feast-temporalstore-command"
version = "0.1.0"
description = "Feast online store backed by TemporalStore, over its native command surface"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "MatrixArkAI" }]
keywords = ["feast", "feature-store", "temporalstore", "online-store"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
# HTTP uses the standard library; MessagePack keeps long feature responses as
# byte strings instead of expanding them through JSON base64.
dependencies = ["feast>=0.40", "msgpack>=1.0"]

[project.urls]
Homepage = "https://github.com/matrixarkai/TemporalStore"
Repository = "https://github.com/matrixarkai/TemporalStore"

[tool.setuptools]
packages = ["feast_temporalstore_command"]
