# =============================================================================
# TemporalStore / MatrixArk - centralized service configuration
# =============================================================================
# This file is the documented source of truth for every operator-tunable knob
# across BOTH the Python gateway and the Rust engine (datanode / proxy /
# metaserver). It is loaded by tools/matrixark_load_config.py (invoked through
# scripts/with_config.sh): each key below is exported as its mapped environment
# variable ONLY IF that variable is not already set in the environment.
#
# PRECEDENCE (lowest to highest):
#     built-in code default  <  this file  <  explicit environment variable
#
# So this file documents and pins the defaults; an operator can still override
# any single knob for a one-off run by exporting the env var before launch
# (env always wins). Nothing here edits the scattered readers - the existing
# os.environ.get(...) / std::env::var(...) reads pick these values up unchanged.
#
# Each key maps to exactly one environment variable. The mapping is
# SECTION.key -> ENV_VAR and is defined authoritatively in
# tools/matrixark_load_config.py (the ENV_MAP table). The env var name is shown
# in-line next to every key below so the file and the process environment are
# unambiguously linked.
#
# Commented-out ("# key = ...") knobs are documented but INACTIVE by default:
# their code behavior when unset (auto-sizing, "no limit", optional endpoints,
# feature flags that ship OFF) cannot be reproduced by pinning a value, so the
# loader leaves the env var untouched unless you uncomment them.
# =============================================================================


# -----------------------------------------------------------------------------
# [server] - datanode process: bind addresses, worker pool, on-disk directories
# -----------------------------------------------------------------------------
[server]
bind_addr = "127.0.0.1:17002"          # TS_SERVER_BIND_ADDR    datanode listen host:port
# advertise_addr = "127.0.0.1:17002"   # TS_SERVER_ADVERTISE_ADDR  address advertised to metaserver (default = bind_addr)
node_id = 0                            # TS_SERVER_NODE_ID      stable numeric node id (0 = auto)
shard_id = 1                           # TS_SHARD_ID            shard this datanode loads
worker_threads = 4                     # TS_SERVER_WORKER_THREADS   request worker pool size
max_queue_depth = 1024                 # TS_SERVER_MAX_QUEUE_DEPTH  admission cap for foreground requests
max_background_queue_depth = 128       # TS_SERVER_MAX_BACKGROUND_QUEUE_DEPTH  cap for background tasks
heartbeat_interval_ms = 3000           # TS_SERVER_HEARTBEAT_INTERVAL_MS  ms between metaserver heartbeats
location = ""                          # TS_SERVER_LOCATION     topology/zone label (informational)
cache_dir = "target/temporalstore-cache"      # TS_CACHE_DIR       hot record cache directory
page_store_dir = "target/temporalstore-pages" # TS_PAGE_STORE_DIR  durable data-page (slab) directory
# blob_store_dir = "target/temporalstore-pages/blobs"  # TS_BLOB_STORE_DIR  streamed attachment tier (default = <page_store_dir>/blobs)
index_dir = "target/temporalstore-indexes"    # TS_INDEX_DIR       served-index directory
cache_memory_bytes = 16777216          # TS_CACHE_MEMORY_BYTES  in-memory record cache budget (bytes, 16 MiB)
blob_chunk_bytes = 1048576             # TS_BLOB_CHUNK_BYTES    blob streaming chunk size (bytes, 1 MiB)
# standalone = 1                       # TS_STANDALONE   force mode: 1=standalone, 0=distributed (default derived: standalone unless meta_addr is real or distributed=1)
distributed = 0                        # TS_DISTRIBUTED  1 = opt into distributed topology (needs a real meta_addr)


# -----------------------------------------------------------------------------
# [storage] - storage backend selection, slab/page sizing, compression, GC
# -----------------------------------------------------------------------------
[storage]
backend = "auto"                       # TS_STORAGE_BACKEND  auto | shared | raft | (enterprise object store); auto probes + falls back
# object_store_endpoint = ""           # TS_MATRIXOBJECT_ENDPOINT  networked object-store service endpoint (enterprise; unset = node-local)
# object_store_bucket = ""             # TS_MATRIXOBJECT_BUCKET    object-store bucket name (enterprise)
# object_store_dir = ""                # TS_MATRIXOBJECT_STORE_DIR  on-disk object-store root (enterprise, single-node)
# shared_store_dir = ""                # TS_SHARED_STORE_DIR   shared-path backend root directory
zone_size_bytes = 1073741824           # TS_STORAGE_ZONE_SIZE   device zone seal size (bytes, 1 GiB)
context_page_target_bytes = 65536      # TS_CONTEXT_PAGE_TARGET_BYTES  target context page size (bytes, 64 KiB)
block_slab_target_bytes = 1073741824   # TS_BLOCK_SEGMENT_TARGET_BYTES  data-slab seal size (bytes, 1 GiB)
# stream_max_blob_size = 0             # TS_STREAM_MAX_BLOB_SIZE  max inline blob before streaming tier (0/unset = engine default)
# compaction_watermark_bytes = 0       # TS_COMPACTION_WATERMARK_BYTES  dead-bytes watermark that triggers compaction
# page_index_cache_bytes = 0           # TS_PAGE_INDEX_CACHE_BYTES  page-index cache budget (bytes)
# block_index_cache_bytes = 0          # TS_BLOCK_INDEX_CACHE_BYTES block-index cache budget (bytes)
cold_scan_no_cache_fill = 0            # TS_COLD_SCAN_NO_CACHE_FILL  1 = cold scans bypass cache fill (avoid cache pollution)
# The engine enables this itself (default_page_record_compression_enabled -> true), the deploy
# profile exports it as 1, and a running box has it on. This file said 0, which made the
# shipped config the only surface claiming the product ships without page compression.
page_store_compression_enabled = 1     # TS_PAGE_STORE_COMPRESSION_ENABLED  1 = compress data pages at rest
page_store_compression_level = 3       # TS_PAGE_STORE_COMPRESSION_LEVEL    compression level (algorithm-dependent)
# 4096 is the value the engine measured and rejected: over 120 adds it wrote 176.8 KB per add
# at 4096 against 148.1 KB at 256, and the adds were no slower (152.5 -> 144.7 ms). The bytes
# a 4 KB floor excluded are the index writes -- postings, placement rows, locator entries --
# which are both the smallest and the most repetitive in the system. Compressing everything is
# worse again: at a 1-byte floor the saving stops and the median add rises to 256.0 ms.
page_store_compression_min_bytes = 256  # TS_PAGE_STORE_COMPRESSION_MIN_BYTES  skip compressing pages smaller than this
cross_shard_reclaim_guard = 1          # TS_CROSS_SHARD_RECLAIM_GUARD  1 = retain slabs referenced by ANY loaded shard during GC (safe default; 0 = legacy per-shard, unsafe under multi-shard hosting)
index_dump_oplog_gap_bytes = 1048576   # TS_INDEX_DUMP_WAL_GAP_BYTES  undumped index-log gap (bytes, 1 MiB) that triggers a background catalog/index dump under the manifest-parity catalog fold (TS_INDEX_CATALOG_FOLD); 0 disables the threshold cadence. TS_INDEX_DUMP_OPLOG_GAP_BYTES is the previous variable name, still honoured by the engine when this one is unset
# index_catalog_fold = 1               # TS_INDEX_CATALOG_FOLD  1 = fold the band/zone catalog into the index-log MetaItem (reference conformance) and drive it via the threshold dump above, instead of the per-write band-manifest file. Ships OFF (byte-identical); uncomment to enable.


# -----------------------------------------------------------------------------
# [wal] - write-ahead-log durability barriers (write-path fsync policy)
# CONSOLIDATED: the write path runs a SINGLE synchronous durability barrier (WAL-only
# fdatasync per write) with base-only recovery, plus group-commit -- both ON by default.
# Every acked write is still fully durable before its ack returns; the data-page, served-index
# delta, and band-manifest fsyncs are deferred and reconstructed by base-only WAL replay on
# recovery. Set wal_legacy_recovery = 1 (the emergency escape hatch) to fall back to the legacy
# multi-barrier write path + delta-fold recovery without a rebuild.
# -----------------------------------------------------------------------------
[wal]
commit_delay_us = 0                     # TS_WAL_COMMIT_DELAY_US  group-commit batch-widening delay in microseconds. 0 = pure timer-less (batch = whatever accrues during one barrier's in-flight duration); >0 deliberately widens batches under extreme load.
wal_legacy_recovery = 0                # TS_WAL_LEGACY_RECOVERY  1 = emergency fallback to the legacy multi-barrier write path + delta-fold recovery.
wal_compress_records = 1               # TS_WAL_COMPRESS_RECORDS  compress each record before writing it; 0 writes them uncompressed. Which encoding a record is in is recorded in the record, so this is safe to change either way on an existing log.
# raft_wal_dir = ""                    # TS_RAFT_WAL_DIR        raft WAL directory (raft/replicated modes)


# -----------------------------------------------------------------------------
# [replication] - cluster topology: metaserver, proxy, raft, rebalance/failover
# -----------------------------------------------------------------------------
[replication]
meta_addr = "127.0.0.1:17001"          # TS_META_ADDR           metaserver address datanodes/proxy dial
# meta_bind_addr = "127.0.0.1:17001"   # TS_META_BIND_ADDR      metaserver listen address (default = meta_addr)
proxy_bind_addr = "127.0.0.1:17000"    # TS_PROXY_BIND_ADDR     proxy listen host:port
# proxy_advertised_addr = ""           # TS_PROXY_ADVERTISED_ADDR  proxy advertised address (default = bind)
# redis_bind_addr = "127.0.0.1:16379"  # TS_REDIS_BIND_ADDR     redis-protocol proxy listen address
# proxy_connect_timeout_ms = 0         # TS_PROXY_CONNECT_TIMEOUT_MS  proxy->backend connect timeout (ms)
# proxy_io_timeout_ms = 0              # TS_PROXY_IO_TIMEOUT_MS       proxy->backend io timeout (ms)
# proxy_max_retries = 0                # TS_PROXY_MAX_RETRIES         proxy backend retry count
meta_raft = 0                          # TS_META_RAFT           1 = metaserver runs a raft group (HA metadata)
# meta_raft_nodes = ""                 # TS_META_RAFT_NODES     comma-separated raft peer list for the metaserver
raft_auto_failover = 0                 # TS_RAFT_AUTO_FAILOVER  1 = metaserver drives data-shard raft failover (OFF so single-node behavior is unchanged)
meta_auto_rebalance = 0                # TS_META_AUTO_REBALANCE 1 = enable the auto-rebalance planner/loop
# data_raft_read_mode = ""             # TS_DATA_RAFT_READ_MODE leader | bounded-stale | ... (data-shard raft read consistency)


# -----------------------------------------------------------------------------
# [recovery] - reload / replay / bulk-ingest behavior
# -----------------------------------------------------------------------------
[recovery]
bulk_ingest = 0                        # MATRIXARK_BULK_INGEST  1 = bulk-ingest fast path (fsync deferral + linear promote); reload optimizations
# OVERRIDES the engine, which defaults this ON. Warming every record on load pays the whole
# cache cost before the first read is served; three binaries and the one-box turn it off too.
eager_cache_warm_on_load = 0           # MATRIXARK_EAGER_CACHE_WARM_ON_LOAD  1 = warm the record cache eagerly on shard load
# bulk_ingest_replay_from_sequence = 0 # MATRIXARK_BULK_INGEST_REPLAY_FROM_SEQUENCE  anchor sequence for bulk replay


# -----------------------------------------------------------------------------
# [retrieval] - context-pack budgets, candidate caps, cross-session lanes.
# THE key operator surface. Pack is a CEILING, not a target: raising caps lets
# a deep/broad query return MORE relevant refs, but a narrow query still returns
# a tight pack (only refs at or above min_score are ever included).
# -----------------------------------------------------------------------------
[retrieval]
default_max_context_tokens = 500000         # MATRIXARK_DEFAULT_MAX_CONTEXT_TOKENS  backend context-pack token ceiling
gateway_default_max_context_tokens = 500000 # MATRIXARK_GATEWAY_DEFAULT_MAX_CONTEXT_TOKENS  ceiling the /v1 gateway uses when the caller omits max_context_tokens (was hardcoded 10000; now == backend default). CEILING not target.
context_source_mode = "auto"                # MATRIXARK_CONTEXT_SOURCE_MODE  auto | local | remote-only | augment
retrieval_min_score = 0.05                  # MATRIXARK_RETRIEVAL_MIN_SCORE  drop refs scoring below this (keeps junk out even as caps rise)
top_k_per_layer = 24                        # MATRIXARK_TOP_K_PER_LAYER  groups kept per layer (raised 8 -> 24 for richer default packs)
max_candidates_per_node = 1024              # MATRIXARK_MAX_CANDIDATES_PER_NODE  candidate scan cap per node
max_global_candidates = 2048                # MATRIXARK_MAX_GLOBAL_CANDIDATES  global candidate scan cap
max_selected_refs = 1000                    # MATRIXARK_MAX_SELECTED_REFS  hard cap on refs in a pack
budget_fill_policy = "quality_first"        # MATRIXARK_BUDGET_FILL_POLICY  quality_first keeps the pack signal-not-noise
near_duplicate_overlap_threshold = 0.85     # MATRIXARK_NEAR_DUPLICATE_OVERLAP_THRESHOLD  drop a candidate whose token-set Jaccard similarity with a higher-ranked already-selected ref is >= this (de-noise now that defaults return more). 1.0 = only token-identical collapses; 0 = disabled.
max_children_scored_per_parent = 100000     # MATRIXARK_MAX_CHILDREN_SCORED_PER_PARENT  fan-out scoring cap
# --- cross-session lane (breadth across other sessions) ---
cross_session_budget_ratio = 0.12           # MATRIXARK_CROSS_SESSION_BUDGET_RATIO  fraction of the pack budget for cross-session refs
cross_session_max_candidates = 200          # MATRIXARK_CROSS_SESSION_MAX_CANDIDATES  cross-session candidate cap (raised 24 -> 200; was the main breadth limiter)
cross_session_max_sessions = 3              # MATRIXARK_CROSS_SESSION_MAX_SESSIONS  max other sessions consulted
cross_session_min_score = 0.20              # MATRIXARK_CROSS_SESSION_MIN_SCORE  min score for a cross-session ref
cross_session_max_budget_tokens = 500000    # MATRIXARK_CROSS_SESSION_MAX_BUDGET_TOKENS  absolute cap on cross-session tokens
cross_session_max_budget_ratio = 0.20       # MATRIXARK_CROSS_SESSION_MAX_BUDGET_RATIO  max fraction for cross-session
cross_session_parallelism = 4               # MATRIXARK_CROSS_SESSION_PARALLELISM  concurrent cross-session lookups
# --- profile lane (long-lived user profile) ---
cross_session_profile_max_candidates = 200  # MATRIXARK_CROSS_SESSION_PROFILE_MAX_CANDIDATES  profile candidate cap (raised 48 -> 200 for consistency)
cross_session_profile_max_sessions = 6      # MATRIXARK_CROSS_SESSION_PROFILE_MAX_SESSIONS  max sessions for profile lane
cross_session_profile_budget_ratio = 0.30   # MATRIXARK_CROSS_SESSION_PROFILE_BUDGET_RATIO  profile lane budget fraction
# --- shared resource / skill lanes ---
shared_resource_budget_ratio = 0.25         # MATRIXARK_SHARED_RESOURCE_BUDGET_RATIO  shared-resource lane budget fraction
shared_skill_budget_ratio = 0.10            # MATRIXARK_SHARED_SKILL_BUDGET_RATIO  shared-skill lane budget fraction
shared_context_min_score = 0.20             # MATRIXARK_SHARED_CONTEXT_MIN_SCORE  min score for shared-context refs
# --- optional retrieval features (ship OFF) ---
mode_dependent_quota = 0                     # MATRIXARK_MODE_DEPENDENT_QUOTA  1 = per-mode budget quota
query_rewrite = 0                            # MATRIXARK_QUERY_REWRITE  1 = enable query rewriting
pack_precision_expand = 0                    # MATRIXARK_PACK_PRECISION_EXPAND  1 = precision expansion of raw events
skill_discovery = 0                          # MATRIXARK_SKILL_DISCOVERY  1 = enable skill-discovery layer


# -----------------------------------------------------------------------------
# [extraction] - summarization, time-compression, embeddings drainer
# -----------------------------------------------------------------------------
[extraction]
summary_refresh_interval_ms = 1000     # MATRIXARK_SUMMARY_REFRESH_INTERVAL_MS  ms between summary refresh passes
summary_refresh_limit = 64             # MATRIXARK_SUMMARY_REFRESH_LIMIT  max nodes refreshed per pass
time_compression_window_events = 64    # MATRIXARK_TIME_COMPRESSION_WINDOW_EVENTS  events per compression window
time_compression_min_events = 8        # MATRIXARK_TIME_COMPRESSION_MIN_EVENTS  min events before compressing
time_compression_max_raw_events_per_node = 1024  # MATRIXARK_TIME_COMPRESSION_MAX_RAW_EVENTS_PER_NODE  raw-event retention cap per node
entity_merge_operator = "EUA_MERGE"    # MATRIXARK_ENTITY_MERGE_OPERATOR  entity merge strategy
enable_llm_merge_operator = 0          # MATRIXARK_ENABLE_LLM_MERGE_OPERATOR  1 = use the LLM merge operator
embed_drainer = 0                      # MATRIXARK_EMBED_DRAINER  1 = run the background embedding drainer
# embed_drainer_batch = 32             # MATRIXARK_EMBED_DRAINER_BATCH  drainer batch size (unset = engine default)
# embed_drainer_interval_ms = 0        # MATRIXARK_EMBED_DRAINER_INTERVAL_MS  ms between drainer passes
# embed_base_url = ""                  # MATRIXARK_EMBED_BASE_URL  embedding provider base URL (unset = embeddings disabled)
# embedding_model = ""                 # MATRIXARK_EMBEDDING_MODEL  embedding model id
require_model_embeddings = 0           # MATRIXARK_REQUIRE_MODEL_EMBEDDINGS  1 = fail if no embedding provider
require_model_summaries = 0            # MATRIXARK_REQUIRE_MODEL_SUMMARIES  1 = fail if no summary provider


# -----------------------------------------------------------------------------
# [auth] - gateway authentication / API keys / CORS
# -----------------------------------------------------------------------------
[auth]
# require_auth = "1"                   # MATRIXARK_REQUIRE_AUTH  1 = require an API key on /v1 (unset = mode-dependent)
# api_keys_file = ""                   # MATRIXARK_API_KEYS_FILE  path to plaintext api-keys file
# api_keys_hashed_file = ""            # MATRIXARK_API_KEYS_HASHED_FILE  path to hashed api-keys credential store
gateway_forward_api_key = 1            # MATRIXARK_GATEWAY_FORWARD_API_KEY  1 = forward the caller api key to the backend
http_allowed_origin = "https://app.matrixark.ai"  # MATRIXARK_HTTP_ALLOWED_ORIGIN  CORS allow-origin in cloud mode


# -----------------------------------------------------------------------------
# [gateway] - /v1 HTTP gateway process: bind, threads, backend wiring, timeouts
# -----------------------------------------------------------------------------
[gateway]
http_host = "0.0.0.0"                  # MATRIXARK_HTTP_HOST  gateway bind host
http_port = 8080                       # MATRIXARK_HTTP_PORT  gateway bind port
http_mode = ""                         # MATRIXARK_HTTP_MODE  ""|cloud|prod (cloud tightens CORS + behavior)
# gateway_threads = 0                  # MATRIXARK_GATEWAY_THREADS  gateway worker pool (unset = auto-size)
# gateway_backend_timeout_ms = 0       # MATRIXARK_GATEWAY_BACKEND_TIMEOUT_MS  gateway->backend call timeout (ms)
# blob_timeout_s = 0                   # MATRIXARK_BLOB_TIMEOUT_S  blob stream timeout (s)
# datanode_url = ""                    # MATRIXARK_DATANODE_URL  datanode base URL the gateway calls
# datanode_blob_url = ""               # MATRIXARK_DATANODE_BLOB_URL  datanode blob URL (default = datanode_url)
# gateway_direct_backend = ""          # MATRIXARK_GATEWAY_DIRECT_BACKEND  1 = call the datanode directly (bypass in-proc backend)
# gateway_direct_url = ""              # MATRIXARK_GATEWAY_DIRECT_URL  direct-backend base URL
# gateway_direct_pool = 0              # MATRIXARK_GATEWAY_DIRECT_POOL  direct-backend connection pool size
metaserver = "127.0.0.1:18000"         # MATRIXARK_TEMPORALSTORE_METASERVER  native metaserver the gateway binds to
namespace = "deploy_ns"                # MATRIXARK_NAMESPACE  logical namespace
table = "deploy_table"                 # MATRIXARK_TABLE      logical table


# -----------------------------------------------------------------------------
# [limits] - rate limits, request quotas, hot-cache / async sizing
# Rate-limit + quota knobs are unset by default (no limit); uncomment to enforce.
# -----------------------------------------------------------------------------
[limits]
# rl_ingest_rps = 0.0                  # MATRIXARK_RL_INGEST_RPS      ingest token-bucket refill (rps)
# rl_ingest_burst = 0.0                # MATRIXARK_RL_INGEST_BURST    ingest burst capacity
# rl_retrieve_rps = 0.0                # MATRIXARK_RL_RETRIEVE_RPS    retrieve token-bucket refill (rps)
# rl_retrieve_burst = 0.0              # MATRIXARK_RL_RETRIEVE_BURST  retrieve burst capacity
# rl_blob_streams = 0                  # MATRIXARK_RL_BLOB_STREAMS    concurrent blob stream cap
# quota_max_body_bytes = 0             # MATRIXARK_QUOTA_MAX_BODY_BYTES  max request body (bytes)
# quota_max_batch = 0                  # MATRIXARK_QUOTA_MAX_BATCH       max batch size per request
# quota_max_blob_bytes = 0             # MATRIXARK_QUOTA_MAX_BLOB_BYTES  max blob size (bytes)
direct_record_bundle_max_bytes = 65536         # MATRIXARK_DIRECT_RECORD_BUNDLE_MAX_BYTES  direct-record bundle cap (bytes)
direct_record_hot_cache_max_records = 20000    # MATRIXARK_DIRECT_RECORD_HOT_CACHE_MAX_RECORDS  hot-cache record cap
backend_readiness_timeout_ms = 30000           # MATRIXARK_BACKEND_READINESS_TIMEOUT_MS  wait-for-backend timeout (ms)
backend_readiness_backoff_ms = 200             # MATRIXARK_BACKEND_READINESS_BACKOFF_MS   readiness poll backoff (ms)
resource_async_default_bytes = 2097152         # MATRIXARK_RESOURCE_ASYNC_DEFAULT_BYTES   async-resource inline threshold (bytes, 2 MiB)
