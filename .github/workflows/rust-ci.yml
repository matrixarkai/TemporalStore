            engine::tests::a_string_set_does_not_copy_the_value_it_replaces::the_value_a_write_leaves_is_the_value_a_read_returns \
            engine::tests::a_feature_range_read_decodes_each_point_where_it_sits::the_cursor_answers_what_the_decoder_answers \
            engine::tests::a_feature_range_read_decodes_each_point_where_it_sits::a_range_read_answers_what_was_appended \
            engine::tests::a_hash_get_all_shares_its_block_keys::a_whole_hash_read_answers_what_the_per_field_reads_answer \
            engine::tests::a_whole_container_read_shares_its_work::a_list_range_answers_the_pushes_it_was_given \
            engine::tests::a_whole_container_read_shares_its_work::a_list_element_name_spells_what_the_formatted_name_spells \
            engine::tests::a_container_point_read_searches_without_building_its_key::the_borrowed_key_is_the_key_each_spelling_has_always_built \
            engine::tests::a_container_point_read_searches_without_building_its_key::a_point_selection_answers_what_it_always_answered \
            engine::tests::a_container_point_read_searches_without_building_its_key::a_whole_hash_read_answers_the_fields_a_hash_holds_in_order \
            engine::tests::the_tally_names_the_walks_slabs_in_every_model::the_tally_names_the_slabs_the_walk_does_in_every_model \
            engine::tests::the_tally_names_the_walks_slabs_in_every_model::a_tally_that_forgot_a_live_slab_is_seen \
            engine::tests::the_tally_names_the_walks_slabs_in_every_model::a_tally_that_kept_a_dead_slab_is_seen \
            wal::tests::the_commit_window_is_honoured_by_an_uncovered_barrier \
            wal::group_write_tests::group_write_one_barrier_writes_every_buffered_record_in_one_call \
            wal::group_write_tests::group_write_a_record_that_was_never_acknowledged_is_not_on_disk \
            wal::group_write_tests::group_write_torn_batch_loses_no_acked_record_and_promotes_no_unacked_one \
            wal::group_write_tests::group_write_a_failed_batch_is_retried_whole_and_never_duplicated \
            wal::group_write_tests::group_write_a_failed_batch_does_not_let_a_later_writer_be_told_it_is_durable \
            wal::group_write_tests::group_write_readers_see_records_that_are_still_buffered \
            wal::group_write_tests::group_write_concurrent_writers_share_writes_and_every_acked_record_is_durable ; do
            echo "--- $t ---"
            cargo test --release -p temporalstore-rust --lib "$t" \
              -- --exact --test-threads=1 2>&1 | tee /tmp/ratio_gate.log
            # cargo test exits 0 when a filter matches NOTHING, so assert the COUNT as well as the
            # result line: a rename would otherwise leave this step green having run nothing.
            ran=$(sed -n 's/^running \([0-9]*\) tests\?$/\1/p' /tmp/ratio_gate.log | head -1)
            if [ "$ran" != "1" ]; then
              echo "::error::$t: expected exactly 1 test, the run reported '${ran:-none}' -- renamed, moved, or dropped from the filter"
              exit 1
            fi
            grep -q 'test result: ok\. 1 passed; 0 failed' /tmp/ratio_gate.log \
              || { echo "::error::$t did not pass"; exit 1; }
          done

          # AND THE IGNORED GUARDS, which need --ignored and CANNOT share the loop above:
          # with --ignored, cargo runs ONLY ignored tests, so the three names above would each
          # report 0 and the count assertion would fail. Same assertion, applied separately.
          #
          # every_published_ratio_is_rederivable_from_published_counters is the guard that every
          # published amplification ratio can be re-derived from the counters published beside it.
          # It was running in CI NEVER: it is #[ignore]d, and this workflow runs no unfiltered
          # suite, so an ignored guard runs only if its name is pinned AND --ignored is passed.
          #
          # the_priced_holder_walk_cannot_see_the_slot_row_that_owns_the_key counts the holders of
          # one key allocation on a walk that reaches the slot row in `bucket_index.objects`, and
          # reports TWO where the arm above it reported one. That count is the premise under two
          # levers on the 32.0 B/key key-character row, and it decides them in opposite directions:
          # at one holder the refcount header is waste, at two it is exactly paid for. It runs both
          # walks on one corpus so the correction cannot be read as a different fixture.
          #
          # a_key_with_a_deadline_is_held_by_two_ordered_maps is the same census on keys that carry a
          # deadline, where the published corpus has none: one allocation, four holders, two of them
          # key-ordered maps a span cannot replace. It asserts the ordered maps are populated first.
          for t in \
            engine::tests::every_published_ratio_is_rederivable::every_published_ratio_is_rederivable_from_published_counters \
            engine::tests::index_bytes_per_key::every_resident_key_allocation_has_exactly_the_holders_the_header_is_priced_for \
            engine::tests::index_bytes_per_key::how_many_holders_a_key_allocation_has_by_kind \
            engine::tests::the_holders_of_a_key_allocation::the_priced_holder_walk_cannot_see_the_slot_row_that_owns_the_key \
            engine::tests::the_holders_of_a_key_allocation::a_key_with_a_deadline_is_held_by_two_ordered_maps ; do
            echo "--- $t (ignored) ---"
            cargo test --release -p temporalstore-rust --lib "$t" \
              -- --exact --ignored --test-threads=1 2>&1 | tee /tmp/ratio_gate.log
            ran=$(sed -n 's/^running \([0-9]*\) tests\?$/\1/p' /tmp/ratio_gate.log | head -1)
            if [ "$ran" != "1" ]; then
              echo "::error::$t: expected exactly 1 test, the run reported '${ran:-none}' -- renamed, moved, or no longer #[ignore]d"
              exit 1
            fi
            grep -q 'test result: ok\. 1 passed; 0 failed' /tmp/ratio_gate.log \
              || { echo "::error::$t did not pass"; exit 1; }
          done

          # AND THE ALLOCATION GUARDS, which need --features alloc-probe ON TOP of --ignored.
          # Without the feature the counting allocator is not installed, every counter reads zero,
          # and an allocation assertion passes on a zero that means nothing -- so these cannot
          # share either loop above. One name at a time under the feature, deliberately:
          # installing the counting allocator process-wide turns a number of other tests red, and
          # a filtered run never reaches them.
          #
          # a_block_lookup_allocates_only_its_answer pins that picking one element out of a framed hash
          # or list block builds no key to search with: an absent element costs no allocation and a
          # present one costs its value copy alone (a set, whose member must be decoded, is the
          # control and still allocates). a_whole_hash_read_spends_no_allocation_on_a_name_it_does_not_return
          # pins the slope of a warm whole-hash read at the three allocations a field's answer needs
          # plus a margin; it was 5.02 per field.
          # an_element_write_into_a_live_object_does_not_copy_its_key pins that an install into an
          # object that ALREADY EXISTS reaches it through a borrow. `Arc::from(&str)` always mallocs
          # and copies and `entry()` takes its key by value, so the pre-fix path allocated, copied
          # and dropped the key on every element write: 413 allocations for 400 installs, and
          # 264.9 B per write at a 208-byte key against 64.9 B at an 8-byte one. The guard varies
          # KEY LENGTH, because only a key copy can make per-write bytes depend on it.
          #
          # a_hash_field_write_does_not_pay_for_the_fields_it_already_has pins that a single-command
          # hash write files the field it wrote and not the fields the hash already held. The
          # whole-object sync it used to run cost 118 allocations at 10 fields and about 2,300 at
          # 400 (571 at 100, 5,080 at 1,000), because its filter against re-filing asks a lookup
          # that resolves no named element. The guard varies the FIELD COUNT and carries a control:
          # a read of the whole hash must grow with it, or the probe cannot see that dimension.
          #
          # a_container_add_does_not_pay_for_the_elements_it_already_has pins that a set add, a zset add
          # and a list push allocate the same number of times into a container of 16 elements and one
          # of 1,024 (about 68, 61 and 58), with a ceiling per operation. It carries a control: a
          # read of the whole set must grow with its members, or the probe cannot see that dimension.
          #
          # a_write_does_not_pay_for_the_objects_it_did_not_touch pins that the walk which builds a
          # write's index-log rows names the blocks of the objects the write touched and not the
          # blocks of the whole shard. The whole-shard inversion costs 19 KB at 20 objects and 1.2 MB
          # at 1,000; the walk is flat. The guard varies the OBJECT COUNT and carries a control: the
          # whole-shard inversion must grow with it, or the probe cannot see that dimension.
          # a_cell_set_key_costs_one_allocation_whatever_its_size and
          # a_cell_costs_the_same_allocations_at_any_member_size pin that a merged-cell key is
          # built in one allocation and that a cell costs the same allocations at a 16-byte and a
          # 256-byte member. Each carries a control: the byte count must grow with the size, or
          # the probe cannot see the dimension it claims is flat.
          # a_rollup_allocates_the_same_over_few_samples_and_many_and_few_members_and_many pins that
          # a rollup of old cell snapshots allocates the same number of times over 4 and over 64
          # snapshots in a bucket and over 50 and over 4,000 members, because the cells are moved
          # and the fold buffers are sized once. It carries a control: the table of cloned cells an
          # obvious implementation builds must grow with both, or the probe cannot see them.
          # a_ranked_read_through_the_engine_does_not_allocate_per_cell and
          # a_fan_in_read_through_the_engine_does_not_allocate_per_cell pin that a read of stored
          # snapshots allocates the same number of times at 50 and at 800 cells a snapshot, because a
          # snapshot is decoded into a few vectors and not two per cell. Each carries a control: the
          # bytes allocated must grow with the cell count, or the probe cannot see it.
          # a_merge_write_reads_a_stored_sample_in_place_whatever_its_block_holds pins that a merge write
          # reads the sample it merges into where it sits in the cached block and keeps one copy: the
          # same 24 samples stored as one block and as 24 blocks cost the same allocations a write and
          # leave the same series to the byte. Its control is a plain read of the series, which must
          # allocate once a sample so that the probe can see the sample count. No absolute ceiling.
          # a_merge_request_that_carries_the_stored_header_bytes_is_not_decoded_again pins that a
          # merge-reduce write whose header bytes are the stored header's is not decoded and compared
          # again: it costs fewer allocations than a request that spells the same header differently
          # and takes the full path, and both leave the same stored snapshot to the byte. There is no
          # absolute ceiling; the guard is the difference, which only the shortcut makes positive.
          # a_rollup_through_the_engine_does_not_allocate_per_cell pins that a rollup of stored snapshots
          # allocates the same number of times at 50 and at 400 cells a snapshot, because each snapshot
          # is decoded, folded and written back in a few vectors and not two per cell. Its control is
          # the bytes allocated, which must grow with the cell count.
          # a_fan_in_allocates_the_same_over_a_hundred_members_and_over_two_thousand pins that a ranked
          # read over several keys allocates the same number of times over 100 and over 2,000 members
          # (three keys of eight snapshots), because only the snapshot count sizes anything. It carries
          # a control: the table of members an obvious implementation builds must grow with them.
          # a_tiered_rollup_allocates_the_same_over_few_samples_and_many_and_few_members_and_many pins
          # the same for a request with tiers and a cap that protects its newest members: the buffers that
          # follow each cell's newest stamp are sized once per bucket, so allocations still do not move
          # with the snapshots in a bucket or the members. Its control is the same cloning table.
          for t in \
            engine::recorded_map::element_write_key_allocation::an_element_write_into_a_live_object_does_not_copy_its_key \
            engine::tests::a_container_add_does_not_pay_for_the_elements_it_already_has::probe::a_container_add_does_not_pay_for_the_elements_it_already_has \
            engine::tests::a_hash_write_files_only_what_it_wrote::probe::a_hash_field_write_does_not_pay_for_the_fields_it_already_has \
            engine::tests::a_write_names_only_the_blocks_of_the_objects_it_touched::probe::a_write_does_not_pay_for_the_objects_it_did_not_touch \
            engine::tests::a_feature_sum_reads_each_point_in_place::probe::a_feature_sum_does_not_allocate_per_point \
            engine::tests::a_sequence_query_decodes_each_row_where_it_sits::probe::a_sequence_query_does_not_allocate_per_row \
            engine::tests::a_restating_write_names_one_bucket_not_the_shard::probe::a_restating_write_does_not_allocate_with_the_shard \
            engine::tests::a_rewritten_context_node_replaces_its_block::probe::a_node_rewrite_costs_the_same_after_many_rewrites \
            engine::tests::a_write_asks_the_cache_before_it_invalidates::probe::an_uncached_write_does_not_enter_the_invalidation_class \
            engine::tests::a_string_length_and_range_do_not_copy_the_value::probe::a_length_and_a_range_do_not_allocate_per_byte \
            engine::tests::an_outcome_kind_holds_a_known_kind_without_allocating::probe::a_known_outcome_kind_allocates_nothing \
            engine::tests::a_hash_field_presence_is_read_from_its_row::probe::a_presence_check_does_not_copy_the_value \
            engine::tests::a_timestamped_point_names_itself_once::probe::a_staged_point_does_not_copy_its_name \
            engine::tests::a_distinct_count_compares_its_members_where_they_are::probe::a_distinct_count_does_not_copy_its_members \
            engine::tests::a_counter_window_read_reduces_where_it_sits::probe::a_window_read_does_not_allocate_per_bucket \
            engine::tests::a_series_at_its_cap_trims_without_a_victim_list::probe::a_write_at_the_cap_allocates_what_a_write_below_it_allocates \
            engine::tests::a_feature_series_at_its_cap_files_only_what_changed::probe::an_append_at_the_cap_allocates_the_same_whatever_the_series_length \
            engine::tests::a_string_set_does_not_copy_the_value_it_replaces::probe::a_string_overwrite_does_not_copy_the_old_value \
            engine::tests::a_feature_range_read_decodes_each_point_where_it_sits::probe::a_feature_range_read_does_not_allocate_per_point_of_the_block \
            engine::tests::a_hash_get_all_shares_its_block_keys::probe::a_whole_hash_read_does_not_pay_three_allocations_a_field_for_its_key \
            engine::tests::a_whole_container_read_shares_its_work::probe::a_list_range_does_not_pay_for_its_key_name_and_frame_copy_per_element \
            engine::tests::a_whole_container_read_shares_its_work::probe::a_whole_hash_read_does_not_copy_the_frame_for_each_field \
            engine::tests::a_container_point_read_searches_without_building_its_key::probe::a_block_lookup_allocates_only_its_answer \
            engine::tests::a_container_point_read_searches_without_building_its_key::probe::a_whole_hash_read_spends_no_allocation_on_a_name_it_does_not_return \
            engine::tests::a_set_door_asks_one_member_not_the_set::probe::the_door_allocates_the_same_over_twenty_members_and_over_two_thousand \
            engine::tests::a_set_pop_and_random_member_read_the_first_members::probe::a_prefix_read_allocates_the_same_over_twenty_members_and_over_two_thousand \
            engine::tests::the_window_reduce_allocations_are_counted_per_operation::a_ranked_read_through_the_engine_does_not_allocate_per_cell \
            engine::tests::the_window_reduce_allocations_are_counted_per_operation::a_fan_in_read_through_the_engine_does_not_allocate_per_cell \
            engine::tests::the_window_reduce_allocations_are_counted_per_operation::a_rollup_through_the_engine_does_not_allocate_per_cell \
            engine::tests::the_window_reduce_allocations_are_counted_per_operation::a_merge_request_that_carries_the_stored_header_bytes_is_not_decoded_again \
            engine::tests::the_window_reduce_allocations_are_counted_per_operation::a_merge_write_reads_a_stored_sample_in_place_whatever_its_block_holds \
            engine::window_aggregate::probe::the_reducers_do_not_allocate_per_point \
            engine::cell_set::tests::probe::a_cell_set_key_costs_one_allocation_whatever_its_size \
            engine::tests::a_feature_append_merges_cells_by_lane_reducer::probe::a_merge_does_not_allocate_more_for_a_longer_key \
            engine::tests::a_feature_append_merges_cells_by_lane_reducer::probe::a_merge_write_does_not_allocate_per_cell \
            engine::cell_set::tests::probe::a_merge_request_costs_the_same_allocations_at_any_cell_count \
            engine::window_reduce_fan_in::tests::probe::a_fan_in_allocates_the_same_over_a_hundred_members_and_over_two_thousand \
            engine::window_reduce_rank::tests::probe::a_ranked_read_allocates_the_same_over_a_hundred_members_and_over_twenty_thousand \
            engine::window_reduce_rank::tests::options::probe::a_member_set_read_allocates_the_same_over_a_thousand_members_and_over_twenty_thousand \
            engine::window_reduce_rank::tests::decay::probe::a_decay_read_allocates_the_same_over_a_thousand_members_and_over_twenty_thousand \
            engine::window_reduce_rollup::tests::probe::a_rollup_allocates_the_same_over_few_samples_and_many_and_few_members_and_many \
            engine::cell_retry_ring::tests::probe::a_retry_ring_allocates_once_when_started_and_never_again \
            engine::window_reduce_rollup::tier_tests::probe::a_tiered_rollup_allocates_the_same_over_few_samples_and_many_and_few_members_and_many \
            engine::cell_set::tests::probe::a_cell_costs_the_same_allocations_at_any_member_size ; do
            echo "--- $t (ignored, alloc-probe) ---"
            cargo test --release --features alloc-probe -p temporalstore-rust --lib "$t" \
              -- --exact --ignored --test-threads=1 2>&1 | tee /tmp/ratio_gate.log
            ran=$(grep -oE '^running [0-9]+ tests?$' /tmp/ratio_gate.log | head -1 | awk '{print $2}')
            if [ "$ran" != "1" ]; then
              echo "::error::$t: expected exactly 1 test, the run reported '${ran:-none}' -- renamed, moved, or no longer #[ignore]d"
              exit 1
            fi
            grep -q 'test result: ok\. 1 passed; 0 failed' /tmp/ratio_gate.log \
              || { echo "::error::$t did not pass"; exit 1; }
          done

      # Bin unit tests are not covered by --lib/--tests, so a failing test in a
      # service binary can sit on main unnoticed. Run the proxy bin's suite as a
      # hard gate. Deliberately NOT --bins: some bin test harnesses run servers
      # that never exit, which would hang the job.
      - name: cargo test (matrixark_rust_proxy bin, single-threaded, release)
        timeout-minutes: 20
        run: cargo test --release -p temporalstore-rust --bin matrixark_rust_proxy -- --test-threads=1

  # The published client SDK is `exclude`d from the root workspace and has its own
  # lock file, so every `-p temporalstore-rust` command above is structurally blind
  # to it. It sat un-compilable on main for months because of exactly that: nothing
  # here built it. This job does, and it is cheap -- serde and serde_json only, no
  # RocksDB, no bindgen, so it runs on push as well.
  sdk-rust:
    name: cargo build / test / package (client SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust/temporalstore
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update && rustup default 1.89.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-sdk-${{ runner.os }}-${{ hashFiles('sdk/rust/temporalstore/Cargo.lock') }}
          restore-keys: cargo-sdk-${{ runner.os }}-

      # Default features. This is the command a downloader runs, and the one that
      # failed on main with a page of undefined `temporalstore_*` symbols.
      - name: cargo build (default features)
        run: cargo build --locked

      - name: cargo test (default features)
        run: cargo test --locked

      - name: cargo build (no default features)
        run: cargo build --locked --no-default-features

      # The `direct` feature binds a native C ABI this repository does not build.
      # It must fail, and it must fail by SAYING so in build.rs rather than by
      # emitting undefined symbols at link time -- otherwise that message is a
      # value nothing reads. Assert both the failure and the sentence.
      - name: cargo build --features direct fails with an actionable message
        run: |
          set -o pipefail
          if cargo build --locked --no-default-features --features direct > direct.log 2>&1; then
            echo "FAIL: --features direct built, but no native library was supplied"
            exit 1
          fi
          grep -q 'TEMPORALSTORE_LIB_DIR' direct.log || {
            echo "FAIL: --features direct failed without naming TEMPORALSTORE_LIB_DIR"
            sed -n '1,40p' direct.log
            exit 1
          }
          grep -q 'undefined symbol' direct.log && {
            echo "FAIL: --features direct still reaches the linker"
            exit 1
          }
          echo "OK: build.rs refused --features direct with the documented message"
          rm -f direct.log

      # Builds the crate from its own packaged tarball, exactly as someone who
      # downloads it would. This is the same verification `cargo publish
      # --dry-run` performs, without needing a registry token.
      - name: cargo package (verify the published tarball builds)
        run: cargo package --locked
