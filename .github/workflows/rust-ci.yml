            engine::window_aggregate::tests::a_name_is_known_or_refused_and_the_table_is_case_insensitive \
            engine::window_aggregate::tests::edge_answers_are_the_documented_ones \
            engine::window_aggregate::algorithm_tests::each_reducer_answers_the_value_only_that_reducer_produces \
            engine::window_aggregate::algorithm_tests::the_three_roundings_differ_on_a_fraction \
            engine::window_aggregate::algorithm_tests::an_empty_window_answers_what_the_notes_say \
            engine::window_aggregate::algorithm_tests::overflow_saturates_and_a_sum_is_exact_until_it_is_read \
            engine::window_aggregate::algorithm_tests::ratio_wilson_rate_and_weights_edge_cases \
            engine::window_aggregate::algorithm_tests::bad_parameters_and_names_are_refused_naming_the_field \
            engine::window_aggregate::algorithm_tests::mergeability_is_declared_and_matches_what_merge_can_do \
            engine::window_aggregate::algorithm_tests::merging_partial_results_equals_reducing_the_concatenation \
            engine::window_aggregate::algorithm_tests::first_and_last_merge_only_in_stream_order \
            engine::window_aggregate::algorithm_tests::parsed_reducer_names_map_to_the_declared_reducers ; do
            echo "--- $t ---"
            cargo test --release -p temporalstore-rust --lib "$t" \
              -- --exact --test-threads=1 2>&1 | tee /tmp/gate.log
            # `cargo test` exits 0 when a filter matches NOTHING, so the exit code is not the
            # gate. Assert the COUNT as well as the result: a rename would otherwise leave this
            # step green having run nothing at all.
            ran=$(sed -n 's/^running \([0-9]*\) tests\?$/\1/p' /tmp/gate.log | head -1)
            if [ "$ran" != "1" ]; then
              echo "::error::$t: expected exactly 1 test, the run reported '${ran:-none}' -- renamed, moved, or dropped from the filter"
              exit 1
            fi
            grep -q 'test result: ok\. 1 passed; 0 failed' /tmp/gate.log \
              || { echo "::error::$t did not pass"; exit 1; }
          done

      # Three of these four build a corpus and compare measured surfaces, so they run far longer
      # than the read-safety guards above -- 42s to 376s each in a debug run on a loaded box. They
      # are pinned in a step with its own budget so that a slow cost guard cannot starve the fast
      # guards above, and so a timeout here is attributable to this group rather than to them.
      #
      # Each asserts a COUNT as well as a result, for the same reason the step above does: a rename
      # would otherwise leave this step green having run nothing at all. Until now all four ran
      # only in the advisory step, which is `continue-on-error`, so every one of them could have
      # started failing behind a green check.
      - name: cargo test (round, container and key-inversion cost guards, hard gate)
        timeout-minutes: 30
        run: |
          set -o pipefail
          for t in \
            engine::tests::round_scale::a_round_walks_the_live_block_set_a_constant_number_of_times \
            engine::tests::round_scale::an_idle_round_still_walks_the_live_block_set \
            engine::tests::model_map_container_cost::no_nested_model_map_is_a_hashed_table_and_hashes_carries_the_named_container \
            engine::tests::the_key_a_block_is_filed_under_inverts_exactly::what_the_entry_restating_its_key_costs_the_shipped_container \
            engine::tests::a_write_names_only_the_blocks_of_the_objects_it_touched::a_restricted_inversion_names_what_the_whole_shard_one_names_for_its_keys \
            engine::tests::a_plan_learns_a_log_tail_from_its_appenders::the_cached_tail_equals_the_scanned_tail_through_a_history \
            engine::tests::a_plan_learns_a_log_tail_from_its_appenders::a_maintenance_plan_reads_neither_log_tail_back \
            engine::tests::a_removal_states_no_block_rows::a_removal_states_no_block_rows \
            engine::tests::a_removal_states_no_block_rows::a_removed_member_stays_removed_and_the_rest_stay_across_a_cold_reload \
            engine::tests::a_removal_states_no_block_rows::a_named_removal_builds_no_identity_inversion \
            engine::tests::a_hash_delete_files_nothing::a_hash_delete_leaves_the_index_as_the_whole_object_sync_left_it \
            engine::tests::a_hash_delete_files_nothing::a_hash_delete_files_no_block \
            engine::tests::a_sequence_write_states_the_rows_it_wrote::a_sequence_write_states_only_the_rows_it_wrote \
            engine::tests::a_sequence_write_states_the_rows_it_wrote::a_sequence_write_that_evicts_as_many_as_it_adds_pins_the_membership \
            engine::tests::a_compaction_does_not_lose_a_dirty_objects_dump::a_compaction_round_does_not_lose_a_dirty_objects_dump \
            engine::tests::a_compaction_does_not_lose_a_dirty_objects_dump::a_write_that_names_no_key_does_not_lose_a_dirty_objects_dump \
            engine::tests::a_counter_increment_writes_its_series_when_due::a_counter_increment_writes_its_series_only_now_and_then \
            engine::tests::a_counter_increment_writes_its_series_when_due::a_counter_series_recovers_whether_or_not_its_block_was_written \
            engine::tests::a_counter_increment_writes_its_series_when_due::a_counter_series_trimmed_at_its_bound_recovers_as_it_did_before \
            engine::tests::a_manifest_is_fingerprinted_once_not_once_per_plan::a_digest_equals_exactly_when_the_lines_were_equal \
            engine::tests::a_manifest_is_fingerprinted_once_not_once_per_plan::a_retained_manifest_is_decoded_once_across_plans ; do
            echo "--- $t ---"
            cargo test --release -p temporalstore-rust --lib "$t" \
              -- --exact --test-threads=1 2>&1 | tee /tmp/cost-gate.log
            ran=$(sed -n 's/^running \([0-9]*\) tests\?$/\1/p' /tmp/cost-gate.log | head -1)
            if [ "$ran" != "1" ]; then
              echo "::error::$t: expected exactly 1 test, the run reported '${ran:-none}' -- renamed, moved, or dropped from the filter"
              exit 1
            fi
            grep -q 'test result: ok\. 1 passed; 0 failed' /tmp/cost-gate.log \
              || { echo "::error::$t did not pass"; exit 1; }
          done

      - name: Unsupported append never replaces WAL bytes
        run: |
          set -o pipefail
          cargo test --release -p temporalstore-snapshot --lib \
            object_store::tests::a_put_only_store_refuses_append_without_replacing_bytes \
            -- --exact --test-threads=1 2>&1 | tee /tmp/append-safety.log
          grep -q 'test result: ok. 1 passed; 0 failed' /tmp/append-safety.log

      # The snapshot manifest listing decides what a shard APPEARS to hold. A manifest passed
      # over by name produces a short list, which is a successful call, and `garbage_collect`
      # is built on that listing -- so a snapshot it cannot see is one it can never collect.
      # Both arms assert a COUNT, because an empty or short Vec is indistinguishable from a
      # shard with fewer snapshots.
      - name: Snapshot manifests are found by what they are, not their name
        run: |
          set -o pipefail
          for t in \
            snapshot_store::tests::list_snapshots_finds_a_manifest_filed_under_the_binary_suffix \
            snapshot_store::tests::a_manifest_decodes_from_both_shapes_and_the_encoding_does_not_change_it \
            snapshot_store::tests::an_unknown_compression_tag_is_refused_rather_than_defaulted \
            snapshot_store::tests::a_manifest_is_written_binary_and_a_planted_json_one_is_still_read \
            snapshot_store::tests::a_staged_manifest_is_still_excluded_under_either_suffix ; do
            echo "--- $t ---"
            cargo test --release -p temporalstore-snapshot --lib "$t" \
              -- --exact --test-threads=1 2>&1 | tee /tmp/snap-manifest.log
            ran=$(sed -n 's/^running \([0-9]*\) tests\?$/\1/p' /tmp/snap-manifest.log | head -1)
            if [ "$ran" != "1" ]; then
              echo "::error::$t: expected exactly 1 test, the run reported '${ran:-none}' -- renamed, moved, or dropped from the filter"
              exit 1
            fi
            grep -q 'test result: ok\. 1 passed; 0 failed' /tmp/snap-manifest.log \
              || { echo "::error::$t did not pass"; exit 1; }
          done

      # The published write and space ratios are only falsifiable at a consumer if the identities
      # tying each ratio to its published terms actually run. They are NOT covered by the suite
      # step above, which carries continue-on-error AND has been observed timing out at its limit,
      # so that step can report success having finished no tests. And this workflow runs no
      # unfiltered suite -- every invocation is an --exact named filter -- so a guard runs here
      # only if its name is pinned. That is why this step exists.
      #
      # the_span_keyed_table_the_arena_lever_needs_is_not_a_dependency is here for the same
      # reason and is not a ratio identity: it is the TRIPWIRE under the key-character
      # refusal in index_bytes_per_key, which holds that the 32.0 B/key Arc<str> row cannot
      # be cut because an arena span needs a raw-entry table this crate does not depend on.
      # A refusal that nothing re-checks is a comment, and a comment does not fail.
      #
      # what_a_retain_leaves_in_the_block_lists_capacity holds the block list's CAPACITY, which
      # `resident_heap_bytes` charges and `Vec::clone` cannot see. The growth step bounds
      # capacity on the way up; `Vec::retain_mut` left it at its high-water mark on the way
      # down, so the bound had to be asserted on the removal path separately.
      #
      # whether_a_niche_can_take_the_refs_union_to_sixteen is the tripwire under the refusal of
      # the eight-bytes-an-object BlockRefs narrowing. rustc niche-fills only when at most one
      # variant carries data, and that union has two, so no niche takes it to sixteen. The arm
      # asserts the measured table; a rustc that ever changes this goes red and reopens the
      # lever with a measurement rather than having it rediscovered from scratch.
      # THE THREE `part4` NAMES ARE PINNED HERE BECAUSE NOTHING ELSE RAN THEM, AND THEY SAT RED ON
      # main FOR SEVERAL MERGES BEHIND AN ENTIRELY GREEN CHECK. They live in
      # `tests/persistence_recovery_and_accounting.rs`, which is registered as
      # `#[path = "..."] mod part4` -- so a filter spelled after the FILENAME matches nothing and
      # reports `test result: ok` over `running 0 tests`, which is measured: that spelling returns
      # `running 0 tests; test result: ok. 0 passed` on this tree. The module path is the only
      # spelling that works, and the count assertion below is what makes a future rename fail
      # loudly. All three broke on one cause -- refs gained a second home and these read one.
      - name: cargo test (published ratio guards, hard gate)
        timeout-minutes: 20
        run: |
          set -o pipefail
          for t in \
            engine::tests::the_write_window_closes_at_compaction::the_write_window_closes_at_compaction \
            engine::tests::the_user_byte_write_ratio::the_user_byte_write_ratio \
            engine::tests::the_user_byte_write_ratio::no_string_row_is_removed_outside_its_door \
            engine::tests::per_item_byte_budget::the_stored_spelling_of_a_bucket_node_did_not_move \
            engine::tests::per_item_byte_budget::the_stored_spelling_of_the_object_side_moved_in_exactly_the_live_object_list \
            engine::tests::blocks_per_bucket::the_block_entry_reconstructs_and_what_emptying_its_tail_is_worth \
            engine::tests::index_bytes_per_key::the_span_keyed_table_the_arena_lever_needs_is_not_a_dependency \
            engine::tests::the_holders_of_a_key_allocation::an_order_bound_ledger_adopts_the_key_allocation_a_span_cannot_order \
            engine::tests::index_bytes_per_key::what_the_one_word_handle_costs_in_the_allocation \
            engine::tests::index_bytes_per_key::what_keying_the_block_list_by_address_would_cost \
            engine::tests::flat_block_list::what_a_retain_leaves_in_the_block_lists_capacity \
            engine::tests::flat_block_list::what_the_published_arm_cannot_see_in_container_capacity \
            engine::tests::flat_block_list::what_the_slots_owned_element_headroom_costs \
            engine::tests::where_an_objects_refs_could_live::whether_a_niche_can_take_the_refs_union_to_sixteen \
            engine::tests::part4::maintained_element_name_block_ref_total_matches_the_walk \
            engine::tests::part4::object_block_lookup_refs_per_object_census \
            engine::tests::part4::bucket_dump_manifest_rejects_object_lifecycle_mismatch \
            engine::tests::part4::the_stage_clock_reports_microseconds_so_a_sub_millisecond_stage_is_visible \
            engine::tests::part4::the_pressure_snapshot_reads_cache_stats_without_listing_the_cache \
            engine::tests::a_reconstruct_prunes_the_refs_it_invalidates::a_reconstruct_prunes_the_refs_it_invalidates \
            engine::tests::the_consolidated_object_map::installing_a_control_state_block_keeps_the_rows_block_refs \
            engine::container_blocks::member_element_name_tests::a_hex_element_name_still_decodes_to_the_member_it_always_did \
            engine::container_blocks::member_element_name_tests::a_member_whose_text_is_valid_hex_is_not_confused_with_the_bytes_that_hex_spells \
            engine::container_blocks::member_element_name_tests::the_new_spelling_round_trips_a_text_a_tag_leading_and_a_non_utf8_member \
            engine::container_blocks::member_element_name_tests::the_new_spelling_charges_one_byte_a_member_byte_where_hex_charges_two \
            engine::container_blocks::member_element_name_tests::the_two_new_spelling_bytes_are_four_and_five_and_round_trip \
            engine::container_blocks::member_element_name_tests::the_new_variants_render_an_element_name_the_same_pair_parses_back \
            engine::container_blocks::member_element_name_tests::every_kind_maps_to_the_spelling_its_writers_emit \
            engine::container_blocks::member_element_name_tests::a_block_written_before_the_flip_is_found_by_an_element_name_in_either_spelling \
            engine::container_blocks::member_element_name_tests::a_write_after_the_flip_frames_rather_than_falling_back_to_a_bare_value \
            engine::tests::marking_an_object_dirty_reaches_its_blocks::marking_an_object_dirty_reaches_blocks_its_row_holds_the_refs_for \
            engine::tests::where_an_objects_refs_could_live::where_each_kinds_refs_end_up \
            engine::tests::what_the_core_index_puts_on_the_wire::every_field_of_the_core_index_declares_whether_it_reaches_the_wire \
            engine::tests::what_the_core_index_puts_on_the_wire::an_encode_then_decode_keeps_every_wire_field_and_drops_every_omitted_one \
            block_store::slab_manifest_wire::tests::every_descriptor_field_survives_the_wire_round_trip \
            block_store::slab_manifest_wire::tests::a_wire_manifest_loads_with_values_only_those_bytes_can_carry \
            block_store::slab_manifest_wire::tests::a_damaged_wire_manifest_is_an_error_and_never_an_empty_store \
            block_store::slab_manifest_wire::tests::an_unspecified_or_unknown_state_is_refused_by_name \
            block_store::slab_manifest_wire::tests::the_stored_field_numbers_do_not_move \
            engine::tests::component_is_retired::the_lexer_reads_code_and_leaves_comments_strings_and_lifetimes_alone \
            engine::tests::component_is_retired::a_comment_or_string_edit_moves_nothing_and_a_code_edit_moves_exactly_one \
            engine::tests::component_is_retired::a_sentence_moves_only_its_own_row \
            engine::tests::component_is_retired::the_roster_matches_the_tree_in_both_directions \
            engine::tests::component_is_retired::the_files_named_for_the_word_are_the_roster \
            engine::tests::what_an_element_name_writes_to_disk_and_the_wire::the_short_key_writes_the_wal_json \
            engine::tests::what_an_element_name_writes_to_disk_and_the_wire::the_protobuf_framing_of_a_named_record_does_not_move \
            engine::tests::what_an_element_name_writes_to_disk_and_the_wire::the_key_a_block_is_filed_under_spells_the_name_in_its_third_slot \
            engine::tests::what_an_element_name_writes_to_disk_and_the_wire::the_tombstone_row_keeps_its_key \
            engine::tests::what_an_element_name_writes_to_disk_and_the_wire::the_report_row_keeps_its_key \
            shared_store::a_staged_blocks_name_keeps_its_tag::the_frame_of_a_named_block_round_trips_byte_for_byte \
            engine::tests::a_feature_sum_reads_each_point_in_place::with_feature_point_value_answers_what_the_decoder_answers \
            engine::tests::a_feature_sum_reads_each_point_in_place::a_sum_answers_what_the_collected_values_summed_to \
            engine::tests::a_feature_sum_reads_each_point_in_place::page_keys_equal_the_constructors_keys \
            engine::tests::a_hash_get_all_shares_its_page_keys::a_whole_hash_read_answers_what_the_per_field_reads_answer \
            wal::tests::the_commit_window_is_honoured_by_an_uncovered_barrier ; do
            echo "--- $t ---"
            cargo test --release -p temporalstore-rust --lib "$t" \
              -- --exact --test-threads=1 2>&1 | tee /tmp/ratio_gate.log
            # cargo test exits 0 when a filter matches NOTHING, so assert the COUNT as well as the
            # result line: a rename would otherwise leave this step green having run nothing.
            ran=$(sed -n 's/^running \([0-9]*\) tests\?$/\1/p' /tmp/ratio_gate.log | head -1)
            if [ "$ran" != "1" ]; then
              echo "::error::$t: expected exactly 1 test, the run reported '${ran:-none}' -- renamed, moved, or dropped from the filter"
              exit 1
            fi
            grep -q 'test result: ok\. 1 passed; 0 failed' /tmp/ratio_gate.log \
              || { echo "::error::$t did not pass"; exit 1; }
          done

          # AND THE IGNORED GUARDS, which need --ignored and CANNOT share the loop above:
          # with --ignored, cargo runs ONLY ignored tests, so the three names above would each
          # report 0 and the count assertion would fail. Same assertion, applied separately.
          #
          # every_published_ratio_is_rederivable_from_published_counters is the guard that every
          # published amplification ratio can be re-derived from the counters published beside it.
          # It was running in CI NEVER: it is #[ignore]d, and this workflow runs no unfiltered
          # suite, so an ignored guard runs only if its name is pinned AND --ignored is passed.
          #
          # the_priced_holder_walk_cannot_see_the_slot_row_that_owns_the_key counts the holders of
          # one key allocation on a walk that reaches the slot row in `bucket_index.objects`, and
          # reports TWO where the arm above it reported one. That count is the premise under two
          # levers on the 32.0 B/key key-character row, and it decides them in opposite directions:
          # at one holder the refcount header is waste, at two it is exactly paid for. It runs both
          # walks on one corpus so the correction cannot be read as a different fixture.
          #
          # a_key_with_a_deadline_is_held_by_two_ordered_maps is the same census on keys that carry a
          # deadline, where the published corpus has none: one allocation, four holders, two of them
          # key-ordered maps a span cannot replace. It asserts the ordered maps are populated first.
          for t in \
            engine::tests::every_published_ratio_is_rederivable::every_published_ratio_is_rederivable_from_published_counters \
            engine::tests::index_bytes_per_key::every_resident_key_allocation_has_exactly_the_holders_the_header_is_priced_for \
            engine::tests::index_bytes_per_key::how_many_holders_a_key_allocation_has_by_kind \
            engine::tests::the_holders_of_a_key_allocation::the_priced_holder_walk_cannot_see_the_slot_row_that_owns_the_key \
            engine::tests::the_holders_of_a_key_allocation::a_key_with_a_deadline_is_held_by_two_ordered_maps ; do
            echo "--- $t (ignored) ---"
            cargo test --release -p temporalstore-rust --lib "$t" \
              -- --exact --ignored --test-threads=1 2>&1 | tee /tmp/ratio_gate.log
            ran=$(sed -n 's/^running \([0-9]*\) tests\?$/\1/p' /tmp/ratio_gate.log | head -1)
            if [ "$ran" != "1" ]; then
              echo "::error::$t: expected exactly 1 test, the run reported '${ran:-none}' -- renamed, moved, or no longer #[ignore]d"
              exit 1
            fi
            grep -q 'test result: ok\. 1 passed; 0 failed' /tmp/ratio_gate.log \
              || { echo "::error::$t did not pass"; exit 1; }
          done

          # AND THE ALLOCATION GUARDS, which need --features alloc-probe ON TOP of --ignored.
          # Without the feature the counting allocator is not installed, every counter reads zero,
          # and an allocation assertion passes on a zero that means nothing -- so these cannot
          # share either loop above. One name at a time under the feature, deliberately:
          # installing the counting allocator process-wide turns a number of other tests red, and
          # a filtered run never reaches them.
          #
          # an_element_write_into_a_live_object_does_not_copy_its_key pins that an install into an
          # object that ALREADY EXISTS reaches it through a borrow. `Arc::from(&str)` always mallocs
          # and copies and `entry()` takes its key by value, so the pre-fix path allocated, copied
          # and dropped the key on every element write: 413 allocations for 400 installs, and
          # 264.9 B per write at a 208-byte key against 64.9 B at an 8-byte one. The guard varies
          # KEY LENGTH, because only a key copy can make per-write bytes depend on it.
          #
          # a_hash_field_write_does_not_pay_for_the_fields_it_already_has pins that a single-command
          # hash write files the field it wrote and not the fields the hash already held. The
          # whole-object sync it used to run cost 118 allocations at 10 fields and about 2,300 at
          # 400 (571 at 100, 5,080 at 1,000), because its filter against re-filing asks a lookup
          # that resolves no named element. The guard varies the FIELD COUNT and carries a control:
          # a read of the whole hash must grow with it, or the probe cannot see that dimension.
          #
          # a_write_does_not_pay_for_the_objects_it_did_not_touch pins that the walk which builds a
          # write's index-log rows names the blocks of the objects the write touched and not the
          # blocks of the whole shard. The whole-shard inversion costs 19 KB at 20 objects and 1.2 MB
          # at 1,000; the walk is flat. The guard varies the OBJECT COUNT and carries a control: the
          # whole-shard inversion must grow with it, or the probe cannot see that dimension.
          for t in \
            engine::recorded_map::element_write_key_allocation::an_element_write_into_a_live_object_does_not_copy_its_key \
            engine::tests::a_hash_write_files_only_what_it_wrote::probe::a_hash_field_write_does_not_pay_for_the_fields_it_already_has \
            engine::tests::a_write_names_only_the_blocks_of_the_objects_it_touched::probe::a_write_does_not_pay_for_the_objects_it_did_not_touch \
            engine::tests::a_feature_sum_reads_each_point_in_place::probe::a_feature_sum_does_not_allocate_per_point \
            engine::tests::a_hash_get_all_shares_its_page_keys::probe::a_whole_hash_read_does_not_pay_three_allocations_a_field_for_its_key \
            engine::window_aggregate::probe::the_reducers_do_not_allocate_per_point ; do
            echo "--- $t (ignored, alloc-probe) ---"
            cargo test --release --features alloc-probe -p temporalstore-rust --lib "$t" \
              -- --exact --ignored --test-threads=1 2>&1 | tee /tmp/ratio_gate.log
            ran=$(grep -oE '^running [0-9]+ tests?$' /tmp/ratio_gate.log | head -1 | awk '{print $2}')
            if [ "$ran" != "1" ]; then
              echo "::error::$t: expected exactly 1 test, the run reported '${ran:-none}' -- renamed, moved, or no longer #[ignore]d"
              exit 1
            fi
            grep -q 'test result: ok\. 1 passed; 0 failed' /tmp/ratio_gate.log \
              || { echo "::error::$t did not pass"; exit 1; }
          done

      # Bin unit tests are not covered by --lib/--tests, so a failing test in a
      # service binary can sit on main unnoticed. Run the proxy bin's suite as a
      # hard gate. Deliberately NOT --bins: some bin test harnesses run servers
      # that never exit, which would hang the job.
      - name: cargo test (matrixark_rust_proxy bin, single-threaded, release)
        timeout-minutes: 20
        run: cargo test --release -p temporalstore-rust --bin matrixark_rust_proxy -- --test-threads=1

  # The published client SDK is `exclude`d from the root workspace and has its own
  # lock file, so every `-p temporalstore-rust` command above is structurally blind
  # to it. It sat un-compilable on main for months because of exactly that: nothing
  # here built it. This job does, and it is cheap -- serde and serde_json only, no
  # RocksDB, no bindgen, so it runs on push as well.
  sdk-rust:
    name: cargo build / test / package (client SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust/temporalstore
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update && rustup default 1.89.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-sdk-${{ runner.os }}-${{ hashFiles('sdk/rust/temporalstore/Cargo.lock') }}
          restore-keys: cargo-sdk-${{ runner.os }}-

      # Default features. This is the command a downloader runs, and the one that
      # failed on main with a page of undefined `temporalstore_*` symbols.
      - name: cargo build (default features)
        run: cargo build --locked

      - name: cargo test (default features)
        run: cargo test --locked

      - name: cargo build (no default features)
        run: cargo build --locked --no-default-features

      # The `direct` feature binds a native C ABI this repository does not build.
      # It must fail, and it must fail by SAYING so in build.rs rather than by
      # emitting undefined symbols at link time -- otherwise that message is a
      # value nothing reads. Assert both the failure and the sentence.
      - name: cargo build --features direct fails with an actionable message
        run: |
          set -o pipefail
          if cargo build --locked --no-default-features --features direct > direct.log 2>&1; then
            echo "FAIL: --features direct built, but no native library was supplied"
            exit 1
          fi
          grep -q 'TEMPORALSTORE_LIB_DIR' direct.log || {
            echo "FAIL: --features direct failed without naming TEMPORALSTORE_LIB_DIR"
            sed -n '1,40p' direct.log
            exit 1
          }
          grep -q 'undefined symbol' direct.log && {
            echo "FAIL: --features direct still reaches the linker"
            exit 1
          }
          echo "OK: build.rs refused --features direct with the documented message"
          rm -f direct.log

      # Builds the crate from its own packaged tarball, exactly as someone who
      # downloads it would. This is the same verification `cargo publish
      # --dry-run` performs, without needing a registry token.
      - name: cargo package (verify the published tarball builds)
        run: cargo package --locked
