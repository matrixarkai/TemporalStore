name: Rust CI

# Compile the Rust workspace. `cargo check --all-targets` is the fast gate that
# runs on every Rust-touching push; the heavier release build + single-threaded
# release test suite (a few high-cardinality tests are O(n^2) and far too slow
# unoptimized) runs on pull requests and once nightly -- NOT on every push. That
# keeps Actions minutes down on a high-churn main while PRs still get full CI.

on:
  push:
    branches: [main, rust-main]
    # Push only runs the fast `check` job (below); skip even that on
    # doc/tool/website-only commits.
    paths:
      - 'crates/**'
      - 'sdk/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    # No `branches:` filter here, deliberately. This key filters on the BASE branch, and a
    # stacked pull request is based on the branch below it, not on main -- so this job did not
    # run on one at all. Worse, when the branch below it merged, GitHub retargeted the pull
    # request to main and did NOT re-run anything: the stale checks from the feature-branch
    # days stayed green and the pull request merged reporting success from a job that had
    # never seen it. Running on every pull request costs a few Actions minutes and is the only
    # way the gate covers the changes that actually reach main.
  schedule:
    - cron: '0 7 * * *'  # nightly full build + test on the default branch
  workflow_dispatch:

# Cancel superseded runs on the same ref so rapid pushes to a busy branch do not
# each re-run CI -- only the newest commit's run survives.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check (fast, on push)
    # On push we only spend the fast compile gate; PRs / nightly run the full
    # build+test job below instead.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        # librocksdb-sys (via matrixcache's rocksdb-ssd feature) runs bindgen and
        # needs libclang; building RocksDB itself needs cmake.
        #
        # protobuf-compiler is NOT optional and is NOT provided by the runner image.
        # `raft-proto`'s build script runs prost-build, which shells out to `protoc`
        # and panics without it. This was absent here and the gate still passed for
        # months: `actions/cache` restores `target`, so the DEBUG build-script output
        # came back from the cache and `cargo check` never re-ran it, while the
        # release build below had nothing cached and had to. The job therefore failed
        # only on the release profile, which made it look like a release-only problem
        # rather than a missing package. Installing it here instead of relying on the
        # image means a cold cache fails nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake protobuf-compiler

      - name: Install Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update && rustup default 1.89.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo check (all targets)
        run: cargo check -p temporalstore-rust --all-targets

  build-and-test:
    name: cargo check / build / test
    # Runs on pull requests, the nightly schedule, and manual dispatch -- NOT on
    # push, so post-merge pushes to a busy main do not each pay the ~45-min run.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        # librocksdb-sys (via matrixcache's rocksdb-ssd feature) runs bindgen and
        # needs libclang; building RocksDB itself needs cmake.
        #
        # protobuf-compiler is NOT optional and is NOT provided by the runner image.
        # `raft-proto`'s build script runs prost-build, which shells out to `protoc`
        # and panics without it. This was absent here and the gate still passed for
        # months: `actions/cache` restores `target`, so the DEBUG build-script output
        # came back from the cache and `cargo check` never re-ran it, while the
        # release build below had nothing cached and had to. The job therefore failed
        # only on the release profile, which made it look like a release-only problem
        # rather than a missing package. Installing it here instead of relying on the
        # image means a cold cache fails nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake protobuf-compiler

      - name: Install Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update && rustup default 1.89.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo check (all targets)
        run: cargo check -p temporalstore-rust --all-targets

      # This example requires the optional backend and are skipped by default builds.
      # Run the assertions: compiling a report does not enforce its byte ceilings.
      - name: One append storage cost and recovery
        run: cargo run --release --locked -p temporalstore-rust --features matrixobject --example one_append_amplification_report
      # The scale report asserts the shape of BOTH sides -- bytes and block lookups per
      # entry, the per-replica star write, and now what a read actually fetched. None of it
      # ran here: the only example this job ran was the one above, so every assertion in it
      # was decoration. It is run at a small sweep because the assertions compare rounds
      # against each other and two sizes is enough to tell a constant from a line, while the
      # shipped default sweep takes minutes.
      - name: The shared store's read and write shape at scale
        run: |
          set -o pipefail
          MATRIXARK_SCALE_SIZES=200,400 cargo run --release --locked -p temporalstore-rust --features matrixobject --example scale_shared_store_report | tee /tmp/scale-shape.log
          # The report exits 0 only by reaching its own assertions; this is what catches it
          # exiting early with nothing asserted.
          grep -q 'Converged on every node at every size' /tmp/scale-shape.log
          grep -q 'fetched/returned' /tmp/scale-shape.log

      - name: cargo build (release service binaries)
        run: cargo build --release -p temporalstore-rust --bin matrixark_rust_metaserver --bin matrixark_rust_datanode

      # The compile gates above are what enforce this workflow. The suite is run
      # for visibility but is NOT yet a required gate: the tree carries a small
      # number of known, pre-existing baseline failures. Flip continue-on-error
      # off once the baseline is fully green.
      #
      # `--no-fail-fast` is what makes "for visibility" true of more than the lib.
      # cargo stops at the first failing TARGET, not the first failing test, and the
      # two known lib failures were stopping it before it reached any of the sixteen
      # binaries under `tests/` -- the whole integration suite, including
      # `wal_single_barrier_recovery`, never ran. `continue-on-error` does not help:
      # it stops the step failing the job, which is why this reported success, and has
      # no effect on cargo's own stopping. The run for mx#1180 printed two
      # `test result:` lines for a command asked to run fifteen targets.
      - name: cargo test (lib + integration, single-threaded, release)
        timeout-minutes: 45
        continue-on-error: true
        run: cargo test --release -p temporalstore-rust --lib --tests --no-fail-fast -- --test-threads=1

      # The step above is `continue-on-error`, so it REPORTS and does not GATE. The
      # sender attribution below has to gate: when it broke, the three-node chaos
      # harness went on claiming it had cut a node off while the leader kept
      # replicating to it, and because nothing runs that harness the lie was
      # invisible for 2,463 commits. The failure shape is silent by construction --
      # the attribution returns None, None reads as "no peer to filter", and the
      # filter allows -- so only an assertion catches it.
      #
      # `cargo test` EXITS 0 WHEN THE FILTER MATCHES NOTHING, so a renamed or moved
      # test would turn this gate into a no-op that still reports success. The grep
      # on `1 passed` is what makes the gate real; do not drop it.
      # Five guards:
      #   - the sender attribution, whose silent failure made the chaos harness lie
      #   - the majority check, which is the ONLY thing refusing a read on a node that has lost
      #     its peers; the freshness bar beside it is a value the node maintains itself and
      #     freezes when it is cut off, so it cannot refuse
      #   - binary outcome records must recover without a command
      #   - a cycle request body that names no per-round bound must still decode to the
      #     bounded round. 0 means NO bound in every one of them, a bare `#[serde(default)]`
      #     on a number decodes an absent field to 0, and both cycle endpoints build the
      #     request from a parsed body -- so the shipped bounds reached no HTTP caller at all
      #     while the guard beside it, which asserts `Default`, stayed green
      #   - and those shipped values are non-zero, which the equality above cannot say on its
      #     own: if every bound went to 0 in `Default` too, both sides would agree
      #   - the metadata log's RECOVERY PROTOCOL. The log is a SEQUENCE, so its framing carries
      #     torn-tail recovery and not just separation: a partial record at the end is dropped
      #     and REMOVED (left in place it splices onto the next append, which then reads as the
      #     torn tail and is dropped on the following restart -- silently losing a write that WAS
      #     acknowledged), while a record that does not parse with records AFTER it is a hard
      #     error, because those were acknowledged too. Four arms, one per property, plus the
      #     0x0A invariant: a binary payload contains newlines freely, and the reader used to
      #     split on them.
      #   - the durable command encoding: the four guards below say which write commands reach
      #     the shared WAL as protobuf and which still reach it as JSON. They were pinned
      #     NOWHERE until now, so they ran only in the advisory step above -- and that step is
      #     `continue-on-error`, so the roster could have gone stale, or a write could have
      #     rejoined the JSON arm, behind a green check. Two of the four assert a DENOMINATOR
      #     (the case count, the parsed variant count) because both read source text or a fixed
      #     list, and a list that shrank to nothing would otherwise satisfy every claim in them
      - name: cargo test (read-safety guards, hard gate)
        timeout-minutes: 20
        run: |
          set -o pipefail
          # One invocation per guard, because `cargo test` takes a single positional filter and a
          # second one is silently an error rather than a second filter.
          for t in \
            raft::tests::part5::only_the_majority_check_refuses_a_read_on_a_node_that_lost_its_peers \
            raft::tests::part5::the_sender_of_an_append_is_attributed_in_both_encodings \
            shared_store::tests::outcome_only_binary_frames_recover_in_every_supported_format \
            shared_store::tests::default_shared_wal_preserves_multiple_binary_outcomes_beside_a_per_key_object \
