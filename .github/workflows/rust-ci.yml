name: Rust CI

# Compile the Rust workspace. `cargo check --all-targets` is the fast gate that
# runs on every Rust-touching push; the heavier release build + single-threaded
# release test suite (a few high-cardinality tests are O(n^2) and far too slow
# unoptimized) runs on pull requests and once nightly -- NOT on every push. That
# keeps Actions minutes down on a high-churn main while PRs still get full CI.

on:
  push:
    branches: [main, rust-main]
    # Push only runs the fast `check` job (below); skip even that on
    # doc/tool/website-only commits.
    paths:
      - 'crates/**'
      - 'sdk/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    # No `branches:` filter here, deliberately. This key filters on the BASE branch, and a
    # stacked pull request is based on the branch below it, not on main -- so this job did not
    # run on one at all. Worse, when the branch below it merged, GitHub retargeted the pull
    # request to main and did NOT re-run anything: the stale checks from the feature-branch
    # days stayed green and the pull request merged reporting success from a job that had
    # never seen it. Running on every pull request costs a few Actions minutes and is the only
    # way the gate covers the changes that actually reach main.
  schedule:
    - cron: '0 7 * * *'  # nightly full build + test on the default branch
  workflow_dispatch:

# Cancel superseded runs on the same ref so rapid pushes to a busy branch do not
# each re-run CI -- only the newest commit's run survives.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check (fast, on push)
    # On push we only spend the fast compile gate; PRs / nightly run the full
    # build+test job below instead.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        # librocksdb-sys (via matrixcache's rocksdb-ssd feature) runs bindgen and
        # needs libclang; building RocksDB itself needs cmake.
        #
        # protobuf-compiler is NOT optional and is NOT provided by the runner image.
        # `raft-proto`'s build script runs prost-build, which shells out to `protoc`
        # and panics without it. This was absent here and the gate still passed for
        # months: `actions/cache` restores `target`, so the DEBUG build-script output
        # came back from the cache and `cargo check` never re-ran it, while the
        # release build below had nothing cached and had to. The job therefore failed
        # only on the release profile, which made it look like a release-only problem
        # rather than a missing package. Installing it here instead of relying on the
        # image means a cold cache fails nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake protobuf-compiler

      - name: Install Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update && rustup default 1.89.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo check (all targets)
        run: cargo check -p temporalstore-rust --all-targets

  build-and-test:
    name: cargo check / build / test (required)
    # Runs on pull requests, the nightly schedule, and manual dispatch -- NOT on
    # push, so post-merge pushes to a busy main do not each pay the ~45-min run.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        # librocksdb-sys (via matrixcache's rocksdb-ssd feature) runs bindgen and
        # needs libclang; building RocksDB itself needs cmake.
        #
        # protobuf-compiler is NOT optional and is NOT provided by the runner image.
        # `raft-proto`'s build script runs prost-build, which shells out to `protoc`
        # and panics without it. This was absent here and the gate still passed for
        # months: `actions/cache` restores `target`, so the DEBUG build-script output
        # came back from the cache and `cargo check` never re-ran it, while the
        # release build below had nothing cached and had to. The job therefore failed
        # only on the release profile, which made it look like a release-only problem
        # rather than a missing package. Installing it here instead of relying on the
        # image means a cold cache fails nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake protobuf-compiler

      - name: Install Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update && rustup default 1.89.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo check (all targets)
        run: cargo check -p temporalstore-rust --all-targets

      - name: cargo test (quarantine discovery and guarded completion, hard gate)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export CARGO_TERM_COLOR=never
          passed_tests=0
          for t in \
            block_store::quarantine_scan_tests::paused_quarantine_enumeration_allows_independent_append_and_sync \
            block_store::quarantine_scan_tests::a_stale_discovery_does_not_destroy_an_entry_twice \
            block_store::quarantine_scan_tests::a_concurrent_arrival_invalidates_scan_and_empty_memo \
            block_store::quarantine_scan_tests::a_pin_admitted_after_discovery_restores_before_destroying \
            block_store::quarantine_scan_tests::a_same_id_install_invalidates_discovery_without_overwriting_bytes \
            block_store::quarantine_scan_tests::scan_keeps_selected_successful_work_cap_and_live_restore_priority \
            block_store::quarantine_scan_tests::a_failed_directory_sync_does_not_publish_manifest_before_reopen \
            block_store::quarantine_scan_tests::productive_discovery_next_and_stat_allow_durable_commit_before_release \
            block_store::quarantine_scan_tests::successful_work_reaches_past_a_full_skipped_prefix_without_false_memos
          do
            cargo test --locked --release -p temporalstore-rust --lib "$t" \
              -- --exact --include-ignored --test-threads=1 --color never 2>&1 | tee /tmp/quarantine-discovery.log
            running=$(grep -Ec '^running [0-9]+ tests?$' /tmp/quarantine-discovery.log || true)
            one=$(grep -Fxc 'running 1 test' /tmp/quarantine-discovery.log || true)
            rows=$(grep -Ec '^test .* \.\.\. ' /tmp/quarantine-discovery.log || true)
            exact_ok=$(grep -Fxc "test $t ... ok" /tmp/quarantine-discovery.log || true)
            summaries=$(grep -Ec '^test result:' /tmp/quarantine-discovery.log || true)
            passed=$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$' /tmp/quarantine-discovery.log || true)
            if [ "$running" != "1" ] || [ "$one" != "1" ] || [ "$rows" != "1" ] \
              || [ "$exact_ok" != "1" ] || [ "$summaries" != "1" ] || [ "$passed" != "1" ]; then
              echo "::error::$t: expected exactly one named pass and zero failed, ignored or measured tests"
              exit 1
            fi
            passed_tests=$((passed_tests + 1))
          done
          [ "$passed_tests" -eq 9 ] || { echo '::error::expected nine quarantine discovery and guarded completion tests'; exit 1; }

      - name: Owner state preservation controls v7 (hard gate)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export CARGO_TERM_COLOR=never
          mkdir -p "$RUNNER_TEMP/owner-claim-fix-v7"
          passed_tests=0
          for selector in \
            engine::storage_bucket_internals::physical_ownership_rebuild_preserves_pending_claims_and_empty_owner_state \
            engine::storage_bucket_internals::a_real_wal_resident_readd_clears_the_empty_deleted_owner_before_refresh \
            engine::storage_bucket_internals::accepted_blockless_request_revives_owner_without_erasing_deleted_string_identity \
            engine::storage_bucket_internals::deleting_the_last_physical_key_preserves_a_live_blockless_peer_in_its_bucket \
            engine::storage_bucket_internals::deleting_last_metadata_keeps_released_physical_owner_live \
            engine::storage_bucket_internals::element_tombstone_keeps_a_live_blockless_peer_in_both_orders
          do
            log="$RUNNER_TEMP/owner-claim-fix-v7/$passed_tests.log"
            cargo test --locked --release -p temporalstore-rust --lib "$selector" \
              -- --exact --test-threads=1 --color never 2>&1 | tee "$log"
            python3 - "$log" "$selector" <<'PY'
          import pathlib
          import re
          import sys

          path, selector = pathlib.Path(sys.argv[1]), sys.argv[2]
          if path.stat().st_size > 8 * 1024 * 1024:
              raise SystemExit("owner-state control log exceeds eight MiB")
          text = path.read_text(encoding="utf-8", errors="strict")
          lines = text.splitlines()
          if [s for s in lines if re.fullmatch(r"running [0-9]+ tests?", s)] != ["running 1 test"]:
              raise SystemExit("expected exactly one running owner-state control")
          if [s for s in lines if s.startswith("test ") and not s.startswith("test result:")] != ["test " + selector + " ... ok"]:
              raise SystemExit("expected the exact positive owner-state selector")
          summaries = [s for s in lines if s.startswith("test result:")]
          if len(summaries) != 1 or not re.fullmatch(
              r"test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+(?:\.[0-9]+)?s", summaries[0]
          ):
              raise SystemExit("expected one positive complete owner-state summary")
          if re.search(r"\b(?:cancelled|canceled|cancellation|interrupted|SIGTERM|SIGINT)\b", text, re.I):
              raise SystemExit("cancelled or interrupted owner-state control")
          print("PASS: exactly one named owner-state control")
          PY
            passed_tests=$((passed_tests + 1))
          done
          [ "$passed_tests" -eq 6 ] || { echo '::error::expected six exact owner-state controls'; exit 1; }

      - name: Retain owner state preservation v7 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-state-preservation-v7-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/owner-claim-fix-v7/*.log

      - name: Owner transition diagnostic (hard gate)
        timeout-minutes: 45
        run: |
          set -euo pipefail
          export CARGO_TERM_COLOR=never
          mkdir -p "$RUNNER_TEMP/owner-stage-trace"
          log="$RUNNER_TEMP/owner-stage-trace/trace.log"
          selector=engine::tests::round_backlog_cost::a_full_no_dump_cycle_names_the_first_owner_claim_transition
          cargo test --locked --release -p temporalstore-rust --lib "$selector" \
            -- --exact --nocapture --test-threads=1 --color never 2>&1 | tee "$log"
          python3 - "$log" "$selector" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          selector = sys.argv[2]
          assert len(re.findall(r"^running [0-9]+ tests?$", text, re.M)) == 1
          assert len(re.findall(r"^running 1 test$", text, re.M)) == 1
          assert len(re.findall(r"^test " + re.escape(selector) + r" \.\.\.", text, re.M)) == 1
          assert len(re.findall(r"^test result:", text, re.M)) == 1
          assert len(re.findall(r"^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+(?:\.[0-9]+)?s$", text, re.M)) == 1
          assert not re.search(r"\b(?:cancelled|canceled|SIGTERM|SIGINT)\b", text, re.I)
          observed = re.findall(r"owner-boundary round=([0-9]+) boundary=([a-z_]+)", text)
          expected = [(str(i), name) for i in range(3) for name in ['before_initial_plan', 'after_initial_plan', 'after_prepare', 'after_materialize_before_lifecycle', 'after_reclaim_wal', 'after_expire', 'after_evict', 'after_reclaim_page', 'after_install_prune_before_catalog', 'after_catalog_before_index_gc_report', 'after_index_gc', 'after_merged_policy', 'after_compact', 'after_reap_metrics', 'before_return']]
          assert observed == expected, (len(observed), observed)
          print("PASS: one exact positive diagnostic and all 45 ordered boundaries")
          PY

      - name: Retain owner transition diagnostic trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-stage-trace-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/owner-stage-trace/trace.log

      # Direct mode over the shared client SDK is part of the default build, so the default job
      # builds it and runs its tests: the gateway-versus-direct fixtures and the direct door.
      - name: Direct mode over the shared client SDK (default build)
        run: |
          set -euo pipefail
          cargo test --locked -p temporalstore-rust --lib matrixobject_direct \
            -- --test-threads=1 2>&1 | tee /tmp/direct-sdk-default.log
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed;' /tmp/direct-sdk-default.log

      - name: Direct and gateway recovery assertions
        run: |
          set -euo pipefail
          bash -n scripts/direct_data_server_e2e.sh
          python3 -I -m unittest discover -s scripts -p test_direct_data_server_e2e_assertions.py 2>&1 | tee /tmp/direct-e2e-assertions.log
          grep -q '^Ran 9 tests in ' /tmp/direct-e2e-assertions.log

      - name: Recovery dirty bucket selection checks
        timeout-minutes: 30
        run: |
          set -euo pipefail
          for test in \
            missing_dirty_bucket_selection_does_not_list_live_blocks \
            empty_dirty_nodes_remain_visible_without_blocks \
            metadata_and_container_models_use_the_same_dirty_selection \
            a_dumped_bucket_does_not_hide_dirty_neighbours \
            node_flags_not_key_ledger_counts_decide_coverage \
            unloaded_shard_has_no_missing_dirty_buckets; do
            cargo test --locked -p temporalstore-rust --lib --release \
              "engine::storage_reports::recovery_dirty_bucket_tests::$test" \
              -- --exact --test-threads=1 2>&1 | tee /tmp/recovery-dirty-bucket.log
            grep -q 'running 1 test' /tmp/recovery-dirty-bucket.log
            grep -q 'test result: ok\. 1 passed; 0 failed; 0 ignored;' /tmp/recovery-dirty-bucket.log
          done

      - name: Ollama extraction source isolation checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test --locked -p temporalstore-rust --lib --features alloc-probe llm_context::ollama::tests:: \
            -- --test-threads=1 2>&1 | tee /tmp/ollama-source-isolation.log
          grep -q 'test result: ok\. 10 passed; 0 failed;' /tmp/ollama-source-isolation.log

      - name: Resource chunk content checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test --locked -p temporalstore-rust --lib --features alloc-probe resource_chunk_tests \
            -- --test-threads=1 2>&1 | tee /tmp/resource-chunk-content.log
          grep -q 'test result: ok\. 8 passed; 0 failed;' /tmp/resource-chunk-content.log

      - name: Embedding owner search checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test --locked -p temporalstore-rust --lib --features alloc-probe llm_context::embedding_index::tests:: \
            -- --test-threads=1 2>&1 | tee /tmp/embedding-owner-search.log
          grep -q 'test result: ok\. 16 passed; 0 failed;' /tmp/embedding-owner-search.log

      - name: Inferred memory fact checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test -p temporalstore-rust --lib --features alloc-probe inferred_memory_ \
            -- --test-threads=1 2>&1 | tee /tmp/inferred-memory-gate.log
          grep -q 'test result: ok\. 15 passed; 0 failed;' /tmp/inferred-memory-gate.log

      - name: Memory input buffer ownership checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test -p temporalstore-rust --lib --features alloc-probe memory_input_ \
            -- --test-threads=1 2>&1 | tee /tmp/memory-input-gate.log
          grep -q 'test result: ok\. 7 passed; 0 failed;' /tmp/memory-input-gate.log

      - name: Memory fact source accounting checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test -p temporalstore-rust --bin mem0_scale_harness memory_add_receipt \
            -- --test-threads=1 2>&1 | tee /tmp/memory-source-count-gate.log
          grep -q 'test result: ok\. 2 passed; 0 failed;' /tmp/memory-source-count-gate.log

      - name: Memory protobuf route checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test -p temporalstore-rust --bin server context_explicit_route \
            -- --test-threads=1 2>&1 | tee /tmp/memory-protobuf-route-gate.log
          grep -q 'test result: ok\. 1 passed; 0 failed;' /tmp/memory-protobuf-route-gate.log

      - name: Batch WAL durability checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test -p temporalstore-rust --lib --features alloc-probe batch_wal_barrier \
            -- --test-threads=1 2>&1 | tee /tmp/batch-wal-barrier-gate.log
          grep -q 'test result: ok\. 4 passed; 0 failed;' /tmp/batch-wal-barrier-gate.log

      - name: Follower catch-up cost checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test -p temporalstore-rust --lib --features alloc-probe a_follower_catch_up \
            -- --test-threads=1 2>&1 | tee /tmp/follower-catch-up-gate.log
          grep -q 'test result: ok\. 2 passed; 0 failed;' /tmp/follower-catch-up-gate.log

      - name: Index-log fold keeps earlier feature blocks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test -p temporalstore-rust --lib the_index_log_fold_keeps_earlier_feature_blocks \
            -- --test-threads=1 2>&1 | tee /tmp/fold-keeps-feature-blocks.log
          grep -q 'test result: ok\. 2 passed; 0 failed;' /tmp/fold-keeps-feature-blocks.log

      - name: Bounded memory deletion checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test -p temporalstore-rust --lib --features alloc-probe batch_delete_pages \
            -- --test-threads=1 2>&1 | tee /tmp/memory-delete-pages-gate.log
          grep -q 'test result: ok\. 7 passed; 0 failed;' /tmp/memory-delete-pages-gate.log

      - name: Memory deletion cleanup checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test -p temporalstore-rust --lib --features alloc-probe delete_cleanup_failure \
            -- --test-threads=1 2>&1 | tee /tmp/memory-delete-cleanup-gate.log
          grep -q 'test result: ok\. 4 passed; 0 failed;' /tmp/memory-delete-cleanup-gate.log

      - name: Repeated memory API workload checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test -p temporalstore-rust --bin mem0_scale_harness crud::tests \
            -- --test-threads=1 2>&1 | tee /tmp/memory-crud-gate.log
          grep -q 'test result: ok\. 5 passed; 0 failed;' /tmp/memory-crud-gate.log

      - name: Batch deletion acknowledgment checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test -p temporalstore-rust --lib --features alloc-probe batch_delete_ack \
            -- --test-threads=1 2>&1 | tee /tmp/memory-delete-ack-gate.log
          grep -q 'test result: ok\. 5 passed; 0 failed;' /tmp/memory-delete-ack-gate.log

      - name: Affected bucket update checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          cargo test -p temporalstore-rust --lib --features alloc-probe affected_bucket_survivors \
            -- --test-threads=1 --nocapture 2>&1 | tee /tmp/affected-bucket-gate.log
          grep -q 'test result: ok\. 4 passed; 0 failed;' /tmp/affected-bucket-gate.log

      - name: Retention and block ownership checks
        timeout-minutes: 30
        run: |
          set -o pipefail
          for spec in retention_work_tests:4 compaction_retention_tests:3 physical_wal_:5 block_owner_query_tests:3 record_frame_alloc_probe:1; do
            filter=${spec%:*}
            expected=${spec##*:}
            cargo test -p temporalstore-rust --lib --features alloc-probe "$filter" \
              -- --test-threads=1 --nocapture 2>&1 | tee /tmp/wal-retention-gate.log
            grep -q "test result: ok\. $expected passed; 0 failed;" /tmp/wal-retention-gate.log \
              || { echo "::error::$filter: expected $expected passing tests"; exit 1; }
          done

      - name: cargo build (release service binaries)
        run: cargo build --release -p temporalstore-rust --bin matrixark_rust_metaserver --bin matrixark_rust_datanode

      - name: Networked durability startup fails closed
        run: python3 scripts/check_networked_startup_failure.py target/release/matrixark_rust_datanode

      - name: Active index gate record accounting checks
        run: |
          set -o pipefail
          for t in \
            index_log::gate_records_tests::append_maintained_gate_matches_cold_reads_at_every_floor \
            index_log::gate_records_tests::a_cold_gate_reads_once_and_later_appends_extend_it \
            index_log::gate_records_tests::collection_rewrites_and_sequence_holes_invalidate_the_gate \
            index_log::gate_records_tests::rolling_replaces_only_the_active_gate_records \
            index_log::gate_records_tests::active_gate_memory_is_capped_and_a_roll_starts_a_new_cache \
            index_log::gate_records_tests::anchor_and_delta_appends_share_the_same_gate_boundaries \
            index_log::gate_records_tests::undecodable_and_nonmonotonic_records_never_create_a_gate_cache \
            index_log::gate_records_tests::a_torn_active_tail_is_never_cached_as_a_complete_piece \
            index_log::gate_records_tests::warm_collection_validates_the_active_piece_only_once \
            index_log::gate_records_tests::a_validated_cold_gate_also_proves_the_collection_tail \
            index_log::gate_records_tests::cold_collection_keeps_the_repair_pass \
            index_log::gate_records_tests::a_changed_warm_tail_is_repaired_before_collection \
            index_log::gate_records_tests::warm_collection_still_refuses_complete_corrupt_records \
            index_log::tests::the_gate_reads_piece_names_not_every_record; do
            cargo test --release -p temporalstore-rust --lib "$t" \
              -- --exact --test-threads=1 2>&1 | tee /tmp/index-gate-records.log
            grep -q '^running 1 test$' /tmp/index-gate-records.log
            grep -q 'test result: ok\. 1 passed; 0 failed;' /tmp/index-gate-records.log
          done

      - name: Raft cache write admission checks
        run: |
          set -o pipefail
          for t in \
            raft::tests::part2::quorum_refusal_before_append_is_retryable_without_writing \
            raft::tests::part2::a_local_follower_cannot_propose_through_the_remote_leaders_shadow \
            raft::tests::part2::deployed_quorum_recovery_defers_an_unreachable_uncompacted_peer; do
            cargo test --release -p temporalstore-rust --lib "$t" \
              -- --exact --test-threads=1 2>&1 | tee /tmp/raft-cache-admission.log
            grep -Fq 'test result: ok. 1 passed; 0 failed;' /tmp/raft-cache-admission.log
          done

      # The delta records of concurrent writers reach the index log as one write per batch.
      # `cargo test` EXITS 0 WHEN THE FILTER MATCHES NOTHING, so each name is run alone and the
      # greps below fail the step if it matched no test or did not pass.
      - name: Index log batched append checks
        run: |
          set -o pipefail
          for t in \
            index_log::index_log_group_write_tests::a_record_nothing_waits_on_is_numbered_and_queued_not_written \
            index_log::index_log_group_write_tests::a_reader_finishes_the_queue_first_and_it_is_one_write_in_order \
            index_log::index_log_group_write_tests::a_record_that_asks_to_be_durable_is_written_after_what_is_queued \
            index_log::index_log_group_write_tests::dropping_the_store_writes_the_tail_and_the_next_store_continues_the_numbering \
            index_log::index_log_group_write_tests::a_failed_batch_is_retried_whole_and_never_duplicated \
            index_log::index_log_group_write_tests::a_write_that_stops_part_way_is_cut_back_so_the_retry_leaves_no_torn_record \
            index_log::index_log_group_write_tests::appenders_on_many_threads_share_writes_and_no_record_is_lost_or_reordered \
            index_log::index_log_group_write_tests::with_the_switch_off_every_record_is_written_at_once \
            index_log::index_log_group_write_tests::a_queue_nobody_reads_is_written_by_the_loop_flusher; do
