name: MatrixArk Context Backfill CI

on:
  push:
    branches:
      - main
    paths:
      - "docs/matrixark_context_backfill.md"
      - "docs/open_source_readiness.md"
      - "tools/matrixark_context_backfill*.py"
      - "tools/matrixark_dual_write_ingestion_benchmark.py"
      - "tools/run_matrixark_context_backfill_ci_gate_ubuntu22.sh"
      - "tools/test_matrixark_context_backfill*.py"
      - "tools/test_matrixark_dual_write_ingestion_benchmark.py"
      - "tools/test_validate_matrixark_context_backfill_readiness.py"
      - "tools/test_validate_open_source_readiness.py"
      - "tools/test_verify_matrixark_context_backfill_ci_evidence.py"
      - "tools/validate_matrixark_context_backfill_readiness.py"
      - "tools/validate_open_source_readiness.py"
      - "tools/verify_matrixark_context_backfill_ci_evidence.py"
      - ".github/workflows/matrixark-context-backfill-ci.yml"
  pull_request:
    paths:
      - "docs/matrixark_context_backfill.md"
      - "docs/open_source_readiness.md"
      - "tools/matrixark_context_backfill*.py"
      - "tools/matrixark_dual_write_ingestion_benchmark.py"
      - "tools/run_matrixark_context_backfill_ci_gate_ubuntu22.sh"
      - "tools/test_matrixark_context_backfill*.py"
      - "tools/test_matrixark_dual_write_ingestion_benchmark.py"
      - "tools/test_validate_matrixark_context_backfill_readiness.py"
      - "tools/test_validate_open_source_readiness.py"
      - "tools/test_verify_matrixark_context_backfill_ci_evidence.py"
      - "tools/validate_matrixark_context_backfill_readiness.py"
      - "tools/validate_open_source_readiness.py"
      - "tools/verify_matrixark_context_backfill_ci_evidence.py"
      - ".github/workflows/matrixark-context-backfill-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrixark-context-backfill-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backfill-readiness:
    name: Backfill readiness gate
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      MATRIXARK_BACKFILL_CI_RECORDS: "128"
      MATRIXARK_BACKFILL_CI_BATCH_SIZES: "32,64"
      MATRIXARK_BACKFILL_CI_INCREMENTAL_RECORDS: "32"
      MATRIXARK_BACKFILL_CI_REPEAT: "2"
      MATRIXARK_BACKFILL_CI_JSON_OUTPUT: "matrixark_context_backfill_readiness.json"
      MATRIXARK_BACKFILL_CI_EVIDENCE_DIR: "matrixark_context_backfill_evidence"
      MATRIXARK_BACKFILL_CI_EVIDENCE_MANIFEST: "matrixark_context_backfill_evidence/manifest.json"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run MatrixArk backfill readiness gate
        run: tools/run_matrixark_context_backfill_ci_gate_ubuntu22.sh

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrixark-context-backfill-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            matrixark_context_backfill_readiness.json
            matrixark_context_backfill_evidence/
