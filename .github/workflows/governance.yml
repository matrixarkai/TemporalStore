name: Governance

# Additive OSS-governance gates: SPDX license-header enforcement on Rust
# sources and forward-looking secret scanning. Both jobs are dependency-light
# (no Rust toolchain, no private git dependencies) so they stay green on any
# runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-headers:
    name: license headers (SPDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SPDX Apache-2.0 header on all Rust sources
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files 'crates/**/*.rs' 'sdk/**/*.rs')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          # A scan that matches nothing passes every check below it, which is how a licence gate
          # goes quietly blind: the headers do not have to disappear, the GLOB only has to stop
          # matching -- a directory rename, or a checkout that did not fetch them. 402 sources
          # matched when this floor was written, so it has ample headroom for ordinary churn and
          # only fires when the scan itself has stopped working.
          if [ "$count" -lt 50 ]; then
            echo "Only $count Rust sources matched 'crates/**/*.rs' 'sdk/**/*.rs'."
            echo "The scan is not reading the tree, so a clean result below would mean nothing."
            exit 1
          fi
          # grep -L exits 1 when EVERY file matches, which is this gate's success case, so the
          # status cannot simply be trusted. But `|| true` swallowed 2+ as well, and a grep that
          # failed to run reported no missing headers -- the same blindness one layer down.
          set +e
          missing=$(grep -L 'SPDX-License-Identifier: Apache-2.0' $files)
          status=$?
          set -e
          if [ "$status" -ge 2 ]; then
            echo "grep exited $status while scanning $count files; the scan did not complete."
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "The following Rust sources are missing the SPDX Apache-2.0 header:"
            echo "$missing"
            exit 1
          fi
          echo "OK: all $count Rust sources carry the SPDX Apache-2.0 header."

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks CLI directly (pinned) rather than gitleaks-action@v2:
      # the action wrapper does not reliably apply the repo-root .gitleaks.toml
      # allowlist, and the CLI invocation below is exactly what maintainers run
      # locally to validate the same allowlist against full history.
      - name: Run gitleaks
        run: |
          set -euo pipefail
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
