syntax = "proto3";

package bcache2.bench;

import "server.proto";

option cc_generic_services = true;

service BenchService {
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
}

message GetStatsRequest {
}

message GetStatsResponse {
  CommandStats total_stats = 1;
  repeated CommandStats command_stats = 2;
  bool checking = 3;
  bool consistency = 4;
  uint64 round = 5;
}

message CommandStats {
  string command = 1;
  uint64 total_qps = 2;
  uint64 success_qps = 3;
  uint64 failed_qps = 4;
  uint64 avg_latency_us = 5;
  uint64 p50_latency_us = 6;
  uint64 p99_latency_us = 7;
  uint64 send_throughput_bytes = 8;
  uint64 receive_throughput_bytes = 9;
}

message Operation {
    uint32 module_id = 1;
    uint32 function_id = 2;
    bytes  key = 3;
    bytes  request_bytes = 4;
    bytes  response_bytes = 5;
    uint64 start_time_us = 6;
    uint64 end_time_us = 7;
    int32 code = 8;
    string message = 9;
}
